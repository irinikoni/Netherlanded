# Deploys supabase/functions/* to the hosted project after the verification suite
# passes on main. The Supabase GitHub integration applies migrations and function
# settings, but does not update function code; this workflow does.
# Requires the repository secret SUPABASE_ACCESS_TOKEN (a Supabase personal access token).
name: Deploy Edge Functions

on:
  workflow_run:
    workflows: [ "Netherlanded Verification Suite" ]
    types: [ completed ]
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-functions
  cancel-in-progress: false

jobs:
  deploy:
    # Only after a green CI run of a push to main (or a manual run).
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: niquwpbkibalrprauxvl
    steps:
      - name: Checkout the commit that passed CI
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Require the access token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Repository secret SUPABASE_ACCESS_TOKEN is not set"; exit 1
          fi

      - name: Check supabase/ mirror matches edge/
        run: python3 tools/sync_supabase.py --check

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy functions (verify_jwt per supabase/config.toml)
        run: supabase functions deploy --project-ref "$PROJECT_REF" --use-api
