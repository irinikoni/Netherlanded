# Netherlanded Production Reverse-Proxy & Gateway Hardening (Nginx / Cloudflare)
# Resolves SECURITY_AUDIT.md Finding P11 (framing + MIME sniffing) and LEGAL_DELTA.md #9
# (strip client IP addresses before persistent logs; cap technical log retention <= 24h).

# --- 1. IP-free access log format & in-memory edge rate limit (zero IPs written to disk) ---
log_format nl_ip_free '$time_iso8601 "$request_method $uri" $status $body_bytes_sent $request_time';
limit_req_zone $binary_remote_addr zone=nl_ingest:10m rate=30r/m;

server {
    listen 443 ssl;
    http2 on;  # needs nginx >= 1.25.1; on older nginx use 'listen 443 ssl http2;' instead
    server_name app.netherlanded.example;

    # Log without client IP; rotate daily and delete logs older than 24 hours via logrotate.
    # error_log disabled on disk so Nginx never writes `client: <IP>`; use an IP-scrubbing syslog pipe if needed.
    access_log /var/log/nginx/netherlanded.access.log nl_ip_free;
    error_log  /dev/null crit;

    # Do not disclose the nginx version in the Server header or error pages.
    server_tokens off;
    # Explicit TLS policy (do not rely on distribution defaults).
    ssl_protocols TLSv1.2 TLSv1.3;

    # --- 2. Server-level security headers ---
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # --- 3. Root Service Worker scope header ---
    location = /sw.js {
        add_header Service-Worker-Allowed "/" always;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # --- 4. Telemetry ingest proxy: rate limit in memory, then strip IP/UA before upstream ---
    location ~ ^/api/(t1|t2)$ {
        limit_req zone=nl_ingest burst=60 nodelay;
        limit_req_status 429;
        client_max_body_size 64k;

        rewrite ^/api/(t1|t2)$ /functions/v1/ingest/$1 break;
        proxy_pass https://YOUR_SUPABASE_HOST;
        proxy_ssl_server_name on;
        proxy_set_header Host YOUR_SUPABASE_HOST;
        proxy_set_header X-NL-Proxy-Secret "REPLACE_WITH_NL_PROXY_SECRET";

        proxy_set_header Cookie "";
        proxy_set_header X-NL-Ingest-Secret "";  # only the edge function may set this, upstream
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header True-Client-IP "";
        proxy_set_header X-Client-IP "";
        proxy_set_header Fastly-Client-IP "";
        proxy_set_header Fly-Client-IP "";
        proxy_set_header Forwarded "";
        proxy_set_header Via "";
        proxy_set_header CF-Pseudo-IPv4 "";
        proxy_set_header CF-IPCountry "";
        proxy_set_header User-Agent "";
        proxy_set_header Referer "";

        proxy_hide_header Cache-Control;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Content-Security-Policy;

        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # --- 5. Authenticated University Insights Dashboard API ---
    location = /api/stats {
        limit_req zone=nl_ingest burst=30 nodelay;
        limit_req_status 429;

        rewrite ^/api/stats$ /functions/v1/stats break;
        proxy_pass https://YOUR_SUPABASE_HOST;
        proxy_ssl_server_name on;
        proxy_set_header Host YOUR_SUPABASE_HOST;
        proxy_set_header X-NL-Proxy-Secret "REPLACE_WITH_NL_PROXY_SECRET";
        proxy_pass_header Authorization;

        proxy_set_header Cookie "";
        proxy_set_header X-NL-Ingest-Secret "";  # only the edge function may set this, upstream
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header True-Client-IP "";
        proxy_set_header X-Client-IP "";
        proxy_set_header Fastly-Client-IP "";
        proxy_set_header Fly-Client-IP "";
        proxy_set_header Forwarded "";
        proxy_set_header Via "";
        proxy_set_header User-Agent "";
        proxy_set_header Referer "";

        proxy_hide_header Cache-Control;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Content-Security-Policy;

        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # --- 6. Authenticated Content Editor API (staff_account / scoped by can_edit_city) ---
    location ~ ^/api/editor(/.*)?$ {
        limit_req zone=nl_ingest burst=30 nodelay;
        limit_req_status 429;
        client_max_body_size 64k;

        rewrite ^/api/editor(/.*)?$ /functions/v1/editor$1 break;
        proxy_pass https://YOUR_SUPABASE_HOST;
        proxy_ssl_server_name on;
        proxy_set_header Host YOUR_SUPABASE_HOST;
        proxy_set_header X-NL-Proxy-Secret "REPLACE_WITH_NL_PROXY_SECRET";
        proxy_pass_header Authorization;

        proxy_set_header Cookie "";
        proxy_set_header X-NL-Ingest-Secret "";  # only the edge function may set this, upstream
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header True-Client-IP "";
        proxy_set_header X-Client-IP "";
        proxy_set_header Fastly-Client-IP "";
        proxy_set_header Fly-Client-IP "";
        proxy_set_header Forwarded "";
        proxy_set_header Via "";
        proxy_set_header User-Agent "";
        proxy_set_header Referer "";

        proxy_hide_header Cache-Control;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Content-Security-Policy;

        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # Note for Cloudflare Transform Rules:
    # Add a Managed Transform / Request Header Modification rule to remove
    # `CF-Connecting-IP` / `X-Forwarded-For` where rate limiting is handled at Cloudflare WAF.
}
