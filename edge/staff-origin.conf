# Netherlanded Isolated Staff Origin Template (Nginx)
# Serves the University Insights Dashboard and Staff Content Editor on a dedicated
# origin (staff.netherlanded.example), isolated from the student PWA origin and sw.js.
# Pair with edge/security-headers.conf (include inside the same http {} block so
# log_format nl_ip_free and limit_req_zone nl_staff are defined once).

server {
    listen 443 ssl;
    http2 on;
    server_name staff.netherlanded.example;

    access_log /var/log/nginx/netherlanded-staff.access.log nl_ip_free;
    error_log  /dev/null crit;

    server_tokens off;
    ssl_protocols TLSv1.2 TLSv1.3;

    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_ssl_verify_depth 3;

    root /var/www/netherlanded/web;

    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location = / {
        return 302 /dashboard.html;
    }

    location ~ ^/(dashboard\.html|editor\.html|stats\.js|editor\.js|icon\.svg)$ {
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    location = /api/stats {
        limit_req zone=nl_staff burst=30 nodelay;
        limit_req_status 429;

        rewrite ^/api/stats$ /functions/v1/stats break;
        proxy_pass https://YOUR_SUPABASE_HOST;
        proxy_ssl_server_name on;
        proxy_set_header Host YOUR_SUPABASE_HOST;
        proxy_set_header X-NL-Proxy-Secret "REPLACE_WITH_NL_PROXY_SECRET";
        proxy_pass_header Authorization;

        proxy_set_header Cookie "";
        proxy_set_header X-NL-Ingest-Secret "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header True-Client-IP "";
        proxy_set_header X-Client-IP "";
        proxy_set_header Fastly-Client-IP "";
        proxy_set_header Fly-Client-IP "";
        proxy_set_header Forwarded "";
        proxy_set_header Via "";
        proxy_set_header CF-Pseudo-IPv4 "";
        proxy_set_header CF-IPCountry "";
        proxy_set_header User-Agent "";
        proxy_set_header Referer "";

        proxy_hide_header Cache-Control;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Content-Security-Policy;

        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    location ~ ^/api/editor(/.*)?$ {
        limit_req zone=nl_staff burst=30 nodelay;
        limit_req_status 429;
        client_max_body_size 64k;

        rewrite ^/api/editor(/.*)?$ /functions/v1/editor$1 break;
        proxy_pass https://YOUR_SUPABASE_HOST;
        proxy_ssl_server_name on;
        proxy_set_header Host YOUR_SUPABASE_HOST;
        proxy_set_header X-NL-Proxy-Secret "REPLACE_WITH_NL_PROXY_SECRET";
        proxy_pass_header Authorization;

        proxy_set_header Cookie "";
        proxy_set_header X-NL-Ingest-Secret "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header True-Client-IP "";
        proxy_set_header X-Client-IP "";
        proxy_set_header Fastly-Client-IP "";
        proxy_set_header Fly-Client-IP "";
        proxy_set_header Forwarded "";
        proxy_set_header Via "";
        proxy_set_header CF-Pseudo-IPv4 "";
        proxy_set_header CF-IPCountry "";
        proxy_set_header User-Agent "";
        proxy_set_header Referer "";

        proxy_hide_header Cache-Control;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Content-Security-Policy;

        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    location / {
        return 404;
    }
}
