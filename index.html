<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <title>Netherlanded – Interactive Demo Portal</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
  <link rel="icon" type="image/svg+xml" href="./web/icon.svg">
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f8f7;
      --card: #ffffff;
      --ink: #18231d;
      --muted: #4b5a52;
      --accent: #1d5a3a;
      --accent-hover: #16462d;
      --border: #dce4df;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 28px 18px 44px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.5;
    }
    main {
      max-width: 760px;
      margin: 0 auto;
    }
    header {
      margin-bottom: 24px;
    }
    h1 {
      margin: 0;
      font-size: clamp(1.6rem, 3vw, 2.1rem);
      line-height: 1.2;
    }
    .grid {
      display: grid;
      gap: 14px;
      margin-top: 22px;
    }
    a.card {
      display: block;
      text-decoration: none;
      color: inherit;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px 20px;
      transition: border-color .15s ease, transform .15s ease;
    }
    a.card:hover, a.card:focus-visible {
      border-color: var(--accent);
      transform: translateY(-1px);
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .card-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-weight: 700;
      font-size: 1.08rem;
      color: var(--accent);
      margin-bottom: 0;
    }
    footer {
      margin-top: 24px;
      font-size: 0.82rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Netherlanded</h1>
    </header>

    <section class="grid" aria-label="Netherlanded applications">
      <a class="card" href="./netherlanded-app.html">
        <div class="card-title">
          <span>Student Arrival App</span>
          <span aria-hidden="true">Open →</span>
        </div>
      </a>

      <a class="card" href="./web/dashboard.html">
        <div class="card-title">
          <span>University Insights Dashboard</span>
          <span aria-hidden="true">Open →</span>
        </div>
      </a>

      <a class="card" href="./web/editor.html">
        <div class="card-title">
          <span>Staff Content Editor</span>
          <span aria-hidden="true">Open →</span>
        </div>
      </a>
    </section>

    <footer>
      Copyright &copy; 2026 Eirini Konidari. All rights reserved.
    </footer>
  </main>
</body>
</html>
