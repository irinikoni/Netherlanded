3. Where your data is kept, recipients, and processors\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Prototype (current version):\u003c/strong> your answers, progress, and local telemetry queues are saved in your browser on your device. The prototype does not send statistics to a server unless a server address is configured.\u003c/li>\n\u003cli>\u003cstrong>Hosted deployment:\u003c/strong> aggregate statistics are stored with a hosting provider inside the EU (for example Supabase, EU region) under a signed GDPR Article 28 Data Processing Addendum (DPA), and the static app is served from a web host (such as GitHub Pages, with transfer safeguards verified before launch).\u003c/li>\n\u003cli>\u003cstrong>Recipients:\u003c/strong> \u003cstrong>Participating universities\u003c/strong> receive \u003cstrong>only\u003c/strong> fixed, disclosure-controlled aggregate statistics (never personal profiles, accounts, or raw counters), subject to a contractual restriction forbidding any attempt to re-identify students or use released statistics to make admissions, selection, disciplinary, or other decisions about any individual. No other third party receives your data. We never sell your data or use it for advertising.\u003c/li>\n\u003cli>\u003cstrong>Technical logs (IP addresses):\u003c/strong> as with any web service, your internet address (IP address) reaches the hosting gateway when requests are sent. It is never stored with the statistics counts. On Supabase Pro, gateway technical logs are retained for up to \u003cstrong>7 days\u003c/strong>; the production target before pilot launch is stripping client IP addresses at the edge and capping technical log retention at \u003cstrong>24 hours\u003c/strong>.\u003c/li>\n\u003c/ul>\n\u003ch3>13a. Limited service statistics (on unless you object)\u003c/h3>\n\u003cp>\u003cstrong>Purpose.\u003c/strong> Netherlanded processes limited service statistics to find technical problems and guidance that may be unclear or not working, and to give participating institutions disclosure-controlled aggregate information that helps them improve general onboarding guidance. The statistics are not used to monitor individual students, to make decisions about them, or to identify students who need intervention.\u003c/p>\n\u003cul>\n\u003cli>Your phone queues individual aggregate contributions locally and sends them in \u003cstrong>weekly shuffled batches\u003c/strong> (with no cookies, credentials, or referrer). Each count holds only: the app or content version, your school, your intake semester (for example \u003ccode>2026-sep\u003c/code>), a broad step category (\u003ccode>admin\u003c/code>, \u003ccode>housing\u003c/code>, \u003ccode>money\u003c/code>, \u003ccode>health\u003c/code>, \u003ccode>work\u003c/code>, \u003ccode>social\u003c/code>, or \u003ccode>wellbeing\u003c/code>), and whether a step in that category applies to you or was finished (\u003ccode>step_applies\u003c/code> or \u003ccode>step_completed\u003c/code>). There is also at most one \u003ccode>technical_error\u003c/code> count per app version.\u003c/li>\n\u003cli>\u003cstrong>Never included:\u003c/strong> name, account, device, installation or session ID, EU/EEA status, \u003ccode>step_id\u003c/code>, exact dates or times, notes, scam-check answers, or missed deadlines. Raw incoming counters are folded hourly into aggregate cells and purged quickly (section 14); Tier 1 and Tier 2 are kept in separate database stores and are never joined.\u003c/li>\n\u003cli>We tell you about this on its own screen before anything is counted, and counting starts only after that.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>What universities receive.\u003c/strong> Only fixed, predefined monthly reports per institution and intake semester, checked by a server-side disclosure-control pipeline before release: every result must be based on \u003cstrong>at least 15 students\u003c/strong>; published counts are \u003cstrong>rounded down to multiples of 5\u003c/strong>; small changes under \u003cstrong>5 percentage points\u003c/strong> between releases are withheld (and stay withheld for two further releases); results that could be worked out by subtraction (\u003cstrong>complementary suppression\u003c/strong>) are withheld; and withheld groups are shown only as broad size buckets (such as \u003ccode>&lt;15\u003c/code> or \u003ccode>15-49\u003c/code>), never as exact counts or zeros. Universities get no filters, no exports beyond these reports, and no access to our database or logs.\u003c/p>\n\u003cp>\u003cstrong>Legal basis.\u003c/strong> Dutch law allows analytics without prior permission when they have no or only minor privacy impact (\u003cem>Telecommunicatiewet\u003c/em> art. 11.7a). Processing rests on legitimate interests (GDPR Art. 6(1)(f)): ours in a working, accurate app, and the universities' in improving general guidance. We have weighed these against your interests in a written assessment, available on request. \u003cstrong>You can object at any time\u003c/strong>, on the notice screen or with the \"Limited service statistics\" switch in Profile. Objecting stops all counting and deletes the counts on your phone; the app works normally.\u003c/p>\n\u003ch3>13b. Additional statistics for your university (only if you say yes)\u003c/h3>\n\u003cp>To help your university improve support for future students, you can choose to share additional statistics. This is \u003cstrong>off unless you turn it on\u003c/strong>. We ask you once, after you agree to these terms; you can choose yes, no, or decide later, and the app works the same whichever you choose. You can change your choice at any time in Profile, or with the switch \u003cstrong>at the end of this Privacy Policy\u003c/strong>.\u003c/p>\n\u003cul>\n\u003cli>Nothing extra is counted or kept until you say yes. If you say no, or switch it off later, the app deletes these counts from your phone.\u003c/li>\n\u003cli>Like Tier 1, counts are queued locally and sent in \u003cstrong>weekly shuffled batches\u003c/strong> with no cookies, credentials, or referrer. Each count holds your school, EU/EEA or not, your intake semester, the step, and what happened: joined, arrived, step applies, step opened, step completed, deadline passed (\u003ccode>deadline_missed\u003c/code>), or a scam check done (\u003ccode>high_risk\u003c/code> true or false). \u003cstrong>No exact timestamps and no on-time/late timing flags are sent or stored.\u003c/strong>\u003c/li>\n\u003cli>Tier 2 is stored separately from Tier 1, never joined to it, and passes through the exact same disclosure-control rules in section 13a before any report is published to a university dashboard. Universities cannot see, request, or receive data about individual students or your profile.\u003c/li>\n\u003cli>Your internet address reaches the hosting provider only in transient technical logs as described in section 13.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Legal basis.\u003c/strong> Your consent, both for storing these counts on your phone (\u003cem>Telecommunicatiewet\u003c/em> art. 11.7a) and for processing them (GDPR Art. 6(1)(a)). You can withdraw it at any time; this does not affect totals already sent, which cannot be linked to you.\u003c/p>\n\u003cp>Because stored aggregate outputs meet the disclosure-control thresholds and cannot be linked back to you, published reports are anonymous. (Transient IP addresses in gateway logs and raw events prior to folding and deletion are treated as personal data until deleted.)\u003c/p>\n\u003ch3>14. How long we keep it\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>On-device checklist, preferences, and local telemetry queues:\u003c/strong> kept in your browser until you clear them (\u003cem>Profile → Delete all data\u003c/em>), or until a queued batch is sent or you object/withdraw consent.\u003c/li>\n\u003cli>\u003cstrong>Raw incoming counter events (\u003ccode>raw_t1\u003c/code>, \u003ccode>raw_t2\u003c/code>):\u003c/strong> folded hourly into aggregate cells, deleted 1 hour after folding, and \u003cstrong>never kept past 48 hours\u003c/strong>.\u003c/li>\n\u003cli>\u003cstrong>Release staging cells (\u003ccode>stage_cell\u003c/code>):\u003c/strong> kept for up to \u003cstrong>90 days\u003c/strong> for debugging.\u003c/li>\n\u003cli>\u003cstrong>Published disclosure-controlled snapshots (\u003ccode>snapshot\u003c/code>):\u003c/strong> kept for \u003cstrong>3 years\u003c/strong> (1,095 days) to compare intakes.\u003c/li>\n\u003cli>\u003cstrong>Unmapped step-key dictionary (\u003ccode>unmapped_value\u003c/code>):\u003c/strong> kept for \u003cstrong>400 days\u003c/strong>.\u003c/li>\n\u003cli>\u003cstrong>Anonymised aggregate totals (\u003ccode>accumulated_cell\u003c/code>):\u003c/strong> retained indefinitely for multi-intake comparison (contains no personal data).\u003c/li>\n\u003cli>\u003cstrong>Hosting gateway technical logs:\u003c/strong> up to \u003cstrong>7 days\u003c/strong> on Supabase Pro (production target before launch: IP-stripped at the edge and retained for at most \u003cstrong>24 hours\u003c/strong>).\u003c/li>\n\u003c/ul>\n\u003ch3>15. Your rights\u003c/h3>\n\u003cp>You can view or copy everything stored on your device (\u003cem>Profile → See my data\u003c/em>, including your local telemetry queues), delete all local data (\u003cem>Profile → Delete all data\u003c/em>), object to Tier 1 statistics, and withdraw Tier 2 consent at any time (\u003cem>Profile → Privacy &amp; legal\u003c/em>). For anything else, e-mail [contact e-mail]. We reply within one month.\u003c/p>\n\u003cp>If you are unhappy with how we handle your data, you can complain to the Dutch Data Protection Authority (\u003cem>Autoriteit Persoonsgegevens\u003c/em>).\u003c/p>\n\u003ch3>16. Security\u003c/h3>\n\u003cp>We collect as little as possible, reject any identity fields (\u003ccode>session_id\u003c/code>, \u003ccode>user_id\u003c/code>, \u003ccode>device_id\u003c/code>, \u003ccode>ip\u003c/code>, etc.) at ingest, and use encrypted connections and access control in the hosted deployment. On your device, anyone with access to your device and browser could see what you entered.\u003c/p>\n\u003ch3>17. Cookies and tracking\u003c/h3>\n\u003cp>The app uses no advertising or tracking cookies and loads no third-party fonts or third-party analytics. The app uses your browser's local storage only to remember your own answers and settings, and—unless you objected (Tier 1) or declined (Tier 2)—to hold the local statistics queues prior to weekly batch upload, along with your choices.\u003c/p>\n\u003ch3>18. Changes\u003c/h3>\n\u003cp>If we change this policy, we update the date at the top and tell you in the app (at least 30 days in advance for important changes).\u003c/p>\n"}</script>

/* v3.0 brand layer: the horizon. Tokens follow the Netherlanded design system. */
:root{
  --font:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --font-d:"Newsreader",Georgia,"Times New Roman",serif;
  --bg:#eef4f1; --cell:#ffffff; --cell-hi:#e3ebe6; --label:#10261b; --label2:#3f4a44; --label3:#7d8a83;
  --sep:#c9d6cf; --fill:rgba(16,38,27,.07); --fill2:rgba(16,38,27,.12);
  --sun:#f3c623; --sun-ink:#10261b; --water:#2f6f8f; --must:#c5221f; --fee:#ff8a3d;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b120e; --cell:#18201b; --cell-hi:#222c26; --label:#eaf2ec; --label2:#b9c6be; --label3:#7f8c85;
  --sep:#2c3a32; --fill:rgba(234,242,236,.08); --fill2:rgba(234,242,236,.14); --water:#7cc0e0; --must:#ff6b5e; --fee:#ff9d5c}}
:root[data-theme="dark"]{
  --bg:#0b120e; --cell:#18201b; --cell-hi:#222c26; --label:#eaf2ec; --label2:#b9c6be; --label3:#7f8c85;
  --sep:#2c3a32; --fill:rgba(234,242,236,.08); --fill2:rgba(234,242,236,.14); --water:#7cc0e0; --must:#ff6b5e; --fee:#ff9d5c}
body{font-family:var(--font);letter-spacing:-.005em}
/* serif voice for the big moments, Manrope for everything you read and tap */
h1.large,#countdown,#tabTitle{font-family:var(--font-d);font-weight:600;letter-spacing:-.015em}
.ph-h,.sheet h2,.sheet-title,.page h1,.page-inner h1,.group-label,.wordmark,.lead-h,.weed h2{font-family:var(--font-d);font-weight:600;letter-spacing:-.01em}
.group-label{font-size:21px}
.wordmark{font-size:19px}
/* the mark */
.logo .flag{box-shadow:none;border-radius:0;overflow:visible;color:#164a2f;width:26px;height:26px;flex-basis:26px}
.logo .flag svg{display:block;width:100%;height:100%}
.logo .flag .mk-land{fill:rgba(255,255,255,.6)}
/* the horizon: a low sun on the header's bottom line; lifted while Netherlanding, resting once Netherlanded */
header.top{overflow:hidden;isolation:isolate}
header.top::after{content:"";position:absolute;z-index:-1;right:-36px;bottom:14px;width:190px;height:95px;border-radius:95px 95px 0 0;background:var(--sun);opacity:.13;transition:transform .9s var(--spring)}
header.top.landed::after{transform:translateY(14px)}
header.top.compact::after{display:none}
header.top .pbar{background:rgba(255,255,255,.22)}
header.top .pbar i{background:#fff}
@media (prefers-reduced-motion:reduce){header.top::after{transition:none}}
/* deadline tags in brand colours */
.dtag.legal{background:var(--must);color:#fff}
.dtag.financial{background:var(--fee);color:#10261b}
.route i.c{background:var(--sun);color:var(--sun-ink)}
/* buttons and pills: round like the sun */
.btn,.sheet .btn{border-radius:999px;font-family:var(--font);font-weight:700;letter-spacing:0}
.cards > li{border-radius:16px}
.stamp{font-family:var(--font-d);font-weight:600;text-transform:none;letter-spacing:0}
.toast{font-family:var(--font)}
</style>
<style>
/* v3.1 overnight: profile bump, horizon illustrations, motion */
/* header avatar moves to the tab bar */
header.top .avatar-btn,.minibar .avatar-btn{display:none}
nav.tabs{overflow:visible}
.tab-me-slot::before{content:"";position:absolute;left:50%;top:-30px;width:86px;height:86px;margin-left:-43px;border-radius:50%;background:var(--material);
  box-shadow:0 0 0 var(--hair) var(--sep),0 -10px 18px -10px rgba(0,0,0,.22);clip-path:inset(-30px -30px 56px -30px);z-index:-1}
.tab-me-slot::after{content:"";position:absolute;left:50%;top:-1px;width:110px;height:14px;margin-left:-55px;z-index:-1;
  background:radial-gradient(circle at 0 0,transparent 12px,var(--material) 12.5px) left top/14px 14px no-repeat,radial-gradient(circle at 100% 0,transparent 12px,var(--material) 12.5px) right top/14px 14px no-repeat}
.tab-me-slot{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;position:relative}
.tab-me{position:relative;margin-top:-22px;width:62px;height:62px;border-radius:50%;display:grid;place-items:center;background:var(--avatar);color:var(--avatar-ink);
  box-shadow:0 0 0 3px var(--sun),0 6px 16px -4px rgba(0,0,0,.35);transition:transform .18s var(--spring),box-shadow .2s}
.tab-me::after{content:"";position:absolute;inset:-6px;border-radius:50%}
.tab-me img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.tab-me span{font:700 21px/1 var(--font);letter-spacing:-.01em}
.tab-me svg{width:52%;height:52%;fill:currentColor}
.tab-me:active{transform:scale(.92)}
.tab-me-lbl{font-size:11px;font-weight:600;color:var(--label2);margin-top:2px}
body.page-open .tab-me{box-shadow:0 0 0 3px var(--tint),0 6px 16px -4px rgba(0,0,0,.35)}
/* horizon illustrations */
.hz{display:block;width:100%;height:auto;overflow:visible}
.hz .hz-sun{fill:var(--sun);opacity:.9}
.hz .hz-line{fill:var(--tint);opacity:.85}
.hz g,.hz .hz-water{fill:none;stroke:var(--tint);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.hz .hz-plane path{fill:var(--cell);stroke:var(--tint)}
.hz .hz-cloud path{fill:var(--cell);stroke:var(--label3)}
.hz .hz-tick{stroke:var(--sun);stroke-width:3.2}
.hz .hz-pin path{fill:var(--cell)}
.hz .hz-water{stroke:var(--water);opacity:.7}
.ph-art{grid-column:1/-1;display:block;max-width:340px;margin:0 0 6px;opacity:.95}
.tab-art{max-width:360px;margin:6px 0 2px}
@media (prefers-reduced-motion:no-preference){
  .hz-plane{animation:glide 6s ease-in-out infinite}
  .hz-cloud{animation:drift 14s ease-in-out infinite}
  body.intro .hz-sun{transform-box:fill-box;transform-origin:50% 100%;animation:sunrise 1.1s var(--spring) both}
  .hz-pin{animation:pinbob 2.8s ease-in-out infinite}
  body.intro .hz-tick{stroke-dasharray:40;stroke-dashoffset:40;animation:draw .7s .4s ease forwards}
  body.intro header.top::after{animation:sunrise 1.2s var(--spring) both}
  body.intro .route i{animation:popin .35s var(--spring) both}
  .route .rt:nth-child(2) i{animation-delay:.03s}.route .rt:nth-child(3) i{animation-delay:.06s}.route .rt:nth-child(4) i{animation-delay:.09s}.route .rt:nth-child(5) i{animation-delay:.12s}.route .rt:nth-child(6) i{animation-delay:.15s}.route .rt:nth-child(7) i{animation-delay:.18s}.route .rt:nth-child(8) i{animation-delay:.21s}.route .rt:nth-child(9) i{animation-delay:.24s}.route i:nth-child(n+10){animation-delay:.27s}
  body.intro .route i.c{animation:popin .35s var(--spring) both}
  .route i.c{animation:glow 2.4s 1s ease-in-out infinite}
  body.intro header.top .pbar i{animation:fillin 1s .2s var(--spring) both;transform-origin:left}
  #view.enter > *{animation:rise .38s var(--spring) both}
  #view.enter > :nth-child(2){animation-delay:.04s}#view.enter > :nth-child(3){animation-delay:.08s}#view.enter > :nth-child(4){animation-delay:.12s}#view.enter > :nth-child(n+5){animation-delay:.16s}
  body.intro .tab-me{animation:popin .5s .2s var(--spring) both}
}
@keyframes glide{0%,100%{transform:translate(0,0)}50%{transform:translate(10px,-5px)}}
@keyframes drift{0%,100%{transform:translateX(0)}50%{transform:translateX(16px)}}

<style>/* v5.8: from the Quiet Cards trial (design review items 49, 50, 52 and the bottom bar), plus first-tester feedback. */
/* v5.8 trial: quieter done steps, readable locked steps, no glow on Up next, neutral tab bar */
/* done: an outlined tick instead of a filled disc, so a finished group does not shout */
.cards > li:has(.stop.done) .tick.on::before{background:transparent;border-color:color-mix(in srgb,var(--tint) 38%,var(--label3));box-shadow:none}
.cards > li:has(.stop.done) .tick.on svg{stroke:color-mix(in srgb,var(--tint) 55%,var(--label2));stroke-width:2.4}
.cards > li:has(.stop.done) .stop-title{color:var(--label2)}
/* locked: still set back, but the words are readable and the reason is the second line */
.cards > li:has(.stop.locked){background:transparent;box-shadow:inset 0 0 0 1px var(--sep)!important}
.stop.locked .stop-title{color:color-mix(in srgb,var(--label) 86%,var(--bg))}
.stop.locked .meta{color:var(--label2)}
.tick.locked svg{stroke:var(--label2)}
/* Up next: one clear edge, no glow (a glow reads as keyboard focus) */
.cards > li:has(.is-next),.next.seg-card{border:1.5px solid color-mix(in srgb,var(--tint) 62%,var(--cell))!important;box-shadow:var(--calm-shadow)!important}
/* tab bar: near-neutral with a trace of the city colour, instead of a fixed green */
:root{--material:color-mix(in srgb,color-mix(in srgb,var(--tint-soft) 14%,#fbfbfb) 92%,transparent)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--material:color-mix(in srgb,color-mix(in srgb,var(--tint-soft) 22%,#121415) 92%,transparent)}}
:root[data-theme="dark"]{--material:color-mix(in srgb,color-mix(in srgb,var(--tint-soft) 22%,#121415) 92%,transparent)}
nav.tabs{border-top-color:color-mix(in srgb,var(--sep) 70%,transparent)}
/* inner pages (Profile, settings): a calm neutral bar. The city colour stays on the Steps header, so cities with a
   strong colour (Eindhoven red) do not paint every page. */
.page-bar{background:color-mix(in srgb,var(--tint-soft) 10%,var(--bg));color:var(--label);box-shadow:inset 0 calc(-1*var(--hair)) 0 var(--sep)!important}
.page-bar .back{color:var(--tint)}
/* what happens if a deadline is missed: stated first in the step sheet, marked by the deadline's colour */
.seg-card.risk .cell-text{border-left:4px solid var(--fee);font-weight:500}
.seg-card.risk .cell-text.risk-legal{border-left-color:var(--must)}
.seg-card.risk .cell-text + .cell-text{border-top:var(--hair) solid var(--sep)}
/* a long municipality text shows four lines until "Read more" */
.clamp:not(.open){display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.text-btn.more{align-self:flex-start;margin-top:2px;padding:6px 0;min-height:32px;color:var(--tint);font-weight:600;font-size:14px}
/* tab labels follow the phone's text size (11px at the default size) */
nav.tabs button,.tab-me-lbl{font-size:.6875rem}
.tab-me-lbl{line-height:1.27}
/* the small drawing in a step sheet keeps clear of "Close" */
.sheet-art{margin-top:10px}
/* comparison of the three builds (14 Nov): header second line readable on red headers (was 3.6:1 on Eindhoven) */
.hello,.subtitle{opacity:.94}
/* tick and small buttons: a full 44px hit area */
.tick::after{inset:-8px}
.btn.small::after{inset:-6px 0}
/* tab labels grow with the text size, but never so far that the bar overflows */
nav.tabs button,.tab-me-lbl{font-size:clamp(11px,.6875rem,13.5px)}
</style>

// ---------- logic (mirrors 02_logic.sql) ----------
function applies(s){
  const p=S.profile;
  if (s.applies_region!=='all' && s.applies_region!==p.region) return false;
  if (s.applies_work==='working' && !p.work) return false;
  if (s.applies_work==='not_working' && p.work) return false;
  if (s.institution_id && s.institution_id!==p.institution) return false;
  return true; // city: app is scoped to The Hague
}
const mine = () => STEPS.filter(s=>s.id!=='meet_buddy' && applies(s));
function stateOf(s){
  if (S.done[s.id]) return 'done';
  const blockers = s.prereqs.filter(p=>p.kind==='hard' && BY[p.id] && applies(BY[p.id]) && !S.done[p.id]).map(p=>p.id);
  return blockers.length ? {locked:blockers} : 'available';
}
function deadlinesFor(s){
  const out=[];
  for (const d of s.deadlines){
    let base=null;
    if (d.anchor==='arrival_date' && S.profile.arrival) base=parse(S.profile.arrival);
    if (d.anchor==='step_done' && S.done[d.anchor_step_id]) base=parse(S.done[d.anchor_step_id]);
    if (d.anchor==='user_event' && S.events[d.anchor_event]) base=parse(S.events[d.anchor_event]);
    if (base) out.push({...d, due:addDays(base,d.offset_days), step:s});
  }
  return out;
}
const allDeadlines = () => mine().filter(s=>!S.done[s.id]).flatMap(deadlinesFor).sort((a,b)=>a.due-b.due);
// money reads as €529.74 (and €950/month); everything else as value and unit, e.g. "3 months"
function fact(key){ const f=C.facts[key]; if(!f) return ''; const u=f.unit||''; return /^EUR/.test(u) ? `€${f.value}${u.slice(3)}` : `${f.value}${u?' '+u:''}`; }
const daysTo = d => Math.round((d-today)/DAY);
let justCompleted=null;
function upNext(){ const open=mine().filter(s=>stateOf(s)==='available' && !s.is_optional);
  const urgent=open.filter(s=>deadlinesFor(s).some(d=>d.severity!=='advice' && daysTo(d.due)<=7)).sort((a,b)=>deadlinesFor(a)[0].due-deadlinesFor(b)[0].due);
  return urgent[0] || open[0]; }
function phaseComplete(ph){ const items=mine().filter(s=>s.phase===ph), req=items.filter(s=>!s.is_optional), use=req.length?req:items; return use.length>0 && use.every(s=>S.done[s.id]); }
function justDoneMsg(s, unlocked, finished){ if (finished) return `“${PHASES.find(p=>p[0]===s.phase)[1]}” is complete`; return unlocked.length ? `Done. Unlocked: ${unlocked[0].title}` : 'Marked as done'; }
const short = s => { const w=s.split(' '); return w.length>4 ? w.slice(0,4).join(' ').replace(/[,(]+$/,'')+'…' : s; };
function initials(n){ return (n||'').trim().split(/\s+/).filter(Boolean).map(w=>w[0]).join('').slice(0,2).toUpperCase(); }
function avatar(cls=''){ const m=S.me, ph=safePhoto(m.photo); const inner = ph ? `<img src="${ph}" alt="">` : (initials(m.name) ? esc(initials(m.name)) : PERSON); return `<span class="av ${cls}">${inner}</span>`; }
// how many steps a plan has, said the same way everywhere: "13 steps" or "13 steps, plus 5 optional"
function planCount(){ const all=mine(), req=all.filter(s=>!s.is_optional).length, opt=all.length-req;
  return `${req} step${req===1?'':'s'}${opt?`, plus ${opt} optional`:''}`; }
function stats(){ const req=mine().filter(s=>!s.is_optional); const done=req.filter(s=>S.done[s.id]).length;
  return {done, todo:req.length-done, soon:allDeadlines().filter(d=>daysTo(d.due)<=14).length}; }

    if (!arr){ cd.hidden=true; tt.hidden=false; tt.textContent='Your first steps'; greet.textContent=`In ${c.name}`; ab.hidden=true; }

      tt.hidden=true; cd.hidden=false;

        cd.innerHTML = there ? (play ? 'Netherland<span class="suf"><span class="old">ing</span><span class="new">ed</span></span>' : `Welkom in ${esc(c.name)}`)

    for(let i=0;i<n;i++){ const w=Math.random()*2-1; b0=.99765*b0+w*.0990460; b1=.96300*b1+w*.2965164; b2=.57000*b2+w*1.0526913; d[i]=(b0+b1+b2+w*.1848)*.11; } } // pink noise

// ---------- calendar file (.ics): every open deadline as an all-day event with a reminder a week before ----------
// Made on the phone; nothing is sent anywhere.
function icsText(){ const esc1=s=>String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n');
  const day=d=>`${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
  // lines longer than 75 bytes are folded (RFC 5545); counted in bytes so "€" and accents never push a line over
  const fold=l=>{ const enc=new TextEncoder(), out=[]; let cur='', max=75;
    for (const ch of l){ if(enc.encode(cur+ch).length>max){ out.push(cur); cur=' '; max=75; } cur+=ch; } out.push(cur); return out.join('\r\n'); };
  const stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+Z$/,'Z');
  const ev=allDeadlines().filter(d=>daysTo(d.due)>=0).map(d=>{ const end=new Date(d.due); end.setDate(end.getDate()+1);
    const what=[d.consequence?'If you miss it: '+fillFacts(d.consequence):'', d.step.summary?fillFacts(d.step.summary):''].filter(Boolean).join(' ');
    return ['BEGIN:VEVENT',`UID:${d.step.id}-${day(d.due)}@netherlanded`,`DTSTAMP:${stamp}`,`DTSTART;VALUE=DATE:${day(d.due)}`,`DTEND;VALUE=DATE:${day(end)}`,
      `SUMMARY:${esc1(d.label)}`,`DESCRIPTION:${esc1(what)}`,'BEGIN:VALARM','TRIGGER:-P7D','ACTION:DISPLAY',`DESCRIPTION:${esc1(d.label)}`,'END:VALARM','END:VEVENT'].map(fold).join('\r\n'); });
  return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Netherlanded//Deadlines//EN','CALSCALE:GREGORIAN',...ev,'END:VCALENDAR'].join('\r\n')+'\r\n'; }

  if(e.target.closest('#termsAgree')){ try{ localStorage.setItem('nl-terms',TERMS_V); }catch(_){} termsOK=true; const g=document.getElementById('termsGate'); g.classList.add('out'); setTimeout(()=>{ g.remove(); if(pendingToast){ toast(pendingToast); pendingToast=null; } basicSync(); maybeAskConsent(); },RM.matches?0:400); } });
document.addEventListener('change',e=>{ if(e.target.id==='pf_basic'){ basicSeenMem=true; setBasic(e.target.checked); try{ localStorage.setItem(BASIC_SEEN,BASIC_V); }catch(_){} toast(e.target.checked?'Limited statistics on':'Objection saved. Counts on this phone deleted'); } });
document.addEventListener('change',e=>{ if(e.target.id==='pf_share'){ setConsent(e.target.checked?'yes':'no'); toast(e.target.checked?'Sharing anonymous totals':'Not sharing anything. Counts on this phone deleted'); } });
// ---------- Shared weekly shuffled batch helpers (local queue IDs only; never sent on wire) ----------
const WEEKLY_MS = 7 * 24 * 60 * 60 * 1000, BATCH_MAX = 100;
function nextWeeklyTs(){ return Date.now() + WEEKLY_MS + Math.floor(Math.random() * 12 * 3600000); }
function shuffleArr(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function localQueueId(){
  if (globalThis.crypto?.randomUUID) return crypto.randomUUID();
  const b=new Uint8Array(16);
  if(globalThis.crypto?.getRandomValues) crypto.getRandomValues(b);
  else for(let i=0;i<b.length;i++) b[i]=Math.floor(Math.random()*256);
  return Array.from(b,x=>x.toString(16).padStart(2,'0')).join('');
}
function migrateQueueList(arr){
  return (Array.isArray(arr)?arr:[]).map(x=>{
    if(x && x.id && x.payload) return x;
    if(x && typeof x==='object'){ const p=Object.assign({},x); delete p.receipt; return {id:localQueueId(),payload:p}; }
    return null;
  }).filter(Boolean);
}
function endpointFromConfig(winKey, metaName){
  const v=(window[winKey] || document.querySelector(`meta[name="${metaName}"]`)?.getAttribute('content') || '').trim();
  return v || null;
}
function parentInstitutionId(id){
  const inst=(C.institutions||[]).find(x=>x.id===id);
  if(!inst) return null;
  return inst.campus_of || inst.id;
}
function fetchWithTimeout(url, opts, ms){
  if (typeof AbortController === 'function') {
    const ctrl=new AbortController();
    const timer=setTimeout(()=>ctrl.abort(), ms);
    return fetch(url, Object.assign({}, opts, {signal:ctrl.signal})).finally(()=>clearTimeout(timer));
  }
  return fetch(url, opts);
}
async function withLock(name, fn){
  try{
    if (navigator.locks?.request) return await navigator.locks.request(name, fn);
  }catch(_){}
  return await fn();
}
function promoteWeeklyBatch(st){
  if (Date.now()>=st.nextUpload) {
    if (st.outbox.length) {
      st.ready.push(...st.outbox); st.outbox=[];
      shuffleArr(st.ready);
      if (st.ready.length>400) st.ready=st.ready.slice(-400);
    }
    st.nextUpload=nextWeeklyTs();
    return true;
  }
  return false;
}
async function flushQueue(url, isActiveFn, loadStateFn, storeFn){
  let keepGoing=true;
  while (keepGoing && isActiveFn()) {
    const current=loadStateFn(), batch=current.ready.slice(0, BATCH_MAX);
    if (!batch.length) break;
    let r;
    try {
      r=await fetchWithTimeout(url,{method:'POST',mode:'cors',credentials:'omit',referrerPolicy:'no-referrer',headers:{'Content-Type':'application/json'},body:JSON.stringify(batch.map(e=>e.payload))},10000);
    } catch (_) { break; }
    if (!isActiveFn()) break;
    if (r.status>=500 || r.status===429 || r.status===408) break;
    let dropIds=new Set();
    if (r.ok || batch.length===1) {
      batch.forEach(e=>dropIds.add(e.id));
    } else if (r.status===400) {
      // Poison-pill fallback: probe individually so 1 invalid item does not discard 99 valid items
      for (const item of batch) {
        if (!isActiveFn()) { keepGoing=false; break; }
        let ir;
        try {
          ir=await fetchWithTimeout(url,{method:'POST',mode:'cors',credentials:'omit',referrerPolicy:'no-referrer',headers:{'Content-Type':'application/json'},body:JSON.stringify(item.payload)},10000);
        } catch (_) { keepGoing=false; break; }
        if (!isActiveFn()) { keepGoing=false; break; }
        if (ir.status>=500 || ir.status===429 || ir.status===408) { keepGoing=false; break; }
        dropIds.add(item.id);
      }
    } else {
      break;
    }
    if (!dropIds.size || !isActiveFn()) break;
    const latest=loadStateFn();
    latest.ready=latest.ready.filter(e=>!dropIds.has(e.id));
    if (!storeFn(latest)) break;
  }
}

// ---------- Tier 1: basic app statistics (on by default, objection in Profile) ----------
// Telecommunicatiewet 11.7a analytics exception + GDPR art. 6(1)(f). Each "+1" carries: app version, school
// (rolled up to parent institution, never campus), intake semester, broad step category, and the event.
const BASIC_KEY='nl-basic', BASIC_OFF='nl-basic-off', BASIC_SEEN='nl-basic-seen', BASIC_V='1';
let basicOffMem=false, basicSeenMem=false;
const basicOn = () => { if(basicOffMem) return false; try{ return localStorage.getItem(BASIC_OFF)!=='1'; }catch(_){ return !basicOffMem; } };
const basicSeen = () => { if(basicSeenMem) return true; try{ return localStorage.getItem(BASIC_SEEN)===BASIC_V; }catch(_){ return basicSeenMem; } };
const basicActive = () => basicOn() && basicSeen() && termsOK && !S.example;
function basicLoad(){ try{ const b=JSON.parse(localStorage.getItem(BASIC_KEY)||'null'); if(b&&b.sent&&Array.isArray(b.outbox)) return b; }catch(_){} return {schema:2,sent:{},outbox:[],ready:[],log:[],errs:0,errVer:null,nextUpload:nextWeeklyTs(),cohorts:{}}; }
function basicStore(b){ try{ localStorage.setItem(BASIC_KEY, JSON.stringify(b)); return true; }catch(_){ return false; } }
function setBasic(on){
  basicOffMem=!on;
  try{ if(on) localStorage.removeItem(BASIC_OFF); else { localStorage.setItem(BASIC_OFF,'1'); localStorage.removeItem(BASIC_KEY); } }catch(_){}
  if(on) setTimeout(basicSync,0);
}
function basicState(){
  const b=basicLoad();
  b.schema=2;
  b.outbox=migrateQueueList(b.outbox);
  b.ready=migrateQueueList(b.ready);
  if(!Array.isArray(b.log)) b.log=[];
  if(typeof b.errs!=='number') b.errs=0;
  if(!b.nextUpload) b.nextUpload=nextWeeklyTs();
  b.cohorts=b.cohorts||{};
  return b;
}
function basicSync(){
  if (!basicActive()) return;
  const profile=S.profile;
  const parentInst=parentInstitutionId(profile.institution);
  if (!profile.arrival || !parentInst) return;
  const b=basicState();
  const cohort={app_version:String(C.version||'build'),institution:parentInst,intake:intakeOf(parse(profile.arrival))};
  const emit=(key,fields)=>{
    if (b.sent[key]) return;
    b.sent[key]=1;
    const payload=Object.assign({},fields);
    b.outbox.push({id:localQueueId(),payload});
    b.log.push(payload);
  };
  emit('cohort:'+cohort.institution+':'+cohort.intake, Object.assign({},cohort,{event:'cohort_joined'}));
  for (const step of mine()) {
    if (!b.sent['a:'+step.id] && !b.cohorts[step.id]) b.cohorts[step.id]=Object.assign({},cohort,{category:step.category});
    if (b.cohorts[step.id]) {
      emit('a:'+step.id,Object.assign({},b.cohorts[step.id],{event:'step_applies'}));
      if (S.done[step.id]) emit('d:'+step.id,Object.assign({},b.cohorts[step.id],{event:'step_completed'}));
    }
  }
  if (b.errs>0 && b.errVer===cohort.app_version) emit('err:'+cohort.app_version+':'+b.errs,Object.assign({},cohort,{event:'technical_error'}));
  if (b.outbox.length>400) b.outbox=b.outbox.slice(-400);
  if (b.log.length>400) b.log=b.log.slice(-400);
  promoteWeeklyBatch(b);
  basicStore(b);
  basicFlush();
}
let basicBusy=false;
async function basicFlush(){
  const url=endpointFromConfig('NL_BASIC_URL','nl-basic-url') || endpointFromConfig('NL_BASIC_WEEKLY_URL','nl-basic-url');
  if(!url || basicBusy || !basicActive()) return;
  basicBusy=true;
  const run=async()=>{
    try{
      const b=basicState();
      if (promoteWeeklyBatch(b)) basicStore(b);
      await flushQueue(url, basicActive, basicState, basicStore);
    }catch(_){}
  };
  try{
    await withLock('nl-basic-sync', run);
  }finally{ basicBusy=false; }
}
// at most one "technical error" count per app version, so it cannot become a usage trail
let errSeen=false; window.addEventListener('error',()=>{ if(errSeen||!basicActive()) return; errSeen=true; const ver=String(C.version||'build'); const b=basicState(); if(b.errVer!==ver){ b.errs=1; b.errVer=ver; basicStore(b); setTimeout(basicSync,0); } });
const BASIC_WORDS={cohort_joined:'A student joined the intake cohort',step_applies:'A step in this category applies to a student',step_completed:'A step in this category was finished',technical_error:'The app hit a technical error'};
const STATS_WORDS={joined:'A student joined',arrived:'A student arrived',step_applies:'This step applies to a student',step_opened:'A student opened this step',step_completed:'A student finished this step',deadline_missed:'A deadline passed with the step not done',scam_checked:'A room offer was checked'};
function whatIncludedSheet(){
  const b=basicState(), st=statsState(), bon=basicActive(), son=statsOn();
  const bWait=b.outbox.length+b.ready.length, stWait=st.outbox.length+st.ready.length;
  const rowB=ev=>`<li><div class="rowi static"><span class="body"><strong>${esc(BASIC_WORDS[ev.event]||ev.event)}${ev.category?': '+esc(ev.category):''}</strong><span class="stats-raw">${esc(JSON.stringify(ev))}</span></span></div></li>`;
  const rowS=ev=>{ const s=ev.step&&BY[ev.step]; return `<li><div class="rowi static"><span class="body"><strong>${esc(STATS_WORDS[ev.event]||ev.event)}${s?': '+esc(s.title):''}${ev.event==='scam_checked'?(ev.high_risk?' (high risk)':' (not high risk)'):''}</strong><span class="stats-raw">${esc(JSON.stringify(ev))}</span></span></div></li>`; };
  sheet(`<div class="sheet-head"><div class="grab"></div><div class="sheet-nav"><button class="text-btn" type="button" data-close>Close</button></div><h3>What is processed</h3>
    <p>Two separate statistics programs. Your phone queues individual aggregate contributions locally and sends them in weekly shuffled batches without your name, account, device ID, exact dates or answers.</p></div>
    <div class="wrap"><h4>Limited service statistics (${bon?'on':basicSeen()?'you objected':'not started'})</h4>
    <section class="seg-card"><ul class="rows">${kv('Who sees it','Netherlanded receives individual contributions. Universities receive only fixed aggregate reports after disclosure checks')}${kv('Each count holds','App version, school, intake semester, step category (admin, housing, money, health, work, social, wellbeing), and whether a step applies or was finished. Or one technical-error count')}${kv('Contributions recorded on this phone',String(b.log.length))}${kv('Waiting for weekly batch',String(bWait))}</ul></section>
    ${b.log.length?`<section class="seg-card"><ul class="rows">${b.log.slice().reverse().slice(0,30).map(rowB).join('')}</ul></section>`:''}
    <h4>Additional statistics for your university (${son?'on':'off'})</h4>
    <section class="seg-card"><ul class="rows">${kv('Who sees it','Your university, as grouped results; results under 15 students are hidden')}${kv('Each count holds','School, EU/EEA or not, intake semester, the step, and what happened: joined, arrived, applies, opened, finished, deadline passed, or a scam check (high risk or not)')}${kv('Contributions recorded on this phone',String(st.log.length))}${kv('Waiting for weekly batch',String(stWait))}</ul></section>
    ${st.log.length?`<section class="seg-card"><ul class="rows">${st.log.slice().reverse().slice(0,30).map(rowS).join('')}</ul></section>`:''}
    <p class="footnote">Object to the first or withdraw the second in Profile at any time. Switching one off deletes its counts on this phone.</p></div>`); }
document.addEventListener('click',e=>{ if(e.target.closest('#statsShow')) { e.stopImmediatePropagation(); whatIncludedSheet(); } }, true);
if (!basicOn()){ try{ localStorage.removeItem(BASIC_KEY); }catch(_){} }
// ---------- content update (hosted site): the loader downloaded newer content ----------
document.addEventListener('nl-content-updated', ()=>{ toast('New information is ready. You will see it the next time you open the app.'); });
// ---------- Tier 2: anonymous totals for the university dashboard (strict opt-in) ----------
// Matches db/002_ingest.sql nl.ingest_t2: institution, region, intake, event, step, high_risk.
// No name, no id, no exact date, no timing flags. Sent in weekly shuffled batches.
const STATS_KEY='nl-stats';
function statsLoad(){ try{ const s=JSON.parse(localStorage.getItem(STATS_KEY)||'null'); if(s&&s.sent&&Array.isArray(s.outbox)) return s; }catch(_){} return {schema:2,base:null,sent:{},outbox:[],ready:[],log:[],opened:{},scamN:0,scamOpen:false,nextUpload:nextWeeklyTs()}; }
function statsStore(st){ try{ localStorage.setItem(STATS_KEY, JSON.stringify(st)); return true; }catch(_){ return false; } }
function statsState(){
  const st=statsLoad();
  st.schema=2;
  st.outbox=migrateQueueList(st.outbox);
  st.ready=migrateQueueList(st.ready);
  if(!Array.isArray(st.log)) st.log=[];
  st.opened=st.opened||{};
  if(typeof st.scamN!=='number') st.scamN=0;
  st.scamOpen=Boolean(st.scamOpen);
  if(!st.nextUpload) st.nextUpload=nextWeeklyTs();
  return st;
}
// Consent for anonymous totals: off until the student actively says yes (Telecommunicatiewet 11.7a, GDPR art. 7).
// Stored apart from everything else: {choice:'yes'|'no'|'later', v, date, asked}. A new CONSENT_V asks everyone again.
const CONSENT_V='1', CONSENT_KEY='nl-consent';
let CONSENT=null; try{ CONSENT=JSON.parse(localStorage.getItem(CONSENT_KEY)||'null'); }catch(_){}
const consentNow = () => (CONSENT && CONSENT.v===CONSENT_V) ? CONSENT.choice : null;
function setConsent(choice){
  const prev = consentNow()==='later' ? (CONSENT.asked||1) : 0;
  if (choice==='later' && prev>=1) choice='no';                      // asked twice: treat a second "later" as no
  CONSENT={choice, v:CONSENT_V, date:iso(today), asked: choice==='later' ? prev+1 : prev};
  try{ localStorage.setItem(CONSENT_KEY, JSON.stringify(CONSENT)); }catch(_){}
  S.shareStats = choice==='yes'; save();
  if (choice!=='yes'){ try{ localStorage.removeItem(STATS_KEY); }catch(_){} }
  else setTimeout(statsSync,0);
  return choice;
}
// counts left over from an older version (sharing used to be on by default) are deleted unless the student said yes
if (consentNow()!=='yes'){ try{ localStorage.removeItem(STATS_KEY); }catch(_){} }
const statsOn = () => !S.example && termsOK && consentNow()==='yes';
// semester cohort: arrivals August to January join the September intake, February to July the February intake
const intakeOf = d => { const y=d.getFullYear(), mo=d.getMonth(); return mo>=7 ? y+'-sep' : mo===0 ? (y-1)+'-sep' : y+'-feb'; };
const mondayOf = d => { const x=new Date(d.getTime()); x.setDate(x.getDate()-((x.getDay()+6)%7)); return iso(x); };
function statsNote(kind,id){ if(kind!=='opened' || !statsOn()) return; const st=statsState(); if(!st.opened[id]){ st.opened[id]=1; statsStore(st); statsSync(); } }
function statsSync(){
  if (!statsOn()) return;
  const p=S.profile, st=statsState();
  // the school must be one the dashboard knows; "another school" has no university to report to
  if (!p.arrival || !p.region || !(C.institutions||[]).some(i=>i.id===p.institution)) return;
  const curBase={institution:p.institution, region:p.region, intake:intakeOf(parse(p.arrival))};
  if (!st.base || st.base.institution!==curBase.institution || st.base.region!==curBase.region || st.base.intake!==curBase.intake) {
    st.base=curBase;
  }
  const emit=(key,payload)=>{
    const cohortKey=st.base.institution+':'+st.base.intake+':'+key;
    if(st.sent[cohortKey] || st.sent[key]) return;
    st.sent[cohortKey]=1; st.sent[key]=1;
    const ev=Object.assign({},st.base,payload);
    st.outbox.push({id:localQueueId(),payload:ev}); st.log.push(ev);
  };
  emit('joined',{event:'joined'});
  if (p.arrival && parse(p.arrival)<=today) emit('arrived',{event:'arrived'});
  for (const s of mine()){
    emit('applies:'+s.id,{event:'step_applies',step:s.id});
    if (st.opened[s.id]) emit('opened:'+s.id,{event:'step_opened',step:s.id});
    if (S.done[s.id]){ emit('done:'+s.id,{event:'step_completed',step:s.id}); }
    else for (const d of deadlinesFor(s)) if (d.due<today) emit('missed:'+s.id+':'+d.label,{event:'deadline_missed',step:s.id});
  }
  // one counter per finished scam check; "Check another room" starts the next one
  const qs=C.scam_questions, ans=qs.filter(q=>S.scam[q.id]!=null);
  if (!ans.length && st.scamOpen){ st.scamOpen=false; st.scamN++; }
  if (ans.length===qs.length && !st.scamOpen){ const yes=qs.filter(q=>S.scam[q.id]===true), score=yes.reduce((a,q)=>a+q.weight,0);
    st.scamOpen=true; emit('scam:'+st.scamN,{event:'scam_checked',high_risk:yes.some(q=>q.weight>=5)||score>=9}); }
  if (st.outbox.length>400) st.outbox=st.outbox.slice(-400);
  if (st.log.length>400) st.log=st.log.slice(-400);
  promoteWeeklyBatch(st);
  statsStore(st); statsFlush();
}
let statsBusy=false;
async function statsFlush(){
  const url=endpointFromConfig('NL_INGEST_URL','nl-ingest-url');
  if(!url || statsBusy || !statsOn()) return;
  statsBusy=true;
  const run=async()=>{
    try{
      const st=statsState();
      if (promoteWeeklyBatch(st)) statsStore(st);
      await flushQueue(url, statsOn, statsState, statsStore);
    }catch(_){ /* offline: stays in the queue */ }
  };
  try{
    await withLock('nl-stats-sync', run);
  }finally{ statsBusy=false; }
}
function statsSheet(){ whatIncludedSheet(); }
document.addEventListener('click',e=>{ if(e.target.closest('#statsShow')) statsSheet(); });

document.addEventListener('click',e=>{ if(e.target.closest('#termsAgree')) setTimeout(statsSync,0); });
window.addEventListener('online', ()=>{ basicFlush(); statsFlush(); });
statsSync(); basicSync();
// ---------- a tapped reminder opens its step: the reminder's link ends in #step-<id> ----------
function openFromLink(){ const m=/^#step-([a-z0-9_]+)$/.exec(location.hash||''); if(!m) return;
  try{ history.replaceState(null,'',location.pathname+location.search); }catch(_){}
  if (!termsOK || needsSetup() || !mine().some(s=>s.id===m[1])) return;     // not set up yet, or the step is not in this plan
  openStep(m[1]); }
window.addEventListener('hashchange', openFromLink);
setTimeout(openFromLink, 600);
if (location.protocol === 'https:' && 'serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
}
})();
