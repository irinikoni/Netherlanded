<style>
/* Netherlanded · native iPhone look (v2.0)
   The phone's own font (San Francisco on iPhone), standard iOS system greys, full-width grouped lists,
   Reminders-style tick circles, iOS segmented controls and switches. The chosen city sets only the header
   colour and the tint (buttons, ticks, progress, links). Motion is limited to what iOS itself does. */
:root{
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-d:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --bg:#f2f2f7; --cell:#ffffff; --cell-hi:#e5e5ea; --label:#000000; --label2:rgba(60,60,67,.6); --label3:rgba(60,60,67,.3);
  --sep:rgba(60,60,67,.29); --fill:rgba(120,120,128,.12); --fill2:rgba(120,120,128,.2); --material:rgba(249,249,249,.94); --seg-sel:#ffffff;
  --red:#ff3b30; --red-t:#d70015; --orange:#ff9500; --orange-t:#c93400; --green-sys:#34c759; --green-t:#248a3d; --gray:#8e8e93;
  --tint:#1d5a3a; --tint-ink:#ffffff; --tint-soft:#e2efe6; --bar:#1d5a3a; --bar-ink:#ffffff; --bar-tint:rgba(255,255,255,.16);
  --stripe:transparent; --status:#1d5a3a; --avatar:#f3c623; --avatar-ink:#1f1a00; --accent:#f3c623; --accent-ink:#1f1a00;
  --toast:rgba(30,30,32,.94); --hair:1px;
  --gl:max(16px,env(safe-area-inset-left,0px)); --gr:max(16px,env(safe-area-inset-right,0px));
  --spring:cubic-bezier(.32,.72,0,1); --ease:cubic-bezier(.25,.1,.25,1);
}
@media (min-resolution:2dppx){:root{--hair:.5px}}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --cell:#1c1c1e; --cell-hi:#2c2c2e; --label:#ffffff; --label2:rgba(235,235,245,.6); --label3:rgba(235,235,245,.3);
  --sep:rgba(84,84,88,.65); --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.36); --material:rgba(22,22,24,.94); --seg-sel:#636366;
  --red:#ff453a; --red-t:#ff6961; --orange:#ff9f0a; --orange-t:#ffb340; --green-sys:#30d158; --green-t:#30db5b; --toast:rgba(58,58,60,.96); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --cell:#1c1c1e; --cell-hi:#2c2c2e; --label:#ffffff; --label2:rgba(235,235,245,.6); --label3:rgba(235,235,245,.3);
  --sep:rgba(84,84,88,.65); --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.36); --material:rgba(22,22,24,.94); --seg-sel:#636366;
  --red:#ff453a; --red-t:#ff6961; --orange:#ff9f0a; --orange-t:#ffb340; --green-sys:#30d158; --green-t:#30db5b; --toast:rgba(58,58,60,.96); color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--label);font-family:var(--font);font-size:17px;line-height:1.29;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--status)}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit;border-radius:0}
button,a,label,input,select,textarea,summary{-webkit-tap-highlight-color:transparent}
button,a,label,select,.switch{touch-action:manipulation}
nav.tabs,.phase-h,.avatar-btn,.btn,.seg-ctl,.tick{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
:focus-visible{outline:2px solid var(--tint);outline-offset:2px}
a{color:var(--tint)}
html.locked,html.locked body{overflow:hidden}
.app{max-width:460px;margin:0 auto;min-height:100%;background:var(--bg);position:relative}
@media (min-width:461px){.app{box-shadow:0 0 0 var(--hair) var(--sep)}}
.wrap{padding-left:var(--gl);padding-right:var(--gr)}

/* ---------- header: city colour, large title ---------- */
header.top{background:var(--bar);color:var(--bar-ink);padding:0 var(--gr) 20px var(--gl);border-bottom:3px solid var(--stripe)}
.navrow{height:52px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--font-d);font-weight:600;font-size:17px;letter-spacing:-.02em}
.logo .flag{width:24px;height:24px;border-radius:50%;overflow:hidden;flex:0 0 24px;box-shadow:0 0 0 1px rgba(0,0,0,.12)}
.flag svg{display:block;width:100%;height:100%}
.avatar-btn{width:34px;height:34px;flex:0 0 34px;border-radius:50%;background:var(--bar-tint);color:inherit;display:grid;place-items:center;position:relative}
.avatar-btn::after{content:"";position:absolute;inset:-5px}
.avatar-btn img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.avatar-btn span{font-weight:600;font-size:15px}
.avatar-btn svg{width:58%;height:58%;fill:currentColor}
.hello{margin:4px 0 0;font-size:15px;opacity:.85}
.large{margin:2px 0 0;font-family:var(--font-d);font-weight:700;font-size:clamp(28px,8.6vw,34px);line-height:1.12;letter-spacing:-.025em;text-wrap:balance}
.subtitle{margin:6px 0 0;font-size:17px;opacity:.88}
header.top.compact{padding-bottom:14px}
.arrived-btn{margin-top:14px;min-height:36px;padding:0 14px;border-radius:9px;background:var(--bar-tint);color:inherit;font-size:15px;font-weight:600;position:relative}
.arrived-btn::after{content:"";position:absolute;inset:-4px 0}
.arrived-btn:active{opacity:.6}
.progress{margin-top:18px;display:grid;gap:8px}
.progress .pbar{display:block;height:4px;border-radius:2px;background:color-mix(in srgb,var(--bar-ink) 24%,transparent);overflow:hidden}
.progress .pbar i{display:block;height:100%;border-radius:2px;background:var(--bar-ink);transition:width .6s var(--spring)}
.ptxt{font-size:15px;opacity:.9}
.ptxt b{font-weight:600}
.plink{color:inherit;font-weight:600;text-decoration:underline;text-underline-offset:3px;padding:12px 0;margin:-12px 0}
/* "-ing" drops away and "-ed" lands, once, on arrival day */
#countdown .suf{display:inline-grid;overflow:hidden;vertical-align:bottom}
#countdown .suf > *{grid-area:1/1}
#countdown.landing .suf .old{animation:sufOut .42s var(--ease) .25s both}
#countdown.landing .suf .new{animation:sufIn .5s var(--spring) .5s both}
@keyframes sufOut{to{transform:translateY(100%);opacity:0}}
@keyframes sufIn{from{transform:translateY(-100%);opacity:0}to{transform:none;opacity:1}}

/* compact bar: like an iOS navigation bar once the large title has scrolled away */
.minibar{position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:460px;z-index:6;display:grid;grid-template-columns:40px 1fr 40px;align-items:center;gap:8px;
  height:calc(44px + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) var(--gr) 0 var(--gl);background:var(--bar);color:var(--bar-ink);
  box-shadow:0 var(--hair) 0 rgba(0,0,0,.2);opacity:0;pointer-events:none;transition:opacity .2s var(--ease)}
.minibar.show{opacity:1;pointer-events:auto}
.minibar .t{grid-column:2;display:flex;align-items:center;justify-content:center;gap:7px;min-width:0;font-weight:600;font-size:17px}
.minibar #miniTitle{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.minibar .flag{width:20px;height:20px;flex:0 0 20px;border-radius:50%;overflow:hidden}
.minibar .avatar-btn{grid-column:3;justify-self:end;width:30px;height:30px;flex-basis:30px}
.minibar .avatar-btn::after{inset:-7px}
@media (max-width:359px){.mini-city{display:none}}

/* ---------- content: grouped lists ---------- */
main{padding-top:4px;padding-bottom:calc(100px + env(safe-area-inset-bottom,0px))}
.lead{margin:18px 0 0;font-size:15px;line-height:1.35;color:var(--label2)}
.footnote{margin:8px 0 0;font-size:13px;line-height:1.38;color:var(--label2)}
.group-label{display:block;margin:30px 0 8px;font-family:var(--font-d);font-size:20px;font-weight:600;letter-spacing:-.02em;line-height:1.2;color:var(--label)}
.group-label.crit{color:var(--red-t)}
.seg-card{background:var(--cell);margin:20px calc(-1*var(--gr)) 0 calc(-1*var(--gl));border-top:var(--hair) solid var(--sep);border-bottom:var(--hair) solid var(--sep)}
.group-label + .seg-card{margin-top:0}
.rows{list-style:none;margin:0;padding:0}
.rows > li{position:relative}
.rows > li + li::before{content:"";position:absolute;top:0;left:var(--gl);right:0;border-top:var(--hair) solid var(--sep);z-index:1}
.rows.icons > li + li::before{left:calc(var(--gl) + 44px)}
.rowi{display:flex;align-items:center;gap:12px;width:100%;min-height:44px;padding:11px var(--gr) 11px var(--gl);color:var(--label);text-decoration:none;text-align:left;transition:background-color .15s}
button.rowi:active,a.rowi:active,.stop:active{background:var(--cell-hi)}
@media (hover:hover){button.rowi:hover,a.rowi:hover,.stop:hover{background:color-mix(in srgb,var(--cell-hi) 50%,var(--cell))}}
.rowi .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.rowi .body strong{font-weight:400;font-size:17px;line-height:1.29}
.rowi .body > span{font-size:15px;line-height:1.33;color:var(--label2)}
.rowi .body > .meta,.meta{font-size:13px;line-height:1.3;color:var(--label2);margin-top:2px}
.s-legal{color:var(--red-t)} .s-money{color:var(--orange-t)} .s-advice{color:var(--label2)} .s-ok{color:var(--green-t)} .m-next{color:var(--tint);font-weight:600}
.value{flex:0 0 auto;max-width:60%;text-align:right;font-size:17px;color:var(--label2)}
.chev-r{width:8px;height:14px;flex:0 0 8px;fill:none;stroke:var(--label3);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rowi.action{color:var(--tint)}
.rowi.action.danger{color:var(--red)}
.rowi.static{cursor:default}
.ic{width:29px;height:29px;flex:0 0 29px;display:grid;place-items:center;color:var(--tint);align-self:flex-start}
.ic svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.app-icon{width:30px;height:30px;flex:0 0 30px;border-radius:7px;background:var(--c);color:#fff;display:grid;place-items:center;align-self:flex-start;margin-top:1px}
.app-icon svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.link{font-size:15px;font-weight:500;text-decoration:none;margin-top:4px;display:inline-block;padding:8px 0;margin-bottom:-8px}
.src-line{font-size:13px!important;color:var(--label3)!important;margin-top:4px}
.example-note .body > span{color:var(--label)}
.city-note strong{font-weight:600!important}

/* steps: Reminders-style rows with a tick circle */
.steps > li + li::before{left:calc(var(--gl) + 40px)}
.tick{position:absolute;left:calc(var(--gl) - 3px);top:10px;width:30px;height:30px;display:grid;place-items:center;z-index:2;border-radius:50%}
.tick::before{content:"";position:absolute;inset:4px;border-radius:50%;border:1.5px solid var(--label3);transition:background-color .2s var(--ease),border-color .2s var(--ease)}
.tick::after{content:"";position:absolute;inset:-7px}
.tick svg{position:relative;width:13px;height:13px;fill:none;stroke:var(--tint-ink);stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:20;stroke-dashoffset:20;transition:stroke-dashoffset .22s var(--ease) .06s}
.tick.on::before{background:var(--tint);border-color:var(--tint)}
.tick.on svg{stroke-dashoffset:0}
.tick.pop{animation:tickPop .42s var(--spring)}
@keyframes tickPop{0%{transform:scale(.7)}55%{transform:scale(1.12)}100%{transform:none}}
.tick.locked::before{display:none}
.tick.locked svg{width:17px;height:17px;stroke:var(--label3);stroke-width:1.8;stroke-dasharray:none;stroke-dashoffset:0}
.stop{display:flex;flex-direction:column;gap:2px;width:100%;min-height:52px;position:relative;text-align:left;padding:12px calc(var(--gr) + 20px) 12px calc(var(--gl) + 40px);color:var(--label);transition:background-color .15s}
.stop-title{font-size:17px;line-height:1.29}
.stop-sub{font-size:15px;line-height:1.33;color:var(--label2)}
.stop .chev-r{position:absolute;right:var(--gr);top:50%;margin-top:-7px}
.stop.done .stop-title,.stop.locked .stop-title{color:var(--label2)}

/* category (phase) headers with progress */
.phase{margin-top:30px}
.phase-h{display:grid;grid-template-columns:1fr auto;align-items:end;gap:0 12px;width:100%;padding:0 0 10px;color:var(--label);text-align:left}
.ph-title{min-width:0;display:flex;flex-direction:column;gap:3px}
.ph-h{display:flex;align-items:center;gap:7px;font-family:var(--font-d);font-size:20px;font-weight:600;letter-spacing:-.02em;line-height:1.2}
.ph-done{width:20px;height:20px;flex:0 0 20px;border-radius:50%;background:var(--green-sys);display:grid;place-items:center}
.ph-done svg{width:12px;height:12px;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.phase.celebrate .ph-done{animation:tickPop .5s var(--spring) .1s both}
.ph-sub{font-size:15px;color:var(--label2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph-right{display:flex;align-items:center;gap:6px;font-size:15px;color:var(--label2);padding-bottom:1px;white-space:nowrap}
.chev{width:13px;height:13px;fill:none;stroke:var(--tint);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;transition:transform .3s var(--spring)}
.phase.collapsed .chev{transform:rotate(-90deg)}
.meter{grid-column:1/-1;margin-top:10px;display:block}
.pbar{display:block;height:4px;border-radius:2px;background:var(--fill2);overflow:hidden}
.pbar i{display:block;height:100%;border-radius:2px;background:var(--tint);transition:width .6s var(--spring)}
.phase.complete .meter .pbar i{background:var(--green-sys)}
.collapse{display:grid;grid-template-rows:1fr;margin:0 calc(-1*var(--gr)) 0 calc(-1*var(--gl));transition:grid-template-rows .35s var(--spring)}
.collapse > div{overflow:hidden;min-height:0}
.phase.collapsed .collapse{grid-template-rows:0fr}
.collapse .seg-card{margin:0}

/* iOS segmented control (Yes/No, filters) */
.seg-ctl{display:flex;background:var(--fill);border-radius:9px;padding:2px}
.seg-ctl button{flex:1 0 auto;min-width:44px;min-height:40px;padding:0 12px;border-radius:7px;font-size:14px;font-weight:500;color:var(--label);white-space:nowrap;transition:background-color .2s var(--ease),box-shadow .2s var(--ease)}
.seg-ctl button[aria-pressed="true"]{background:var(--seg-sel);font-weight:600;box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04)}
.filters{position:sticky;top:var(--mb,44px);z-index:4;margin:16px calc(-1*var(--gr)) 0 calc(-1*var(--gl));padding:8px var(--gr) 8px var(--gl);background:var(--bg);overflow-x:auto;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters .seg-ctl{width:max-content;min-width:100%}
.filters .seg-ctl button{padding:0 9px;font-size:13px}
.minibar:not(.show) ~ main .filters{top:0}

/* deadlines */
.date-block{flex:0 0 40px;align-self:flex-start;text-align:center;line-height:1.1;padding-top:1px}
.date-block b{display:block;font-family:var(--font-d);font-size:22px;font-weight:600;letter-spacing:-.02em}
.date-block small{font-size:12px;font-weight:600;color:var(--red-t)}
.date-block.overdue b{color:var(--red-t)}

/* scam check */
.q{display:flex;align-items:center;gap:12px;padding:11px var(--gr) 11px var(--gl)}
.q-text{flex:1;min-width:0}
.q p{margin:0;font-size:17px;line-height:1.29}
.q .explain{margin-top:6px;font-size:15px;line-height:1.33;color:var(--label2)}
.yn{flex:0 0 112px}
.verdict .ic{width:30px;height:30px;flex-basis:30px;border-radius:50%;color:#fff}
.verdict.high .ic{background:var(--red)} .verdict.med .ic{background:var(--orange)} .verdict.low .ic{background:var(--green-sys)}
.verdict .ic svg{width:17px;height:17px;stroke:#fff;stroke-width:2.6}
.verdict .body strong{font-weight:600!important}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:50px;padding:0 20px;border-radius:12px;background:var(--tint);color:var(--tint-ink);font-size:17px;font-weight:600;text-align:center;text-decoration:none;transition:opacity .15s}
.btn:active{opacity:.65}
.btn.plain{background:var(--fill);color:var(--tint)}

 book once your rental agreement has started.","id":"delft","intl_centre_name":"The Hague International Centre","intl_centre_url":"https://www.thehagueinternationalcentre.nl/relocating/formalities/personal-records-database-brp","is_study_city":true,"last_verified":"2026-10-19","name":"Delft","near_city_id":null,"note":null,"registration_summary":"City page on registering in the BRP; register within 5 days of arrival by online appointment.","registration_url":"https://www.delft.nl/en/registration-international-students","student_registration_days":null},{"booking_note":"Saxion students get a fixed slot by email at the end of August. If you already have a BSN or do not live in Deventer, email the Saxion International Office so the slot can be cancelled.","id":"deventer","intl_centre_name":null,"intl_centre_url":null,"is_study_city":true,"last_verified":"2026-11-12","name":"Deventer","near_city_id":null,"note":"How to register outside the Saxion registration days was not researched.","registration_summary":"Saxion runs BSN registration days with the municipality at Deventer City Hall (Grote Kerkhof 1, 7411 KZ Deventer): Thursdays 3, 10, 17 and 24 September 2026, 09:00 to 16:00. Saxion schedules your appointment and emails the invitation at the end of August; you cannot choose or change the slot. Bring your passport or ID card, a colour copy of it and a signed copy of your rental agreement, all printed single-sided. The appointment takes about 15 minutes. If you do not live in Deventer, register at the city hall where you live.","registration_url":"https://www.saxion.edu/events/2026/september/bsn-registration-day-deventer","student_registration_days":true},{"booking_note":null,"id":"diemen","intl_centre_name":null,"intl_centre_url":null,"is_study_city":false,"last_verified":"2026-10-19","name":"Diemen","near_city_id":"amsterdam","note":"Student housing on Rode Kruislaan and Dalsteindreef is in Diemen. Book a registration appointment online at D.J. den Hartoglaan 1, and note":null,"registration_summary":"International students staying longer than four months must register at Enschede city hall (Hengelosestraat 51) and get their BSN the same day. University of Twente students starting in February or September receive an email with a link to book their municipality appointment, and Saxion runs BSN registration days at Enschede city hall (weekdays 24 August-11 September 2026) where the International Office assigns each student a fixed time slot. Students arriving at other times book an individual appointment via the municipality's contact page.","registration_url":"https://www.utwente.nl/en/education/student-services/visa/appointment-formalities.rtd/register-municipality/","student_registration_days":true},{"booking_note":"Book an appointment online via the municipality's student registration page; no booking window or opening date is stated.","id":"groningen","intl_centre_name":"International Welcome Center North (IWCN)","intl_centre_url":"https://iwcn.nl","is_study_city":true,"last_verified":"2026-10-19","name":"Groningen","near_city_id":null,"note":null,"registration_summary":"International students staying longer than 4 months must register in person with the municipality by appointment, booked online through the municipality's student registration page (RUG and Hanze both send students there). Visits to the Groningen Centrum counter (Kreupelstraat 1) are by appointment only. Bring a passport or ID card, a rental contract (or a permission form from the main resident), and, for non-EU students, the residence permit or IND proof/approval letter. The BSN is issued on the spot at the appointment.","registration_url":"https://gemeente.groningen.nl/en/student-registration-or-deregistration","student_registration_days":null},{"booking_note":null,"id":"heerlen","intl_centre_name":null,"intl_centre_url":null,"is_study_city":true,"last_verified":"2026-10-19","name":"Heerlen","near_city_id":"maastricht","note":"Zuyd's main campus city; its English page says people moving from abroad for 4+ months must register in person by appointment (contact gemeente@heerlen.nl).","registration_summary":null,"registration_url":"https://heerlen.nl/english","student_registration_days":null},{"booking_note":null,"id":"hengelo","intl_centre_name":null,"intl_centre_url":null,"is_study_city":false,"last_verified":"2026-10-19","name":"Hengelo","near_city_id":"enschede","note":"Neighbouring city that UT names for students who live outside Enschede and must register there.","registration_summary":null,"registration_url":"https://www.hengelo.nl/Welkom-in-Hengelo/Beheer/Header/Talen/English.html","student_registration_days":null},{"booking_note":"Book online as early as you can; late August and early September are the busiest weeks.","id":"leeuwarden","intl_centre_name":null,"intl_centre_url":null,"is_study_city":true,"last_verified":"2026-11-12","name":"Leeuwarden","near_city_id":null,"note":null,"registration_summary":"Book an appointment online with the municipality of Leeuwarden and register at Oldehoofsterkerkhof 2. Bring your original valid passport or ID card, a copy of your signed rental agreement, and copies of the data page and of every passport page with stamps or stickers. Campus Fryslân advises booking as soon as possible: if you register in weeks 33 to 36 you may not get your BSN at the appointment and may wait two to four weeks.","registration_url":"https://leeuwarden.mijnafspraakmaken.nl/Client/#?product=35","student_registration_days":null},{"booking_note":"For September 2026, student-session appointments start from the third week of August 2026. Students arriving at other times should phone the town hall (14 071, or +31 71 51 65 165 from abroad).","id":"leiden","intl_centre_name":null,"intl_centre_url":null,"is_study_city":true,"last_verified":"2026-10-19","name":"Leiden","near_city_id":null,"note":null,"registration_summary":"Newcomers first fill in the online 'Register your move' form, then get an email with a link to book an in-person appointment at the Stadskantoor (Bargelaan 190), which should be within 5 days of moving. Leiden University says the municipality runs special registration sessions for new students at the start of each semester. Students bring a passport, the residence permit or Leiden University approval email, and a rental contract (or landlord permission plus a copy of the landlord's ID). The university says a birth certificate is generally not needed for its students, although the municipality's page lists one.","registration_url":"https://gemeente.leiden.nl/inwoners-en-ondernemers/verhuizen-en-migreren/migreren/moving-to-leiden-from-abroad/","student_registration_days":true},{"booking_note":null,"id":"leidschendam-voorburg","intl_centre_name":null,"intl_centre_url":null,"is_study_city":false,"last_verified":"2026-10-19","name":"Leidschendam-Voorburg","near_city_id":"the-hague","note":"Borders The Hague and is in THIC's service area. Its Dutch-language page covers moving from abroad.","registration_summary":null,"registration_url":"https://www.lv.nl/verhuizen-vanuit-het-buitenland","student_registration_days":null},{"booking_note":"Booking details for regular student registration could not be confirmed; the Expat Centre combined appointment is requested via expatcentre@maastricht.nl.","id":"maastricht","intl_centre_name":"Expat Centre Maastricht Region (ECMR) / IND Service Point Maastricht, at the Maastricht International Centre (MIC)","intl_centre_url":"https://ind.nl/en/expat-centre-maastricht-region-ecmr-ind-service-point-maastricht","is_study_city":true,"last_verified":"2026-10-19","name":"Maastricht","near_city_id":null,"note":null,"registration_summary":"Official route for students from abroad staying 4+ months: fill in the online form (https://mijn-gemeenteloket.gemeentemaastricht.nl/pes/first-registration, Google Translate off), get an email within ~1-5 weeks with instructions, then book a GemeenteLoket appointment within 2 months; bring passport and (legalised) birth certificate; non-EU students need their IND permit first.","registration_url":"https://www.gemeentemaastricht.nl/en/moving-and-housing/international-student-registration","student_registration_days":false},{"booking_note":null,"id":"nieuwegein","intl_centre_name":null,"intl_centre_url":null,"is_study_city":false,"last_verified":"2026-10-19","name":"Nieuwegein","near_city_id":"utrecht","note":"Municipality bordering Utrecht to the south; its website has a page on the Utrecht International Center.","registration_summary":null,"registration_url":"https://www.nieuwegein.nl/hulp-en-ondersteuning/utrecht-international-center","student_registration_days":null},{"booking_note":null,"id":"nuenen","intl_centre_name":null,"intl_centre_url":null,"is_study_city":false,"last_verified":"2026-10-19","name":"Nuenen","near_city_id":"eindhoven","note":"Neighbouring municipality named by TU/e; register directly with the municipality.","registration_summary":null,"registration_url":"https://en.nuenen.nl/verhuizen-naar-nederland","student_registration_days":null},{"booking_note":null,"id":"oegstgeest","intl_centre_name":null,"intl_centre_url":null,"is_study_city":false,"last_verified":"2026-10-19","name":"Oegstgeest","near_city_id":"leiden","note":"Borders Leiden. Leiden University says to book by phone (+31 71 519 1793, press 1) and bring an original legalised birth certificate.","registration_summary":null,"registration_url":"https://www.oegstgeest.nl/inwoners/welcome-to-oegstgeest/moving-to-the-netherlands-for-the-first-time","student_registration_days":null},{"booking_note":null,"id":"rijswijk","intl_centre_name":null,"intl_centre_url":null,"is_study_city":false,"last_verified":"2026-10-19","name":"Rijswijk","near_city_id":"delft","note":"Between Delft and The Hague. Its Dutch-language page covers registering in the Netherlands for study or work.","registration_summary":null,"registration_url":"https://www.rijswijk.nl/inwoners/product/inschrijven-in-nederland-voor-studie-of-werk","student_registration_days":null},{"booking_note":"After submitting the online form you receive a case number and booking link; choose the appointment type 'Studentenafspraak gemeente', because other types follow the regular procedure without an immediate BSN.","id":"rotterdam","intl_centre_name":"Rotterdam International Center","intl_centre_url":"https://rotterdam.info/en/internationals/frequently-asked-questions","is_study_city":true,"last_verified":"2026-10-19","name":"Rotterdam","near_city_id":null,"note":null,"registration_summary":"Students start their first registration online on the Rotterdam municipality website, up to 4 weeks before arrival, and upload their ID and proof of address. They then get a case number and a link to book an in-person 'Studentenafspraak gemeente' (student appointment) at City Hall, Coolsingel 40, where the BSN is issued straight away. Addresses in postcode areas that need a housing permit (HVV) must register in person at the municipal office. EUR also mentions registration at campus One Stop Shops at the start of each semester.","registration_url":"https://www.rotterdam.nl/en/first-registration-in-the-netherlands/start-registration-in-the-netherlands-by-a-student","student_registration_days":true},{"booking_note":null,"id":"schiedam","intl_centre_name":null,"intl_centre_url":null,"is_study_city":false,"last_verified":"2026-10-19","name":"Schiedam","near_city_id":"rotterdam","note":"EUR names it as a neighbouring municipality where students must register locally rather than through Rotterdam.","registration_summary":null,"registration_url":"https://www.eur.nl/media/2025-02-first-registration-schiedam","student_registration_days":null},{"booking_note":null,"id":"sittard-geleen","intl_centre_name":null,"intl_centre_url":null,"is_study_city":true,"last_verified":"2026-11-12","name":"Sittard-Geleen","near_city_id":null,"note":"Zuyd University of Applied Sciences has a location in Sittard. How international students register here was not researched yet; check the municipality's own website.","registration_summary":null,"registration_url":null,"student_registration_days":null},{"booking_note":null,"id":"son-en-breugel","intl_centre_name":null,"intl_centre_url":null,"is_study_city":false,"last_verified":"2026-10-19","name":"Son en Breugel","near_city_id":"eindhoven","note":"Neighbouring municipality named by TU/e; register directly with the municipality.","registration_summary":null,"registration_url":"https://en.sonenbreugel.nl/verhuizen-naar-nederland","student_registration_days":null},{"booking_note":"THUAS students get booking instructions by email over the summer for a fast, simplified registration. Book straight away: slots fill quickly.","id":"the-hague","intl_centre_name":"The Hague International Centre","intl_centre_url":"https://www.thehagueinternationalcentre.nl/relocating/registration-procedure/sponsored/registration-for-students","is_study_city":true,"last_verified":"2026-10-19","name":"The Hague","near_city_id":null,"note":null,"registration_summary":"The Hague International Centre runs special registration days for new international students each semester. Bookings for the second half of 2026 opened on 6 July 2026.","registration_url":"https://www.thehagueinternationalcentre.nl/relocating/registration-procedure/sponsored/registration-for-students","student_registration_days":true},{"booking_note":"Book through the municipality's student appointment form before you arrive. A confirmed appointment cannot be changed. Fontys students: ask your study department whether it books the appointment for you.","id":"tilburg","intl_centre_name":null,"intl_centre_url":null,"is_study_city":true,"last_verified":"2026-11-12","name":"Tilburg","near_city_id":null,"note":null,"registration_summary":"Students living in Tilburg register by appointment only, at the Newcomers' Desk in the Stadswinkel Centrum (Spoorlaan 181, 5038 CB Tilburg). Tilburg University says you receive your BSN immediately at the appointment. Bring your passport, a printed copy of your rental contract and, if you need one, your Dutch residence permit or IND approval letter. Fontys also asks for an original birth certificate and its declaration of acceptance. You need permanent accommodation: hostels, hotels and Airbnb-type stays do not count.","registration_url":"https://winkel.tilburg.nl/formulieren/server/start/AfspraakMakenStudent","student_registration_days":null},{"booking_note":null,"id":"tynaarlo","intl_centre_name":null,"intl_centre_url":null,"is_study_city":false,"last_verified":"2026-10-19","name":"Tynaarlo","near_city_id":"groningen","note":"Drenthe municipality just south of Groningen city (villages such as Eelde, Paterswolde and Zuidlaren); this is its 'Eerste inschrijving in Nederland' (first registration) page.","registration_summary":null,"registration_url":"https://www.tynaarlo.nl/burgerzaken/verhuizen/eerste-inschrijving-nederland","student_registration_days":null},{"booking_note":"Book an appointment via the Utrecht International Center's 'register as a new student' page within 5 days of arrival.","id":"utrecht","intl_centre_name":"Utrecht International Center","intl_centre_url":"https://www.utrechtinternationalcenter.com/uic/formalities/registration/register-as-a-new-student","is_study_city":true,"last_verified":"2026-10-19","name":"Utrecht","near_city_id":null,"note":null,"registration_summary":"International students staying more than 4 months must book an appointment to register within 5 days of arriving in the Netherlands. Registration takes place at the Utrecht International Center, and you book through its 'register as a new student' page. Bring your passport or ID, a rental contract (or the proprietor's signed address form) and, if applicable, your residence permit, MVV or proof of application; registration gives you your BSN.","registration_url":"https://www.utrecht.nl/city-of-utrecht/registration/registration-international-students","student_registration_days":null},{"booking_note":null,"id":"veldhoven","intl_centre_name":null,"intl_centre_url":null,"is_study_city":false,"last_verified":"2026-10-19","name":"Veldhoven","near_city_id":"eindhoven","note":"Borders Eindhoven; TU/e says students living outside Eindhoven must book registration directly with their own municipality.","registration_summary":null,"registration_url":"https://veldhoven.nl/english/settling-in-the-netherlands","student_registration_days":null},{"booking_note":"Your university normally books for you. To book earlier yourself, use the municipality's page for people moving to Venlo from abroad. The municipality's website is in Dutch.","id":"venlo","intl_centre_name":null,"intl_centre_url":null,"is_study_city":true,"last_verified":"2026-11-12","name":"Venlo","near_city_id":null,"note":null,"registration_summary":"Register by appointment at the Stadskantoor (Hanzeplaats 1, 5912 AT Venlo) within five weekdays of arrival if you stay longer than four months. Maastricht University reserves appointments for its Campus Venlo students during Introduction Week and emails the details in June; the Fontys Student Service Centre books the appointment for Fontys students. The BSN can take up to five weeks, so register early. Bring your passport or ID, an original birth certificate plus a copy (legalised or with an apostille where required, with a certified translation if it is not in English, Dutch, French or German), proof of enrolment, a signed rental agreement and, for non-EU students, your residence permit or the visa decision email. Fontys says proof of civil status is always required in Venlo.","registration_url":"https://www.venlo.nl/verhuizen-vanuit-buitenland-naar-venlo","student_registration_days":null},{"booking_note":null,"id":"voorschoten","intl_centre_name":null,"intl_centre_url":null,"is_study_city":false,"last_verified":"2026-10-19","name":"Voorschoten","near_city_id":"leiden","note":"Neighbouring municipality whose first-registration process is covered on Leiden University's town hall registration page.","registration_summary":null,"registration_url":"https://www.voorschoten.nl/first-registration-in-the-netherlands","student_registration_days":null},{"booking_note":null,"id":"westerkwartier","intl_centre_name":null,"intl_centre_url":null,"is_study_city":false,"last_verified":"2026-10-19","name":"Westerkwartier","near_city_id":"groningen","note":"Municipality just west of Groningen city (including Zuidhorn and Leek); this is its 'Verhuizen naar Nederland' (moving to the Netherlands) page.","registration_summary":null,"registration_url":"https://www.westerkwartier.nl/verhuizen-naar-nederland","student_registration_days":null},{"booking_note":null,"id":"zeist","intl_centre_name":null,"intl_centre_url":null,"is_study_city":false,"last_verified":"2026-10-19","name":"Zeist","near_city_id":"utrecht","note":"Municipality bordering Utrecht to the east, close to Utrecht Science Park; the link is Zeist's address-declaration form.","registration_summary":null,"registration_url":"https://www.zeist.nl/fileadmin/bestanden/Open_gemeenten_nieuwe_bestandenboom/Verhuizen_en__ver_bouwen/Verhuizen/Aangifte-van-verhuizing.pdf","student_registration_days":null},{"booking_note":"Book online or call 14 079. Zoetermeer has no special student registration days.","id":"zoetermeer","intl_centre_name":null,"intl_centre_url":null,"is_study_city":true,"last_verified":"2026-11-12","name":"Zoetermeer","near_city_id":"the-hague","note":"THUAS has a campus here (Bleiswijkseweg 37). Zoetermeer is outside The Hague International Centre's service area, so you register with Zoetermeer itself.","registration_summary":"Register in person at the municipality of Zoetermeer (Engelandlaan 502, 2711 EB Zoetermeer) no later than the fifth day after you move in, if you will stay in the Netherlands at least 4 of the next 6 months. Registration is free.","registration_url":"https://en.zoetermeer.nl/form/afspraak-eerste-inschrijving-of-hervestiging-of-herinschrijving-vanuit-buitenland/eerste-inschrijving-0","student_registration_days":false}],"scam_questions":[{"explanation":"The classic deposit scam. Pay only after a viewing (in person or a live video call you control) and a signed contract.","id":1,"question":"Are you asked to pay a deposit or rent before you have seen the room or signed a contract?","source_id":"nltimes-2026a","weight":5},{"explanation":"A very common scam story. Ask a friend or someone from your university to view it, or ask for a live video tour.","id":2,"question":"Does the landlord say they are abroad and cannot show you the room?","source_id":null,"weight":5},{"explanation":"Huurteam Nederland reports a growing number of scams via Facebook.","id":3,"question":"Did you find the offer in a Facebook or social media group instead of a verified platform?","source_id":"huurteam-scams","weight":3},{"explanation":"If it looks too good to be true, it usually is.","id":4,"question":"Is the rent much lower than similar rooms in the same area?","source_id":null,"weight":4},{"explanation":"Pressure stops you from checking. A real landlord can wait a day.","id":5,"question":"Are you pushed to decide or pay within hours?","source_id":null,"weight":3},{"explanation":"Without registration you get no BSN, so no job, Dutch insurance or DigiD. Do not accept this.","id":6,"question":"Will the landlord refuse to let you register at the address?","source_id":"ucr-bsn","weight":5},{"explanation":"These payments cannot be reversed. Pay by bank transfer to an account in a name you can check.","id":7,"question":"Are you asked to pay in cash, crypto, gift cards or via a money transfer service?","source_id":null,"weight":4},{"explanation":"Not always a scam, but over half of international students saw higher rents and 75% saw \"no internationals\" ads. Discrimination can be reported; the LSVb hotline can advise.","id":8,"question":"Is the rent higher because you are an international, or does the ad say \"no internationals\"?","source_id":"iamexpat-2026","weight":2}],"services":[{"accepting_students":null,"city":"National","description":"Student union advice on rental problems and scams.","for_institution_id":null,"id":12,"last_verified":"2026-09-28","municipality_id":null,"name":"LSVb Housing Hotline","related_step_id":"find_housing","source_id":"nltimes-2026a","type":"support","url":"https://lsvb.nl"},{"accepting_students":null,"city":"Amsterdam","description":"Student housing provider listed by UvA for university housing rooms.","for_institution_id":null,"id":15,"last_verified":"2026-10-19","municipality_id":"amsterdam","name":"DUWO","related_step_id":"find_housing","source_id":null,"type":"housing","url":"https://www.duwo.nl/en/i-rent/i-have-found-a-room/new-duwo-university-housing-room"},{"accepting_students":null,"city":"Amsterdam","description":"Amsterdam housing corporation listed by UvA as a provider of rooms for international students.","for_institution_id":null,"id":16,"last_verified":"2026-10-19","municipality_id":"amsterdam","name":"Lieven de Key","related_step_id":"find_housing","source_id":null,"type":"housing","url":"https://lievendekey.guestinfo.com/EN-GB"},{"accepting_students":null,"city":"Amsterdam","description":"Private student stay listed by UvA and VU among their housing options.","for_institution_id":null,"id":17,"last_verified":"2026-10-19","municipality_id":"amsterdam","name":"The Social Hub Amsterdam West","related_step_id":"find_housing","source_id":null,"type":"housing","url":"https://www.thesocialhub.co/amsterdam-west/stay/student-stay/"},{"accepting_students":true,"city":"Amsterdam","description":"University GP practice where VU international students can register online; students living outside Amsterdam can choose a GP near home.","for_institution_id":null,"id":18,"last_verified":"2026-10-19","municipality_id":"amsterdam","name":"Universitaire Huisartsenpraktijk (UHP), Amsterdam UMC/VUmc","related_step_id":"register_gp","source_id":null,"type":"gp","url":"https://www.vumc.nl/zorg/expertisecentra-en-specialismen/universitaire-huisartsenpraktijk-uhp.htm"},{"accepting_students":true,"city":"Amsterdam","description":"Listed by the University of Amsterdam for its students. It has GPs who know student life, at the Oude Turfmarkt, and UvA students can stay registered there wherever they live in Amsterdam. AUC also lists it, at Oude Turfmarkt 151.","for_institution_id":null,"id":19,"last_verified":"2026-10-19","municipality_id":"amsterdam","name":"UvA General Practitioners Practice (Huisartsen Oude Turfmarkt)","related_step_id":"register_gp","source_id":null,"type":"gp","url":"https://www.huisartsenamsterdam.nl/international/"},{"accepting_students":null,"city":"Amsterdam","description":"VU welcome programme for new international students, including Master's introduction days, Jumpstart and Practical Matters Days.","for_institution_id":null,"id":20,"last_verified":"2026-10-19","municipality_id":"amsterdam","name":"VU Onboarding for international students","related_step_id":"intro_week","source_id":null,"type":"community","url":"https://vu.nl/en/education/more-about/onboarding-international-students"},{"accepting_students":null,"city":"Amsterdam","description":"English page for people the IND has referred for a TB test. It covers Amsterdam and nearby municipalities, including Amstelveen, Diemen and Weesp. You register with the online form and the GGD sends you an appointment letter. Bring your passport/ID, the IND referral form and a debit card. The test is not free, and the TB team's phone number is 020 555 5911.","for_institution_id":null,"id":21,"last_verified":"2026-10-19","municipality_id":"amsterdam","name":"GGD Amsterdam","related_step_id":"tb_test","source_id":null,"type":"government","url":"https://www.ggd.amsterdam.nl/english/tuberculosis/letter-ind/"},{"accepting_students":null,"city":"Amsterdam","description":"UvA student-site page on ESN Amsterdam, the international student association.","for_insti nce)","title":"Veranderingen rondom de zorg in 2026","url":"https://www.wijzeringeldzaken.nl/actueel/veranderingen-rondom-de-zorg-in-2026/veranderingen-rondom-de-zorg-in-2026.pdf"}},"step_local":[{"body":"You live in Amstelveen, so you register with the municipality of Amstelveen, not Amsterdam.\nStudent registration days or online pre-registration run by Amsterdam may not apply to you. Check Amstelveen's own page.\nCheck whether IN Amsterdam serves Amstelveen before you book there.","last_verified":"2026-10-19","links":[{"label":"Registering in Amstelveen","url":"https://www.amstelveen.nl/vertrek-en-verhuizing"}],"municipality_id":"amstelveen","step_id":"book_registration"},{"body":"International students first pre-register online with the City of Amsterdam (for Fall 2026 the window ran 13 July to 18 September 2026); universities do not do this for you. Once approved, you get an email to book an in-person slot on a student registration day (17 August to 25 September 2026) at Bos en Lommerplein 176, 1055 RW Amsterdam, where the BSN is issued quickly. Students who miss the pre-registration window book a regular first-registration appointment instead, which universities warn can delay the BSN by weeks.\nPre-register online, then book a student-registration-day slot via the email link; late arrivals call +31 20 624 1111 for a regular appointment, and HvA expects Spring 2027 pre-registration dates around December/January.\nIN Amsterdam: Newcomer centre where internationals book one in-person appointment for municipal registration, and where VU says IND matters for its international staff and guests are handled in the same visit.","last_verified":"2026-10-19","links":[{"label":"Registering in Amsterdam","url":"https://www.amsterdam.nl/en/civil-affairs/pre-registration-for-students/"},{"label":"IN Amsterdam","url":"https://www.iamsterdam.com/en/live-work-study/in-amsterdam/international-newcomers/make-an-appointment-individuals"}],"municipality_id":"amsterdam","step_id":"book_registration"},{"body":"You live in Diemen, so you register with the municipality of Diemen, not Amsterdam.\nStudent registration days or online pre-registration run by Amsterdam may not apply to you. Check Diemen's own page.\nCheck whether IN Amsterdam serves Diemen before you book there.","last_verified":"2026-10-19","links":[{"label":"Registering in Diemen","url":"https://diemen.mijnafspraakmaken.nl/Client/#?product=32"}],"municipality_id":"diemen","step_id":"book_registration"},{"body":"University of Amsterdam: Non-EU students collect their residence permit only at the IND office in Amsterdam, by appointment booked at https://ind.nl/en/appointment-to-collect-document. The permit is usually ready about 3 weeks after biometrics, and you check its status in MyIND. UvA also runs centralised collection days in August/September.\nVrije Universiteit Amsterdam: New non-EU students who need only a residence permit (VVR) book an IND appointment to collect the card soon after arrival; slots are limited, so VU advises checking the IND appointment tool often for cancellations. The page does not name which IND desk.\nAmsterdam University of Applied Sciences (HvA): For September 2026 starters, the IND held central collection days at the Jaarbeurs (Beatrixgebouw) in Utrecht on Sat 29 Aug and Sat 19 Sep 2026, and the IND asks students to book a time slot. The rest of the year, AUAS Immigration Affairs emails you when the permit is ready and explains how to book an IND desk appointment online (bring your passport).","last_verified":"2026-10-19","links":[{"label":"University of Amsterdam international office","url":"https://www.uva.nl/en/education/practical-information/checklist-for-international-students/checklist-international-students.html"},{"label":"Vrije Universiteit Amsterdam international office","url":"https://vu.nl/en/education/more-about/when-you-arrive"},{"label":"Amsterdam University of Applied Sciences (HvA) international office","url":"https://www.amsterdamuas.com/study/international-admissions/upon-arrival"}],"municipality_id":"amsterdam","step_id":"collect_permit"},{"body":"University of Amsterdam students: UvA Housing (practical information). UvA housing information page; it works with providers including DUWO, Lieven de Key, StuNest Spartaan, Student Experience, The Social Hub Amsterdam West and Hubstudios.\nVrije Universiteit Amsterdam students: VU Accommodation. VU's student accommodation page; keys and housing emails come from your housing provider. Its residences include Uilenstede (Amstelveen) and buildings in Diemen.\nAmsterdam University of Applied Sciences (HvA) students: AUAS Housing. AUAS housing information for international students, with a separate guide to finding housing on your own.\nDUWO: Student housing provider listed by UvA for university housing rooms.\nLieven de Key: Amsterdam housing corporation listed by UvA as a provider of rooms for international students.\nThe Social Hub Amsterdam West: Private student stay listed by UvA and VU among their housing options.","last_verified":"2026-10-19","links":[{"label":"UvA Housing (practical information)","url":"https://www.uva.nl/en/education/practical-information/housing/housing.html"},{"label":"VU Accommodation","url":"https://vu.nl/en/student/accommodation"},{"label":"AUAS Housing","url":"https://www.amsterdamuas.com/study/international-admissions/housing"},{"label":"DUWO","url":"https://www.duwo.nl/en/i-rent/i-have-found-a-room/new-duwo-university-housing-room"},{"label":"Lieven de Key","url":"https://lievendekey.guestinfo.com/EN-GB"},{"label":"The Social Hub Amsterdam West","url":"https://www.thesocialhub.co/amsterdam-west/stay/student-stay/"}],"municipality_id":"amsterdam","step_id":"find_housing"},{"body":"VU Onboarding for international students: VU welcome programme for new international students, including Master's introduction days, Jumpstart and Practical Matters Days.","last_verified":"2026-10-19","links":[{"label":"VU Onboarding for international students","url":"https://vu.nl/en/education/more-about/onboarding-international-students"}],"municipality_id":"amsterdam","step_id":"intro_week"},{"body":"Erasmus Student Network Amsterdam (ESN Amsterdam): UvA student-site page on ESN Amsterdam, the international student association.","last_verified":"2026-10-19","links":[{"label":"Erasmus Student Network Amsterdam (ESN Amsterdam)","url":"https://student.uva.nl/en/information/erasmus-student-network-amsterdam-esn-amsterdam"}],"municipality_id":"amsterdam","step_id":"join_community"},{"body":"Universitaire Huisartsenpraktijk (UHP), Amsterdam UMC/VUmc: University GP practice where VU international students can register online; students living outside Amsterdam can choose a GP near home.\nUvA General Practitioners Practice (Huisartsen Oude Turfmarkt): Listed by the University of Amsterdam for its students. It has GPs who know student life, at the Oude Turfmarkt, and UvA students can stay registered there wherever they live in Amsterdam. AUC also lists it, at Oude Turfmarkt 151.\nHuisartsenposten Amsterdam (out-of-hours GP): Out-of-hours GP service for evenings, nights and weekends, linked from the UvA GP practice page.","last_verified":"2026-10-19","links":[{"label":"GGD Amsterdam","url":"https://www.ggd.amsterdam.nl/english/tuberculosis/letter-ind/"},{"label":"Huisartsenposten Amsterdam (out-of-hours GP)","url":"https://huisartsenpostenamsterdam.nl/en/"}],"municipality_id":"amsterdam","step_id":"register_gp"},{"body":"You live in Amstelveen, so you register with the municipality of Amstelveen, not Amsterdam.\nStudent registration days or online pre-registration run by Amsterdam may not apply to you. Check Amstelveen's own page.\nCheck whether IN Amsterdam serves Amstelveen before you book there.","last_verified":"2026-10-19","links":[{"label":"Registering in Amstelveen","url":"https://www.amstelveen.nl/vertrek-en-verhuizing"}],"municipality_id":"amstelveen","step_id":"register_municipality"},{"body":"Your appointment is with the municipality of Amsterdam.\nPre-register online, then book a student-registration-day slot via the email link; late arrivals call +31 20 624 1111 for a regular appointment, and HvA expects Spring 2027 pre-registration dates around December/January.","last_verified":"2026-10-19","links":[{"label":"Registering in Amsterdam","url":"https://www.amsterdam.nl/en/civil-affairs/pre-registration-for-students/"},{"label":"IN Amsterdam","url":"https://www.iamsterdam.com/en/live-work-study/in-amsterdam/international-newcomers/make-an-appointment-individuals"}],"municipality_id":"amsterdam","step_id":"register_municipality"},{"body":"You live in Diemen, so you register with the municipality of Diemen, not Amsterdam.\nStudent registration days or online pre-registration run by Amsterdam may not apply to you. Check Diemen's own page.\nCheck whether IN Amsterdam serves Diemen before you book there.","last_verified":"2026-10-19","links":[{"label":"Registering in Diemen","url":"https://diemen.mijnafspraakmaken.nl/Client/#?product=32"}],"municipality_id":"diemen","step_id":"register_municipality"},{"body":"GGD Amsterdam runs the TB check for Amsterdam. English page for people the IND has referred for a TB test. It covers Amsterdam and nearby municipalities, including Amstelveen, Diemen and Weesp. You register with the online form and the GGD sends you an appointment letter. Bring your passport/ID, the IND referral form and a debit card. The test is not free, and the TB team's phone number is 020 555 5911.","last_verified":"2026-10-19","links":[{"label":"GGD Amsterdam","url":"https://www.ggd.amsterdam.nl/english/tuberculosis/letter-ind/"}],"municipality_id":"amsterdam","step_id":"tb_test"},{"body":"City page on registering in the BRP; register within 5 days of arrival by online appointment.\nBook online at https://www.delft.nl/registration. You can only book once your rental agreement has started.\nThe Hague International Centre: Handles BRP registration and formalities in one place for internationals who work for an IND-recognised sponsor. Delft students register at the Delft city office instead.","last_verified":"2026-10-19","links":[{"label":"Registering in Delft","url":"https://www.delft.nl/en/registration-international-students"},{"label":"The Hague International Centre","url":"https://www.thehagueinternationalcentre.nl/relocating/formalities/personal-records-database-brp"}],"municipality_id":"delft","step_id":"book_registration"},{"body":"You live in Rijswijk, so you register with the municipality of Rijswijk, not Delft.\nStudent registration days or online pre-registration run by Delft may not apply to you. Check Rijswijk's own page.\nThe Hague International Centre also serves Rijswijk, so you can still use it.","last_verified":"2026-10-19","links":[{"label":"Registering in Rijswijk","url":"https://www.rijswijk.nl/inwoners/product/inschrijven-in-nederland-voor-studie-of-werk"}],"municipality_id":"rijswijk","step_id":"book_registration"},{"body":"THUAS, Delft campus: Non-EU students collect their permit at a central IND collection day at the Jaarbeurs in Utrecht. THUAS invites you to book once the IND has approved it.","last_verified":"2026-11-12","links":[{"label":"THUAS International Office","url":"https://www.thuas.com/study-choice/international-office"}],"municipality_id":"delft","step_id":"collect_permit"},{"body":"DUWO: Main student housing corporation in Delft (also in Leiden and The Hague).\nCity of Delft student housing information: Municipality's student housing page. The city notes that most Delft institutions help international students apply for housing.","last_verified":"2026-10-19","links":[{"label":"DUWO","url":"https://duwo.nl/en"},{"label":"City of Delft student housing information","url":"https://www.delft.nl/en/student-housing"}],"municipality_id":"delft","step_id":"find_housing"},{"body":"TU Delft Introduction Programme (MSc, exchange and bridging students): TU Delft's introduction programme for new master/international students, usually in the last week of August; the page content seen referred to 2020, so check current dates.","last_verified":"2026-10-19","links":[{"label":"TU Delft Introduction Programme (MSc, exchange and bridging students)","url":"https://www.tudelft.nl:443/en/education/practical-matters/introduction-period/msc-and-bridging-august"}],"municipality_id":"delft","step_id":"intro_week"},{"body":"SGZ Student Health Care: Student GP practice (campus drop-in at Leeghwaterstraat 152, appointments at Kampveld 10A) recommended in TU Delft's Delta magazine; the article dates from 2017.\nHuisartsenpost Delft (out-of-hours GP): Out-of-hours GP service in the Reinier de Graaf hospital building, weekdays 17:00-08:00 and 24h at weekends (per Delta, 2017).","last_verified":"2026-10-19","links":[{"label":"SGZ Student Health Care","url":"https://www.sgzstudent.nl/student-health-care/introduction"},{"label":"Huisartsenpost Delft (out-of-hours GP)","url":"http://www.huisartsenpostdelft.nl/english/"}],"municipality_id":"delft","step_id":"register_gp"},{"body":"Your appointment is with the municipality of Delft.\nBook online at https://www.delft.nl/registration. You can only book once your rental agreement has started.","last_verified":"2026-10-19","links":[{"label":"Registering in Delft","url":"https://www.delft.nl/en/registration-international-students"},{"label":"The Hague International Centre","url":"https://www.thehagueinternationalcentre.nl/relocating/formalities/personal-records-database-brp"}],"municipality_id":"delft","step_id":"register_municipality"},{"body":"You live in Rijswijk, so you register with the municipality of Rijswijk, not Delft.\nStudent registration days or online pre-registration run by Delft may not apply to you. Check Rijswijk's own page.\nThe Hague International Centre also serves Rijswijk, so you can still use it.","last_verified":"2026-10-19","links":[{"label":"Registering in Rijswijk","url":"https://www.rijswijk.nl/inwoners/product/inschrijven-in-nederland-voor-studie-of-werk"}],"municipality_id":"rijswijk","step_id":"register_municipality"},{"body":"Saxion runs BSN registration days with the municipality at Deventer City Hall (Grote Kerkhof 1, 7411 KZ Deventer): Thursdays 3, 10, 17 and 24 September 2026, 09:00 to 16:00. Saxion schedules your appointment and emails the invitation at the end of August; you cannot choose or change the slot. Bring your passport or ID card, a colour copy of it and a signed copy of your rental agreement, all printed single-sided. The appointment takes about 15 minutes. If you do not live in Deventer, register at the city hall where you live.\nSaxion students get a fixed slot by email at the end of August. If you already have a BSN or do not live in Deventer, email the Saxion International Office so the slot can be cancelled.","last_verified":"2026-11-12","links":[{"label":"Saxion BSN registration days in Deventer","url":"https://www.saxion.edu/events/2026/september/bsn-registration-day-deventer"}],"municipality_id":"deventer","step_id":"book_registration"},{"body":"Your appointment is with the municipality of Deventer.\nSaxion students get a fixed slot by email at the end of August. If you already have a BSN or do not live in Deventer, email the Saxion International Office so the slot can be cancelled.","last_verified":"2026-11-12","links":[{"label":"Saxion BSN registration days in Deventer","url":"https://www.saxion.edu/events/2026/september/bsn-registration-day-deventer"}],"municipality_id":"deventer","step_id":"register_municipality"},{"body":"Foreign students staying at least 4 of the coming 6 months must register in person at the municipality's Residents' Plaza (Stadhuisplein 1), preferably within 5 days of arrival, after first booking an appointment online (separate booking links for EU and non-EU students). Bring a valid passport, IND documents if applicable, original (legalised) foreign documents such as a birth certificate, and your rental contract; the BSN confirmation letter arrives within about 4 weeks. TU/e gives its students access to a booking portal with slots prioritized for TU/e students during the Bachelor Introduction Week or Master Kick-off, and some Fontys study departments arrange the appointment for their international students.\nBook online before going (EU: https://eindhoven.mijnafspraakmaken.nl/client/#?product=6, non-EU: https://eindhoven.mijnafspraakmaken.nl/client/#?product=64) or by phone on 14 040; availability can be limited in peak periods.\nHolland Expat Center South: Handles formal settlement procedures (municipal registration and residence documents) for internationals in participating municipalities, including an accelerated combined procedure for certain EU/non-EU categories and collection of some residence/work permits; people not eligible are referred to their local municipality.","last_verified":"2026-10-19","links":[{"label":"Registering in Eindhoven","url":"https://www.eindhoven.nl/stad-en-wonen/wonen/registration-of-foreign-students"},{"label":"Holland Expat Center South","url":"https://www.hollandexpatcenter.com/"}],"municipality_id":"eindhoven","step_id":"book_registration"},{"body":"You live in Nuenen, so you register with the municipality of Nuenen, not Eindhoven.\nStudent registration days or online pre-registration run by Eindhoven may not apply to you. Check Nuenen's own page.\nCheck whether Holland Expat Center South serves Nuenen before you book there.","last_verified":"2026-10-19","links":[{"label":"Registering in Nuenen","url":"https://en.nuenen.nl/verhuizen-naar-nederland"}],"municipality_id":"nuenen","step_id":"book_registration"},{"body":"You live in Son en Breugel, so you register with the municipality of Son en Breugel, not Eindhoven.\nStudent registration days or online pre-registration run by Eindhoven may not apply to you. Check Son en Breugel's own page.\nCheck whether Holland Expat Center South serves Son en Breugel before you book there.","last_verified":"2026-10-19","links":[{"label":"Registering in Son en Breugel","url":"https://en.sonenbreugel.nl/verhuizen-naar-nederland"}],"municipality_id":"son-en-breugel","step_id":"book_registration"},{"body":"You live in Veldhoven, so you register with the municipality of Veldhoven, not Eindhoven.\nStudent registration days or online pre-registration run by Eindhoven may not apply to you. Check Veldhoven's own page.\nCheck whether Holland Expat Center South serves Veldhoven before you book there.","last_verified":"2026-10-19","links":[{"label":"Registering in Veldhoven","url":"https://veldhoven.nl/english/settling-in-the-netherlands"}],"municipality_id":"veldhoven","step_id":"book_registration"},{"body":"Eindhoven University of Technology (TU/e): TU/e (exchange-student services page) says it arranges for students to receive their residence permit card in Eindhoven; Holland Expat Center South (Stadhuisplein 10, Eindhoven) is an IND-listed location that issues residence documents. Exact pickup arrangement for degree students not confirmed.\nFontys University of Applied Sciences: Fontys only says to pick up your residence permit (VVR) soon after arrival, without naming a location; collect where your IND letter tells you to (in Eindhoven, Holland Expat Center South issues residence documents).","last_verified":"2026-10-19","links":[{"label":"Eindhoven University of Technology (TU/e) international office","url":"https://educationguide.tue.nl/practical-info/information-for-international-students"},{"label":"Fontys University of Applied Sciences international office","url":"https://www.fontys.nl/en/Fontys-Helps/Practical-information-52/City-hall-registration.htm"}],"municipality_id":"eindhoven","step_id":"collect_permit"},{"body":"Eindhoven University of Technology (TU/e) students: TU/e Housing. TU/e's housing information section for incoming students, linked from its city hall registration guide.\nFontys University of Applied Sciences students: Fontys Accommodation. Fontys has no halls of its own but works with trusted landlords/agencies for students living abroad on English-taught programmes (deadlines 15 June for fall, 8 December for spring; no guaranteed room).\nVestide: Student housing provider; listed by Fontys among housing agencies for Eindhoven.\nHolland2Stay: Commercial furnished-housing provider in Eindhoven, listed by Fontys as a commercial agency.\nHuurteam Eindhoven: Free rental advice team the municipality points students to for rental problems.","last_verified":"2026-10-19","links":[{"label":"TU/e Housing","url":"https://www.tue.nl/en/education/become-a-tue-student/housing"},{"label":"Fontys Accommodation","url":"https://www.fontys.nl/en/Fontys-Helps/Practical-information-52/Accommodation.htm"},{"label":"Vestide","url":"https://vestide.nl/en/about-us"},{"label":"Holland2Stay","url":"https://www.holland2stay.com/blog/student-life-eindhoven"},{"label":"Huurteam Eindhoven","url":"https://huurteameindhoven.nl/"}],"municipality_id":"eindhoven","step_id":"find_housing"},{"body":"Welcome & Enrollment @TU/e (international Master students): TU/e welcome and enrollment programme for incoming international Master students; Bachelor Introduction Week / Master Kick-off is when TU/e opens its municipal booking portal.","last_verified":"2026-10-19","links":[{"label":"Welcome & Enrollment @TU/e (international Master students)","url":"https://www.tue.nl/en/education/become-a-tue-student/admission-and-enrollment/welcome-enrollment-tue-for-international-master-students"}],"municipality_id":"eindhoven","step_id":"intro_week"},{"body":"Stroomz - De Ring International: Recommended GP option on TU/e's Education Guide health-care page for international students.\nMedisch Kwartier Eindhoven: Recommended GP option on TU/e's Education Guide health-care page for international students.\nHuisarts Zuidoost-Brabant (GP finder): Regional GP finder that TU/e points students to for checking which practices in the Eindhoven region accept new patients (not a practice itself).\nTU/e: Dutch healthcare system explained: TU/e guide on registering with a GP early (waiting lists), referrals and the out-of-hours Spoedpost at Catharina Hospital (Michelangelolaan 2).","last_verified":"2026-10-19","links":[{"label":"GGD Brabant-Zuidoost","url":"https://www.ggdbzo.nl/tuberculose/immigranten-en-expats/"},{"label":"TU/e: Dutch healthcare system explained","url":"https://www.tue.nl/en/education/become-a-tue-student/dutch-healthcare-system-explained"}],"municipality_id":"eindhoven","step_id":"register_gp"},{"body":"Your appointment is with the municipality of Eindhoven.\nBook online before going (EU: https://eindhoven.mijnafspraakmaken.nl/client/#?product=6, non-EU: https://eindhoven.mijnafspraakmaken.nl/client/#?product=64) or by phone on 14 040; availability can be limited in peak periods.","last_verified":"2026-10-19","links":[{"label":"Registering in Eindhoven","url":"https://www.eindhoven.nl/stad-en-wonen/wonen/registration-of-foreign-students"},{"label":"Holland Expat Center South","url":"https://www.hollandexpatcenter.com/"}],"municipality_id":"eindhoven","step_id":"register_municipality"},{"body":"You live in Nuenen, so you register with the municipality of Nuenen, not Eindhoven.\nStudent registration days or online pre-registration run by Eindhoven may not apply to you. Check Nuenen's own page.\nCheck whether Holland Expat Center South serves Nuenen before you book there.","last_verified":"2026-10-19","links":[{"label":"Registering in Nuenen","url":"https://en.nuenen.nl/verhuizen-naar-nederland"}],"municipality_id":"nuenen","step_id":"register_municipality"},{"body":"You live in Son en Breugel, so you register with the municipality of Son en Breugel, not Eindhoven.\nStudent registration days or online pre-registration run by Eindhoven may not apply to you. Check Son en Breugel's own page.\nCheck whether Holland Expat Center South serves Son en Breugel before you book there.","last_verified":"2026-10-19","links":[{"label":"Registering in Son en Breugel","url":"https://en.sonenbreugel.nl/verhuizen-naar-nederland"}],"municipality_id":"son-en-breugel","step_id":"register_municipality"},{"body":"You live in Veldhoven, so you register with the municipality of Veldhoven, not Eindhoven.\nStudent registration days or online pre-registration run by Eindhoven may not apply to you. Check Veldhoven's own page.\nCheck whether Holland Expat Center South serves Veldhoven before you book there.","last_verified":"2026-10-19","links":[{"label":"Registering in Veldhoven","url":"https://veldhoven.nl/english/settling-in-the-netherlands"}],"municipality_id":"veldhoven","step_id":"register_municipality"},{"body":"GGD Brabant-Zuidoost runs the TB check for Eindhoven. TB screening page for immigrants and expats referred by the IND: register via the online form (one per person), appointment comes by email; chest X-ray costs EUR 56 paid at the appointment; TB team: tuberculosebestrijding@ggdbzo.nl.","last_verified":"2026-10-19","links":[{"label":"GGD Brabant-Zuidoost","url":"https://www.ggdbzo.nl/tuberculose/immigranten-en-expats/"}],"municipality_id":"eindhoven","step_id":"tb_test"},{"body":"TU/e Student Wellbeing: TU/e's student wellbeing hub (student counsellors, psychologists, extra support).\n113 Suicide Prevention (English): National 24/7 phone and chat support, listed by TU/e on its Dutch healthcare explainer.","last_verified":"2026-10-19","links":[{"label":"TU/e Student Wellbeing","url":"https://educationguide.tue.nl/guidance-and-development/student-wellbeing"},{"label":"113 Suicide Prevention (English)","url":"https://www.113.nl/english"}],"municipality_id":"eindhoven","step_id":"wellbeing_checkin"},{"body":"International students staying longer than four months must register at Enschede city hall (Hengelosestraat 51) and get their BSN the same day. University of Twente students starting in February or September receive an email with a link to book their municipality appointment, and Saxion runs BSN registration days at Enschede city hall (weekdays 24 August-11 September 2026) where the International Office assigns each student a fixed time slot. Students arriving at other times book an individual appointment via the municipality's contact page.\nUT students book via the link emailed before their intake; Saxion students get an emailed invitation with a fixed slot; others book via https://www.enschede.nl/en/english-contact-and-opening-hours.\nExpat Center East Netherlands: World Trade Center Twente initiative (Industrieplein 1, Hengelo, with a weekly session at the Enschede Stadskantoor) helping internationals with permits, BSN/municipal registration (with six municipalities and the IND), housing and taxes; own site www.ecen.nl; aimed at expats rather than students.","last_verified":"2026-10-19","links":[{"label":"Registering in Enschede","url":"https://www.utwente.nl/en/education/student-services/visa/appointment-formalities.rtd/register-municipality/"},{"label":"Expat Center East Netherlands","url":"https://twente.com/organisaties/expat-center-east-netherlands"}],"municipality_id":"enschede","step_id":"book_registration"},{"body":"You live in Hengelo, so you register with the municipality of Hengelo, not Enschede.\nStudent registration days or online pre-registration run by Enschede may not apply to you. Check Hengelo's own page.\nCheck whether Expat Center East Netherlands serves Hengelo before you book there.","last_verified":"2026-10-19","links":[{"label":"Registering in Hengelo","url":"https://www.hengelo.nl/Welkom-in-Hengelo/Beheer/Header/Talen/English.html"}],"municipality_id":"hengelo","step_id":"book_registration"},{"body":"University of Twente: UT arranges group IND appointments: summer-intake pickups are normally at a central location and winter-intake pickups on campus; if you miss it, book an individual IND appointment and collect at the IND office in Zwolle.\nSaxion University of Applied Sciences: Collected at a central IND Student Day at Jaarbeurs Utrecht (Beatrix Building) on Saturday 29 August or Saturday 19 September 2026; the date is assigned by email about two weeks ahead and booked via the emailed link.","last_verified":"2026-10-19","links":[{"label":"University of Twente international office","url":"https://www.utwente.nl/en/education/student-services/visa/appointment-formalities.rtd/register-municipality/"},{"label":"Saxion University of Applied Sciences international office","url":"https://www.saxion.edu/studying-in-the-netherlands/practical-matters/visa-and-residence-permit"}],"municipality_id":"enschede","step_id":"collect_permit"},{"body":"University of Twente students: UT Housing (via Roomspot). UT's housing information; first-year international students get some priority on Roomspot via its 'Special offer UT' section.\nRoomspot: Regional housing site used by UT, with priority offers for first-year UT internationals.\nUT campus housing: UT's student housing information, including on-campus options.\nStudent houses (Student Union): Rooms in student houses, sometimes after a 'hospitation' meeting with housemates.","last_verified":"2026-10-19","links":[{"label":"UT Housing (via Roomspot)","url":"https://www.utwente.nl/en/campus/housing/students"},{"label":"Roomspot","url":"https://www.roomspot.nl/en/home"},{"label":"Student houses (Student Union)","url":"https://su.utwente.nl/en/rooms/student-houses/"}],"municipality_id":"enschede","step_id":"find_housing"},{"body":"Kick-In (University of Twente): UT's introduction period for all students starting in September, held in late August.\nSaxion INTRO: Saxion's introduction week in Enschede/Deventer; 26-28 August in 2026, followed by onboarding afternoons September-December.\nUT International Onboarding: UT Onboarding Market for new international students around the September start.","last_verified":"2026-10-19","links":[{"label":"Kick-In (University of Twente)","url":"https://www.kick-in.nl/en"},{"label":"Saxion INTRO","url":"https://www.saxion.edu/studying-in-the-netherlands/introduction-week/intro"},{"label":"UT International Onboarding","url":"https://www.utwente.nl/en/education/student-services/upcoming-students/international-onboarding"}],"municipality_id":"enschede","step_id":"intro_week"},{"body":"UT Buddy Programme: Matches new international UT students with an experienced student for their first ten weeks.","last_verified":"2026-10-19","links":[{"label":"UT Buddy Programme","url":"https://su.utwente.nl/en/get-involved/introduction-days/buddy-programme"}],"municipality_id":"enschede","step_id":"join_community"},{"body":"Campus GP (Campushuisarts), UT: GP practice in the campus medical centre (building De Sleutel), listed by the University of Twente's health services page.\nSpoedpost Huisartsen Twente (out-of-hours): After-hours GP care, English info, listed by UT.","last_verified":"2026-10-19","links":[{"label":"GGD Twente","url":"https://www.ggdtwente.nl/onderwerpen/home-infectieziekten/tuberculose"},{"label":"Spoedpost Huisartsen Twente (out-of-hours)","url":"https://sht.nl/language/english"}],"municipality_id":"enschede","step_id":"register_gp"},{"body":"Your appointment is with the municipality of Enschede.\nUT students book via the link emailed before their intake; Saxion students get an emailed invitation with a fixed slot; others book via https://www.enschede.nl/en/english-contact-and-opening-hours.","last_verified":"2026-10-19","links":[{"label":"Registering in Enschede","url":"https://www.utwente.nl/en/education/student-services/visa/appointment-formalities.rtd/register-municipality/"},{"label":"Expat Center East Netherlands","url":"https://twente.com/organisaties/expat-center-east-netherlands"}],"municipality_id":"enschede","step_id":"register_municipality"},{"body":"You live in Hengelo, so you register with the municipality of Hengelo, not Enschede.\nStudent registration days or online pre-registration run by Enschede may not apply to you. Check Hengelo's own page.\nCheck whether Expat Center East Netherlands serves Hengelo before you book there.","last_verified":"2026-10-19","links":[{"label":"Registering in Hengelo","url":"https://www.hengelo.nl/Welkom-in-Hengelo/Beheer/Header/Talen/English.html"}],"municipality_id":"hengelo","step_id":"register_municipality"},{"body":"GGD Twente runs the TB check for Enschede. GGD Twente's TB page; UT books group TB-test appointments at the GGD (October for September starters, March for February) and Saxion's International Office emails invites.","last_verified":"2026-10-19","links":[{"label":"GGD Twente","url":"https://www.ggdtwente.nl/onderwerpen/home-infectieziekten/tuberculose"}],"municipality_id":"enschede","step_id":"tb_test"},{"body":"UT SACC - Well-being: UT student advisers, counsellors and psychologists (Student Affairs Counselling & Coaching).","last_verified":"2026-10-19","links":[{"label":"UT SACC - Well-being","url":"https://www.utwente.nl/en/ces/sacc/well-being"}],"municipality_id":"enschede","step_id":"wellbeing_checkin"},{"body":"International students staying longer than 4 months must register in person with the municipality by appointment, booked online through the municipality's student registration page (RUG and Hanze both send students there). Visits to the Groningen Centrum counter (Kreupelstraat 1) are by appointment only. Bring a passport or ID card, a rental contract (or a permission form from the main resident), and, for non-EU students, the residence permit or IND proof/approval letter. The BSN is issued on the spot at the appointment.\nBook an appointment online via the municipality's student registration page; no booking window or opening date is stated.\nInternational Welcome Center North (IWCN): Listed by Hanze as a resource for internationals in Groningen. What it does for students, including any role in registration, was not confirmed.","last_verified":"2026-10-19","links":[{"label":"Registering in Groningen","url":"https://gemeente.groningen.nl/en/student-registration-or-deregistration"},{"label":"International Welcome Center North (IWCN)","url":"https://iwcn.nl"}],"municipality_id":"groningen","step_id":"book_registration"},{"body":"You live in Tynaarlo, so you register with the municipality of Tynaarlo, not Groningen.\nStudent registration days or online pre-registration run by Groningen may not apply to you. Check Tynaarlo's own page.\nCheck whether International Welcome Center North (IWCN) serves Tynaarlo before you book there.","last_verified":"2026-10-19","links":[{"label":"Registering in Tynaarlo","url":"https://www.tynaarlo.nl/burgerzaken/verhuizen/eerste-inschrijving-nederland"}],"municipality_id":"tynaarlo","step_id":"book_registration"},{"body":"You live in Westerkwartier, so you register with the municipality of Westerkwartier, not Groningen.\nStudent registration days or online pre-registration run by Groningen may not apply to you. Check Westerkwartier's own page.\nCheck whether International Welcome Center North (IWCN) serves Westerkwartier before you book there.","last_verified":"2026-10-19","links":[{"label":"Registering in Westerkwartier","url":"https://www.westerkwartier.nl/verhuizen-naar-nederland"}],"municipality_id":"westerkwartier","step_id":"book_registration"},{"body":"University of Groningen: September starters who get an invitation can collect their residence permit card at the central IND student day in Utrecht (August/September). For February starters, the IND comes to the university in March to hand out cards. Anyone who misses these, or whose card isn't ready, collects it at the IND desk in Zwolle by appointment.\nHanze University of Applied Sciences: Hanze says non-EU students collect their Dutch study residence permit at the IND collection at the Jaarbeurs (Beatrixgebouw) in Utrecht, a bit under 2 hours by train. Hanze Team Immigration emails instructions before or on arrival.","last_verified":"2026-10-19","links":[{"label":"University of Groningen international office","url":"https://www.rug.nl/education/application-enrolment-tuition-fees/contact/sia-contact-form"},{"label":"Hanze University of Applied Sciences international office","url":"https://www.hanze.nl/io"}],"municipality_id":"groningen","step_id":"collect_permit"},{"body":"Hanze University of Applied Sciences students: Hanze Team Housing. Hanze's housing team (housing@org.hanze.nl), which also points students to At Home in Groningen for their room search.\nAt Home in Groningen (SSH): Accommodation search site recommended by Hanze. It also posts SSH's housing registration dates, e.g. 'Important SSH Housing Dates for Fall Semester 2026'.","last_verified":"2026-10-19","links":[{"label":"Hanze Team Housing","url":"https://www.hanze.nl/housing"},{"label":"At Home in Groningen (SSH)","url":"https://www.athomeingroningen.com"}],"municipality_id":"groningen","step_id":"find_housing"},{"body":"ESN Groningen buddy programme: Buddy programme for international students, recommended by Hanze.\nRUG introduction events (exchange students): RUG page on introduction events. It was linked from the exchange section and its content was not reviewed.","last_verified":"2026-10-19","links":[{"label":"ESN Groningen buddy programme","url":"https://www.esn-groningen.nl"},{"label":"RUG introduction events (exchange students)","url":"https://www.rug.nl/education/exchange/study-in-groningen/introduction-events"}],"municipality_id":"groningen","step_id":"intro_week"},{"body":"ESN Groningen introduction week sign-up days (September 2026): ESN Groningen's page about sign-up days for its September 2026 introduction week for international students.","last_verified":"2026-10-19","links":[{"label":"ESN Groningen introduction week sign-up days (September 2026)","url":"https://www.esn-groningen.nl/esn-introduction-week-september-2026/sign-up-days-september-2026/"}],"municipality_id":"groningen","step_id":"join_community"},{"body":"Studentarts: Student GP practice listed in Hanze's 'Good to know' guide for international students.\nAcademische huisartsenpraktijk Gro
