ningen (UMCG): Listed by the University of Groningen on its healthcare page for (international) students.\nGezondheidscentrum Hoendiep: Listed by the University of Groningen on its healthcare page, which says students may choose any GP and links to the Zorgkaart Nederland directory of Groningen GPs.","last_verified":"2026-10-19","links":[{"label":"Studentarts","url":"https://www.studentarts.nl/en"},{"label":"Academische huisartsenpraktijk Groningen (UMCG)","url":"https://www.umcg.nl/academische-huisartsenpraktijk-groningen"},{"label":"Gezondheidscentrum Hoendiep","url":"https://www.artsenzorg.nl/vind-uw-praktijk/hoendiep-groningen"}],"municipality_id":"groningen","step_id":"register_gp"},{"body":"Your appointment is with the municipality of Groningen.\nBook an appointment online via the municipality's student registration page; no booking window or opening date is stated.","last_verified":"2026-10-19","links":[{"label":"Registering in Groningen","url":"https://gemeente.groningen.nl/en/student-registration-or-deregistration"},{"label":"International Welcome Center North (IWCN)","url":"https://iwcn.nl"}],"municipality_id":"groningen","step_id":"register_municipality"},{"body":"You live in Tynaarlo, so you register with the municipality of Tynaarlo, not Groningen.\nStudent registration days or online pre-registration run by Groningen may not apply to you. Check Tynaarlo's own page.\nCheck whether International Welcome Center North (IWCN) serves Tynaarlo before you book there.","last_verified":"2026-10-19","links":[{"label":"Registering in Tynaarlo","url":"https://www.tynaarlo.nl/burgerzaken/verhuizen/eerste-inschrijving-nederland"}],"municipality_id":"tynaarlo","step_id":"register_municipality"},{"body":"You live in Westerkwartier, so you register with the municipality of Westerkwartier, not Groningen.\nStudent registration days or online pre-registration run by Groningen may not apply to you. Check Westerkwartier's own page.\nCheck whether International Welcome Center North (IWCN) serves Westerkwartier before you book there.","last_verified":"2026-10-19","links":[{"label":"Registering in Westerkwartier","url":"https://www.westerkwartier.nl/verhuizen-naar-nederland"}],"municipality_id":"westerkwartier","step_id":"register_municipality"},{"body":"GGD Groningen runs the TB check for Groningen. University of Groningen online form for booking the GGD TB test (a chest X-ray), which is due within 3 months of arrival or of the permit being granted. Sessions are at the RUG Academy Building, Broerstraat 5. Otherwise you book directly with GGD Groningen at Hanzeplein 120, 9713 GW Groningen. The fee is EUR 58.50 by debit card; bring your passport and part 1 of the IND referral form.","last_verified":"2026-10-19","links":[{"label":"GGD Groningen","url":"https://fd2.formdesk.com/rug/GGDappointments"}],"municipality_id":"groningen","step_id":"tb_test"},{"body":"UG Student Well-being Portal: University of Groningen portal on mental, physical and financial health; the UG also offers short-term therapy with its own student psychologists.\nUG Student Service Centre: University of Groningen's central student service desk for practical and personal questions.\n113 Suicide Prevention (English): National crisis line, which UG's healthcare page tells students to use if there is a risk of self-harm or suicide (call 113).","last_verified":"2026-10-19","links":[{"label":"UG Student Well-being Portal","url":"https://www.rug.nl/education/student-service-centre/student-well-being/"},{"label":"UG Student Service Centre","url":"https://www.rug.nl/education/student-service-centre/?lang=en"},{"label":"113 Suicide Prevention (English)","url":"https://113.nl/english"}],"municipality_id":"groningen","step_id":"wellbeing_checkin"},{"body":"You live in Heerlen, so you register with the municipality of Heerlen, not Maastricht.\nStudent registration days or online pre-registration run by Maastricht may not apply to you. Check Heerlen's own page.\nCheck whether Expat Centre Maastricht Region (ECMR) / IND Service Point Maastricht, at the Maastricht International Centre (MIC) serves Heerlen before you book there.","last_verified":"2026-10-19","links":[{"label":"Registering in Heerlen","url":"https://heerlen.nl/english"}],"municipality_id":"heerlen","step_id":"book_registration"},{"body":"You live in Heerlen, so you register with the municipality of Heerlen, not Maastricht.\nStudent registration days or online pre-registration run by Maastricht may not apply to you. Check Heerlen's own page.\nCheck whether Expat Centre Maastricht Region (ECMR) / IND Service Point Maastricht, at the Maastricht International Centre (MIC) serves Heerlen before you book there.","last_verified":"2026-10-19","links":[{"label":"Registering in Heerlen","url":"https://heerlen.nl/english"}],"municipality_id":"heerlen","step_id":"register_municipality"},{"body":"Book an appointment online with the municipality of Leeuwarden and register at Oldehoofsterkerkhof 2. Bring your original valid passport or ID card, a copy of your signed rental agreement, and copies of the data page and of every passport page with stamps or stickers. Campus Fryslân advises booking as soon as possible: if you register in weeks 33 to 36 you may not get your BSN at the appointment and may wait two to four weeks.\nBook online as early as you can; late August and early September are the busiest weeks.","last_verified":"2026-11-12","links":[{"label":"Book a registration appointment in Leeuwarden","url":"https://leeuwarden.mijnafspraakmaken.nl/Client/#?product=35"}],"municipality_id":"leeuwarden","step_id":"book_registration"},{"body":"University of Groningen, Campus Fryslân students: the university offers housing to first-year Global Politics & Sustainability students; admitted students are told how to register.\nStudentStay: furnished studios, including on the Kanaalstraat, where many first-years live. Rooms usually become available in spring, so set up your account before then.\nMarkt 058: private rooms, studios and apartments.\nFor a September start, begin searching at least 4 to 5 months ahead. Many rooms are posted in late spring and summer and go quickly.","last_verified":"2026-11-12","links":[{"label":"Campus Fryslân: finding accommodation","url":"https://www.rug.nl/cf/education/studentinfo/findingaccomodation"},{"label":"Markt 058","url":"https://www.markt058.com/en/"},{"label":"Rooms in Leeuwarden","url":"https://www.kamers-leeuwarden.nl/"}],"municipality_id":"leeuwarden","step_id":"find_housing"},{"body":"Campus Fryslân Introduction Activities: the last week of August for all programmes, mixing social events with practical sessions about the university. Taking part is mandatory for Global Politics & Sustainability students.","last_verified":"2026-11-12","links":[{"label":"Campus Fryslân: information for new students","url":"https://www.rug.nl/cf/education/studentinfo/infofornewstudents?lang=en"}],"municipality_id":"leeuwarden","step_id":"intro_week"},{"body":"Register with a GP in Leeuwarden soon after you arrive, before you need one.\nBefore registering, ask whether the practice accepts new patients or students and whether it accepts your insurance.\nThe Campus Fryslân Student Service Desk can help if you are unsure how to register.","last_verified":"2026-11-12","links":[{"label":"Campus Fryslân: information for new students","url":"https://www.rug.nl/cf/education/studentinfo/infofornewstudents?lang=en"}],"municipality_id":"leeuwarden","step_id":"register_gp"},{"body":"Your appointment is with the municipality of Leeuwarden.\nBook online as early as you can; late August and early September are the busiest weeks.","last_verified":"2026-11-12","links":[{"label":"Book a registration appointment in Leeuwarden","url":"https://leeuwarden.mijnafspraakmaken.nl/Client/#?product=35"}],"municipality_id":"leeuwarden","step_id":"register_municipality"},{"body":"Newcomers first fill in the online 'Register your move' form, then get an email with a link to book an in-person appointment at the Stadskantoor (Bargelaan 190), which should be within 5 days of moving. Leiden University says the municipality runs special registration sessions for new students at the start of each semester. Students bring a passport, the residence permit or Leiden University approval email, and a rental contract (or landlord permission plus a copy of the landlord's ID). The university says a birth certificate is generally not needed for its students, although the municipality's page lists one.\nFor September 2026, student-session appointments start from the third week of August 2026. Students arriving at other times should phone the town hall (14 071, or +31 71 51 65 165 from abroad).","last_verified":"2026-10-19","links":[{"label":"Registering in Leiden","url":"https://gemeente.leiden.nl/inwoners-en-ondernemers/verhuizen-en-migreren/migreren/moving-to-leiden-from-abroad/"}],"municipality_id":"leiden","step_id":"book_registration"},{"body":"You live in Oegstgeest, so you register with the municipality of Oegstgeest, not Leiden.\nStudent registration days or online pre-registration run by Leiden may not apply to you. Check Oegstgeest's own page.","last_verified":"2026-10-19","links":[{"label":"Registering in Oegstgeest","url":"https://www.oegstgeest.nl/inwoners/welcome-to-oegstgeest/moving-to-the-netherlands-for-the-first-time"}],"municipality_id":"oegstgeest","step_id":"book_registration"},{"body":"You live in Voorschoten, so you register with the municipality of Voorschoten, not Leiden.\nStudent registration days or online pre-registration run by Leiden may not apply to you. Check Voorschoten's own page.","last_verified":"2026-10-19","links":[{"label":"Registering in Voorschoten","url":"https://www.voorschoten.nl/first-registration-in-the-netherlands"}],"municipality_id":"voorschoten","step_id":"book_registration"},{"body":"Leiden University: For a September 2026 start, the IND held centralised student collection sessions at Jaarbeurs Conference Centre in Utrecht (Sat 29 Aug and Sat 19 Sep 2026); appointment required, collect in person; Leiden University emails scheduling instructions around 15 August.","last_verified":"2026-10-19","links":[{"label":"Leiden University international office","url":"https://www.universiteitleiden.nl/en/education/international-students/prepare-your-stay/town-hall-registration"}],"municipality_id":"leiden","step_id":"collect_permit"},{"body":"Leiden University students: Leiden University Housing Office. University-arranged housing for international students. The alternative is finding housing yourself.\nDUWO: Student housing corporation offering rooms in the Leiden, Delft and The Hague region.","last_verified":"2026-10-19","links":[{"label":"Leiden University Housing Office","url":"https://www.universiteitleiden.nl/en/education/international-students/prepare-your-stay/housing/via-leiden-university-housing-office"},{"label":"DUWO","url":"https://duwo.nl/en"}],"municipality_id":"leiden","step_id":"find_housing"},{"body":"OWL - Orientation Week Leiden: Orientation week in English for new international Leiden University students studying mainly in Leiden; late August (24-28 Aug 2026).\nHOP Week - The Hague Orientation Programme: Orientation in English for new Leiden University students studying mainly at the Campus The Hague; mid August (17-21 Aug 2026).\nEL CID: Dutch-language introduction week for new students studying mainly in Leiden; early-mid August (10-14 Aug 2026).","last_verified":"2026-10-19","links":[{"label":"OWL - Orientation Week Leiden","url":"https://orientationweek.org/summer-owl/"},{"label":"HOP Week - The Hague Orientation Programme","url":"https://www.hopweek.org/"},{"label":"EL CID","url":"https://elcidweek.nl/"}],"municipality_id":"leiden","step_id":"intro_week"},{"body":"The Student Doctors (Leiden branch): Listed by Leiden University for international students as experienced with (international) students and accepting new patients.\nHuisartsenpraktijk Boshuizen: Listed by Leiden University for international students (link is the practice's registration form); contact the practice directly to register.\nLeiden University: GP and healthcare insurances: University page explaining GP registration and health insurance for students.","last_verified":"2026-10-19","links":[{"label":"The Student Doctors (Leiden branch)","url":"https://thestudentdoctors.nl/"},{"label":"Huisartsenpraktijk Boshuizen","url":"https://www.praktijkboshuizen.nl/registration-form/"},{"label":"Leiden University: GP and healthcare insurances","url":"https://www.student.universiteitleiden.nl/en/support/health-and-well-being/where-to-turn/gp-and-healthcare-insurances"}],"municipality_id":"leiden","step_id":"register_gp"},{"body":"Your appointment is with the municipality of Leiden.\nFor September 2026, student-session appointments start from the third week of August 2026. Students arriving at other times should phone the town hall (14 071, or +31 71 51 65 165 from abroad).","last_verified":"2026-10-19","links":[{"label":"Registering in Leiden","url":"https://gemeente.leiden.nl/inwoners-en-ondernemers/verhuizen-en-migreren/migreren/moving-to-leiden-from-abroad/"}],"municipality_id":"leiden","step_id":"register_municipality"},{"body":"You live in Oegstgeest, so you register with the municipality of Oegstgeest, not Leiden.\nStudent registration days or online pre-registration run by Leiden may not apply to you. Check Oegstgeest's own page.","last_verified":"2026-10-19","links":[{"label":"Registering in Oegstgeest","url":"https://www.oegstgeest.nl/inwoners/welcome-to-oegstgeest/moving-to-the-netherlands-for-the-first-time"}],"municipality_id":"oegstgeest","step_id":"register_municipality"},{"body":"You live in Voorschoten, so you register with the municipality of Voorschoten, not Leiden.\nStudent registration days or online pre-registration run by Leiden may not apply to you. Check Voorschoten's own page.","last_verified":"2026-10-19","links":[{"label":"Registering in Voorschoten","url":"https://www.voorschoten.nl/first-registration-in-the-netherlands"}],"municipality_id":"voorschoten","step_id":"register_municipality"},{"body":"Leiden University student psychologists: Free university psychologists for Leiden students with study-related or personal issues.\nLeiden University student support services: Overview of the university's support services (counsellors, psychologists, deans) for (international) students.","last_verified":"2026-10-19","links":[{"label":"Leiden University student psychologists","url":"https://www.organisatiegids.universiteitleiden.nl/en/service-units/student-and-educational-affairs-sea/student-support-services/psychologists/student-psychologist"},{"label":"Leiden University student support services","url":"https://www.universiteitleiden.nl/en/education/exchange/student-life/student-support-services"}],"municipality_id":"leiden","step_id":"wellbeing_checkin"},{"body":"Official route for students from abroad staying 4+ months: fill in the online form (https://mijn-gemeenteloket.gemeentemaastricht.nl/pes/first-registration, Google Translate off), get an email within ~1-5 weeks with instructions, then book a GemeenteLoket appointment within 2 months; bring passport and (legalised) birth certificate; non-EU students need their IND permit first.\nBooking details for regular student registration could not be confirmed; the Expat Centre combined appointment is requested via expatcentre@maastricht.nl.\nExpat Centre Maastricht Region (ECMR) / IND Service Point Maastricht, at the Maastricht International Centre (MIC): IND service point for Limburg residents (biometrics, residence endorsement sticker, return visa, collecting residence documents when your letter says Maastricht) plus combined BRP registration and BSN appointments for southern Limburg residents.","last_verified":"2026-10-19","links":[{"label":"Registering in Maastricht","url":"https://www.gemeentemaastricht.nl/en/moving-and-housing/international-student-registration"},{"label":"Expat Centre Maastricht Region (ECMR) / IND Service Point Maastricht, at the Maastricht International Centre (MIC)","url":"https://ind.nl/en/expat-centre-maastricht-region-ecmr-ind-service-point-maastricht"}],"municipality_id":"maastricht","step_id":"book_registration"},{"body":"Maastricht University: Per UM Visa Office arrival guide: biometrics are taken at the IND counter at the Municipality of Maastricht, and the cards are issued at a central location in the Netherlands (an IND Student Day; UM emails the dates). Students who get an IND letter naming Maastricht can collect at the IND Service Point in the Maastricht International Centre (MIC) by appointment.\nZuyd University of Applied Sciences: Zuyd's factsheet says residence permit pickup for non-EU students is compulsory and handled through the Zuyd International Office (immigration@zuyd.nl); IND services for Limburg residents (incl. collection when the letter says Maastricht) are at the IND Service Point in the MIC.","last_verified":"2026-10-19","links":[{"label":"Maastricht University international office","url":"https://www.maastrichtuniversity.nl/studeren/support/support-international-students/international-student-helpdesk-ish"},{"label":"Zuyd University of Applied Sciences international office","url":"http://international.zuyd.nl/"}],"municipality_id":"maastricht","step_id":"collect_permit"},{"body":"Maastricht University students: UM Guesthouse. Maastricht University's own guesthouse accommodation, listed under its Housing in Maastricht section.\nHousing in Maastricht (Maastricht University): UM's housing guidance hub for incoming students.","last_verified":"2026-10-19","links":[{"label":"UM Guesthouse","url":"https://www.maastrichtuniversity.nl/study/student-life/um-guesthouse"},{"label":"Housing in Maastricht (Maastricht University)","url":"https://www.maastrichtuniversity.nl/study/student-life/housing-maastricht"}],"municipality_id":"maastricht","step_id":"find_housing"},{"body":"INKOM (Maastricht introduction): Maastricht's introduction days for new students; the page found is the 2024 edition.","last_verified":"2026-10-19","links":[{"label":"INKOM (Maastricht introduction)","url":"https://www.maastrichtuniversity.nl/news/inkom-2024"}],"municipality_id":"maastricht","step_id":"intro_week"},{"body":"Student Friendly GP practices (HAP Maastricht list): Label developed by Huisartsen Spoedpost Maastricht and Maastricht University (UM flyer, Aug 2026); the HAP page marks participating practices and links to registration - a finder, not a single practice.\nHAP Maastricht affiliated practices: Map of all GP practices affiliated with the Maastricht out-of-hours GP post, linked from the students-and-expats page.\nHAP Maastricht (out-of-hours GP post): English info for students/expats on Dutch healthcare and urgent GP care outside office hours; UM tells students not to go to the hospital without an appointment.","last_verified":"2026-10-19","links":[{"label":"GGD Zuid Limburg","url":"https://www.ggdzl.nl/contact/infectieziektebestrijding-en-tuberculose/"},{"label":"HAP Maastricht (out-of-hours GP post)","url":"https://hapmaastricht.nl/en/students-and-expats"}],"municipality_id":"maastricht","step_id":"register_gp"},{"body":"Your appointment is with the municipality of Maastricht.\nBooking details for regular student registration could not be confirmed; the Expat Centre combined appointment is requested via expatcentre@maastricht.nl.","last_verified":"2026-10-19","links":[{"label":"Registering in Maastricht","url":"https://www.gemeentemaastricht.nl/en/moving-and-housing/international-student-registration"},{"label":"Expat Centre Maastricht Region (ECMR) / IND Service Point Maastricht, at the Maastricht International Centre (MIC)","url":"https://ind.nl/en/expat-centre-maastricht-region-ecmr-ind-service-point-maastricht"}],"municipality_id":"maastricht","step_id":"register_municipality"},{"body":"GGD Zuid Limburg runs the TB check for Maastricht. Contact page of the TB team (tbc@ggdzl.nl, 088 880 50 78 option 6); no dedicated newcomer TB-screening page found on ggdzl.nl.","last_verified":"2026-10-19","links":[{"label":"GGD Zuid Limburg","url":"https://www.ggdzl.nl/contact/infectieziektebestrijding-en-tuberculose/"}],"municipality_id":"maastricht","step_id":"tb_test"},{"body":"UM Psychological support: Maastricht University's student psychologist service.\nUM Student wellbeing: UM wellbeing hub (Wellbeing Movement, MoodLift workshops).","last_verified":"2026-10-19","links":[{"label":"UM Psychological support","url":"https://www.maastrichtuniversity.nl/studeren/support/psychological-support"},{"label":"UM Student wellbeing","url":"https://www.maastrichtuniversity.nl/studeren/support/student-wellbeing"}],"municipality_id":"maastricht","step_id":"wellbeing_checkin"},{"body":"You live in Capelle aan den IJssel, so you register with the municipality of Capelle aan den IJssel, not Rotterdam.\nStudent registration days or online pre-registration run by Rotterdam may not apply to you. Check Capelle aan den IJssel's own page.\nCheck whether Rotterdam International Center serves Capelle aan den IJssel before you book there.","last_verified":"2026-10-19","links":[{"label":"Registering in Capelle aan den IJssel","url":"https://www.eur.nl/media/2025-02-first-registration-capelle-aan-den-ijssel"}],"municipality_id":"capelle-aan-den-ijssel","step_id":"book_registration"},{"body":"Students start their first registration online on the Rotterdam municipality website, up to 4 weeks before arrival, and upload their ID and proof of address. They then get a case number and a link to book an in-person 'Studentenafspraak gemeente' (student appointment) at City Hall, Coolsingel 40, where the BSN is issued straight away. Addresses in postcode areas that need a housing permit (HVV) must register in person at the municipal office. EUR also mentions registration at campus One Stop Shops at the start of each semester.\nAfter submitting the online form you receive a case number and booking link; choose the appointment type 'Studentenafspraak gemeente', because other types follow the regular procedure without an immediate BSN.\nRotterdam International Center: Rotterdam's service point for internationals; its services for students were not confirmed (see unverified).","last_verified":"2026-10-19","links":[{"label":"Registering in Rotterdam","url":"https://www.rotterdam.nl/en/first-registration-in-the-netherlands/start-registration-in-the-netherlands-by-a-student"},{"label":"Rotterdam International Center","url":"https://rotterdam.info/en/internationals/frequently-asked-questions"}],"municipality_id":"rotterdam","step_id":"book_registration"},{"body":"You live in Schiedam, so you register with the municipality of Schiedam, not Rotterdam.\nStudent registration days or online pre-registration run by Rotterdam may not apply to you. Check Schiedam's own page.\nCheck whether Rotterdam International Center serves Schiedam before you book there.","last_verified":"2026-10-19","links":[{"label":"Registering in Schiedam","url":"https://www.eur.nl/media/2025-02-first-registration-schiedam"}],"municipality_id":"schiedam","step_id":"book_registration"},{"body":"Rotterdam University of Applied Sciences (Hogeschool Rotterdam): The Centre of International Affairs applies for the MVV/residence permit for you; non-EU students collect the permit from the IND in The Hague after arrival, and the university emails you when it is ready.","last_verified":"2026-10-19","links":[{"label":"Rotterdam University of Applied Sciences (Hogeschool Rotterdam) international office","url":"https://www.rotterdamuas.com/study-information/practical-information/international-introduction-days/"}],"municipality_id":"rotterdam","step_id":"collect_permit"},{"body":"Erasmus University Rotterdam students: EUR Reserved Accommodation. First-year international students aged 30 or under who live abroad can book reserved rooms through SSH, Xior, RoomPlaza, ISHR, The Social Hub or Student Housing Willemskade, with booking opening in May (contact: studenthousing@eur.nl).\nRotterdam University of Applied Sciences (Hogeschool Rotterdam) students: Rotterdam UAS Student Housing. Rotterdam UAS student housing information page (its contents were not checked).\nSSH (via EUR reserved accommodation): Student housing provider offering reserved rooms for new EUR international students (EUR's page about SSH).\nXior (via EUR reserved accommodation): Student housing provider with reserved rooms for full-year EUR international students (EUR's page about Xior).\nThe Social Hub (via EUR reserved accommodation): Private student stay with reserved rooms for EUR students, including Fall-semester exchange students.","last_verified":"2026-10-19","links":[{"label":"EUR Reserved Accommodation","url":"https://www.eur.nl/en/education/study-rotterdam/living-here/housing-international-students/reserved-accommodation"},{"label":"Rotterdam UAS Student Housing","url":"https://www.rotterdamuas.com/study-information/practical-information/Student-Housing/"},{"label":"SSH (via EUR reserved accommodation)","url":"https://www.eur.nl/en/education/practical-matters/orientation-arrival/housing/reserved-accommodation/ssh"},{"label":"Xior (via EUR reserved accommodation)","url":"https://www.eur.nl/en/education/practical-matters/orientation-arrival/housing/reserved-accommodation/xior"},{"label":"The Social Hub (via EUR reserved accommodation)","url":"https://www.eur.nl/en/education/practical-matters/orientation-arrival/housing/reserved-accommodation/social-hub"}],"municipality_id":"rotterdam","step_id":"find_housing"},{"body":"Rotterdam UAS International Introduction Days: HR's arrival programme for new international students, covering registration, the residence permit, bank account and pick-up service.","last_verified":"2026-10-19","links":[{"label":"Rotterdam UAS International Introduction Days","url":"https://www.rotterdamuas.com/study-information/practical-information/international-introduction-days/"}],"municipality_id":"rotterdam","step_id":"intro_week"},{"body":"Huisarts31: Hybrid, online-first practice listed by Erasmus University Rotterdam for students; registration required; accepts Insure to Study, AON, EHIC and Dutch basic insurance.\nHuisDoc: Listed by EUR as a practice for international students, expats and tourists; by appointment, accepts AON and Insure to Study.\nJans Huisartsen: Listed by EUR; three Rotterdam locations, registration required, accepts EHIC and Dutch basic insurance.\nEUR: GPs and healthcare for students: EUR page listing student-friendly GPs, the International Health Centre Rotterdam and GGD Rotterdam-Rijnmond.\nZorgkaartNederland - GPs in Rotterdam: Directory linked by EUR to find other GPs in Rotterdam.","last_verified":"2026-10-19","links":[{"label":"GGD Rotterdam-Rijnmond","url":"https://www.tbczuidholland.nl/en/locations/ggd-rotterdam-rijnmond/make-an-appointment/"},{"label":"EUR: GPs and healthcare for students","url":"https://www.eur.nl/en/node/36282"},{"label":"ZorgkaartNederland - GPs in Rotterdam","url":"https://www.zorgkaartnederland.nl/huisarts/rotterdam"}],"municipality_id":"rotterdam","step_id":"register_gp"},{"body":"You live in Capelle aan den IJssel, so you register with the municipality of Capelle aan den IJssel, not Rotterdam.\nStudent registration days or online pre-registration run by Rotterdam may not apply to you. Check Capelle aan den IJssel's own page.\nCheck whether Rotterdam International Center serves Capelle aan den IJssel before you book there.","last_verified":"2026-10-19","links":[{"label":"Registering in Capelle aan den IJssel","url":"https://www.eur.nl/media/2025-02-first-registration-capelle-aan-den-ijssel"}],"municipality_id":"capelle-aan-den-ijssel","step_id":"register_municipality"},{"body":"Your appointment is with the municipality of Rotterdam.\nAfter submitting the online form you receive a case number and booking link; choose the appointment type 'Studentenafspraak gemeente', because other types follow the regular procedure without an immediate BSN.","last_verified":"2026-10-19","links":[{"label":"Registering in Rotterdam","url":"https://www.rotterdam.nl/en/first-registration-in-the-netherlands/start-registration-in-the-netherlands-by-a-student"},{"label":"Rotterdam International Center","url":"https://rotterdam.info/en/internationals/frequently-asked-questions"}],"municipality_id":"rotterdam","step_id":"register_municipality"},{"body":"You live in Schiedam, so you register with the municipality of Schiedam, not Rotterdam.\nStudent registration days or online pre-registration run by Rotterdam may not apply to you. Check Schiedam's own page.\nCheck whether Rotterdam International Center serves Schiedam before you book there.","last_verified":"2026-10-19","links":[{"label":"Registering in Schiedam","url":"https://www.eur.nl/media/2025-02-first-registration-schiedam"}],"municipality_id":"schiedam","step_id":"register_municipality"},{"body":"GGD Rotterdam-Rijnmond runs the TB check for Rotterdam. EUR sends non-EU students here to book the TB test (GGD Rotterdam, Schiedamsedijk 95), to be done within three months of collecting the residence permit.","last_verified":"2026-10-19","links":[{"label":"GGD Rotterdam-Rijnmond","url":"https://www.tbczuidholland.nl/en/locations/ggd-rotterdam-rijnmond/make-an-appointment/"}],"municipality_id":"rotterdam","step_id":"tb_test"},{"body":"EUR student psychologists: Erasmus University psychologists supporting students with study-related issues.","last_verified":"2026-10-19","links":[{"label":"EUR student psychologists","url":"https://www.eur.nl/en/education/practical-matters/advice-counselling/student-psychologists"}],"municipality_id":"rotterdam","step_id":"wellbeing_checkin"},{"body":"You live in Leidschendam-Voorburg, so you register with the municipality of Leidschendam-Voorburg, not The Hague.\nStudent registration days or online pre-registration run by The Hague may not apply to you. Check Leidschendam-Voorburg's own page.\nThe Hague International Centre also serves Leidschendam-Voorburg, so you can still use it.","last_verified":"2026-10-19","links":[{"label":"Registering in Leidschendam-Voorburg","url":"https://www.lv.nl/verhuizen-vanuit-het-buitenland"}],"municipality_id":"leidschendam-voorburg","step_id":"book_registration"},{"body":"The Hague International Centre runs special registration days for new international students each semester. Bookings for the second half of 2026 opened on 6 July 2026.\nTHUAS students get booking instructions by email over the summer for a fast, simplified registration. Book straight away: slots fill quickly.\nThe Hague International Centre: Runs the student registration days, with a fast, simplified route for THUAS students.","last_verified":"2026-10-19","links":[{"label":"Registering in The Hague","url":"https://www.thehagueinternationalcentre.nl/relocating/registration-procedure/sponsored/registration-for-students"}],"municipality_id":"the-hague","step_id":"book_registration"},{"body":"The Hague University of Applied Sciences (THUAS): Non-EU students collect their permit at a central IND collection day at the Jaarbeurs in Utrecht; it cannot be collected in The Hague. THUAS invites you to book once the IND has approved it.","last_verified":"2026-10-19","links":[{"label":"The Hague University of Applied Sciences (THUAS) international office","url":"https://www.thuas.com/study-choice/international-office"}],"municipality_id":"the-hague","step_id":"collect_permit"},{"body":"The Hague University of Applied Sciences (THUAS) students: THUAS Housing Service. Rooms through trusted partners for first-years without an address. Helps about half of incoming students; furnished apartments from about €950 a month.\nDUWO: Largest student housing association in The Hague. Rooms fill quickly.\nHospi Housing: Rooms with verified hosts, part of the municipal student housing action plan.\nROOM.nl: Regional system that ranks by registration time, so many first-years do not qualify yet.","last_verified":"2026-10-19","links":[{"label":"THUAS Housing Service","url":"https://www.thuas.com/study-choice/international-office/housing"},{"label":"DUWO","url":"https://www.duwo.nl"},{"label":"ROOM.nl","url":"https://www.room.nl"}],"municipality_id":"the-hague","step_id":"find_housing"},{"body":"HI The Hague intro week: Introduction week for new students in The Hague.","last_verified":"2026-10-19","links":[{"label":"HI The Hague intro week","url":"https://www.studyinthehague.com/nl"}],"municipality_id":"the-hague","step_id":"intro_week"},{"body":"More than 75% of GP practices in The Hague were not taking new patients (Klein et al., 2026), so register early.\nThe Student Doctors: Student GP at Nieuwe Uitleg 29; register online.\nPraktijk Shams: Two practices near Hollands Spoor; many international student patients.\nBiking Doctors and Huisartspraktijk M. Lachman: Listed by Leiden University as accepting students.","last_verified":"2026-10-19","links":[{"label":"The Student Doctors","url":"https://thestudentdoctors.nl/"},{"label":"Praktijk Shams","url":"https://shams.praktijkinfo.nl/english-information/"}],"municipality_id":"the-hague","step_id":"register_gp"},{"body":"You live in Leidschendam-Voorburg, so you register with the municipality of Leidschendam-Voorburg, not The Hague.\nStudent registration days or online pre-registration run by The Hague may not apply to you. Check Leidschendam-Voorburg's own page.\nThe Hague International Centre also serves Leidschendam-Voorburg, so you can still use it.","last_verified":"2026-10-19","links":[{"label":"Registering in Leidschendam-Voorburg","url":"https://www.lv.nl/verhuizen-vanuit-het-buitenland"}],"municipality_id":"leidschendam-voorburg","step_id":"register_municipality"},{"body":"Your appointment is with the municipality of The Hague.\nTHUAS students get booking instructions by email over the summer for a fast, simplified registration. Book straight away: slots fill quickly.","last_verified":"2026-10-19","links":[{"label":"Registering in The Hague","url":"https://www.thehagueinternationalcentre.nl/relocating/registration-procedure/sponsored/registration-for-students"}],"municipality_id":"the-hague","step_id":"register_municipality"},{"body":"Students living in Tilburg register by appointment only, at the Newcomers' Desk in the Stadswinkel Centrum (Spoorlaan 181, 5038 CB Tilburg). Tilburg University says you receive your BSN immediately at the appointment. Bring your passport, a printed copy of your rental contract and, if you need one, your Dutch residence permit or IND approval letter. Fontys also asks for an original birth certificate and its declaration of acceptance. You need permanent accommodation: hostels, hotels and Airbnb-type stays do not count.\nBook through the municipality's student appointment form before you arrive. A confirmed appointment cannot be changed. Fontys students: ask your study department whether it books the appointment for you.","last_verified":"2026-11-12","links":[{"label":"Book a student appointment in Tilburg","url":"https://winkel.tilburg.nl/formulieren/server/start/AfspraakMakenStudent"}],"municipality_id":"tilburg","step_id":"book_registration"},{"body":"Your appointment is with the municipality of Tilburg.\nBook through the municipality's student appointment form before you arrive. A confirmed appointment cannot be changed. Fontys students: ask your study department whether it books the appointment for you.","last_verified":"2026-11-12","links":[{"label":"Book a student appointment in Tilburg","url":"https://winkel.tilburg.nl/formulieren/server/start/AfspraakMakenStudent"}],"municipality_id":"tilburg","step_id":"register_municipality"},{"body":"You live in Nieuwegein, so you register with the municipality of Nieuwegein, not Utrecht.\nStudent registration days or online pre-registration run by Utrecht may not apply to you. Check Nieuwegein's own page.\nCheck whether Utrecht International Center serves Nieuwegein before you book there.","last_verified":"2026-10-19","links":[{"label":"Registering in Nieuwegein","url":"https://www.nieuwegein.nl/hulp-en-ondersteuning/utrecht-international-center"}],"municipality_id":"nieuwegein","step_id":"book_registration"},{"body":"International students staying more than 4 months must book an appointment to register within 5 days of arriving in the Netherlands. Registration takes place at the Utrecht International Center, and you book through its 'register as a new student' page. Bring your passport or ID, a rental contract (or the proprietor's signed address form) and, if applicable, your residence permit, MVV or proof of application; registration gives you your BSN.\nBook an appointment via the Utrecht International Center's 'register as a new student' page within 5 days of arrival.\nUtrecht International Center: Handles municipal (BRP) registration appointments for international students and other newcomers in Utrecht, so they get their BSN.","last_verified":"2026-10-19","links":[{"label":"Registering in Utrecht","url":"https://www.utrecht.nl/city-of-utrecht/registration/registration-international-students"},{"label":"Utrecht International Center","url":"https://www.utrechtinternationalcenter.com/uic/formalities/registration/register-as-a-new-student"}],"municipality_id":"utrecht","step_id":"book_registration"},{"body":"You live in Zeist, so you register with the municipality of Zeist, not Utrecht.\nStudent registration days or online pre-registration run by Utrecht may not apply to you. Check Zeist's own page.\nCheck whether Utrecht International Center serves Zeist before you book there.","last_verified":"2026-10-19","links":[{"label":"Registering in Zeist","url":"https://www.zeist.nl/fileadmin/bestanden/Open_gemeenten_nieuwe_bestandenboom/Verhuizen_en__ver_bouwen/Verhuizen/Aangifte-van-verhuizing.pdf"}],"municipality_id":"zeist","step_id":"book_registration"},{"body":"Utrecht University: UU says you don't need to contact UU or the IND, because UU tells you when and where you can pick up the residence permit. VVR-only students first give biometrics by appointment at the IND desk in the Utrecht International Center, after an email from the UU Visa Office. The pickup location itself is not stated.\nHU University of Applied Sciences Utrecht: HU's International Office plans a residence-permit pick-up day at Utrecht Science Park, likely in early October, and emails students the date; permits not ready by then are collected at the IND office in Zwolle.","last_verified":"2026-10-19","links":[{"label":"Utrecht University international office","url":"https://www.uu.nl/en/education/welcome-to-utrecht/upon-arrival/city-registration"},{"label":"HU University of Applied Sciences Utrecht international office","url":"https://international.hu.nl/-/media/hu/documenten/study-at-hu/welcome-magazine-for-international-students.pdf"}],"municipality_id":"utrecht","step_id":"collect_permit"},{"body":"Utrecht University students: UU Reserved Accommodation Programme. UU's programme of reserved rooms for incoming international degree students (this page covers Bachelor's students for September 2026).\nHU University of Applied Sciences Utrecht students: HU Housing (SSH Short Stay and Xior). SSH Short Stay and Xior offer temporary furnished rooms to HU international students who need a Dutch residence permit or applied through an HU agent; HU advises applying before 1 June.\nSSH Short Stay / Xior (via HU): Main providers of temporary furnished rooms for incoming international students in Utrecht, as described on HU's housing page.","last_verified":"2026-10-19","links":[{"label":"UU Reserved Accommodation Programme","url":"https://www.uu.nl/en/education/welcome-to-utrecht/prepare-your-stay/arrange-housing/ways-to-find-housing/uu-reserved-accommodation-progamme/reserved-accommodation-for-bachelors-sep-26"},{"label":"HU Housing (SSH Short Stay and Xior)","url":"https://www.internationalhu.com/housing"}],"municipality_id":"utrecht","step_id":"find_housing"},{"body":"UIT - Utrechtse Introductietijd: Utrecht's five-day city introduction week for new students in August; HU also holds its own international introduction days in September.","last_verified":"2026-10-19","links":[{"label":"UIT - Utrechtse Introductietijd","url":"https://en.utrechtseintroductietijd.nl/"}],"municipality_id":"utrecht","step_id":"intro_week"},{"body":"UU Buddy Programmes: Utrecht University's overview of buddy programmes for international students.","last_verified":"2026-10-19","links":[{"label":"UU Buddy Programmes","url":"https://students.uu.nl/en/homepage/practical-information/international-students/buddy-programmes"}],"municipality_id":"utrecht","step_id":"join_community"},{"body":"Huisartsenpraktijk De Uithof: GP practice listed in HU's welcome magazine for international students; HU suggests checking whether you can register at the GP on the HU campus.\nHuisartsen Utrecht Stad - health care for internationals: Utrecht city GP information for internationals, listed in HU's welcome magazine.","last_verified":"2026-10-19","links":[{"label":"Huisartsenpraktijk De Uithof","url":"https://www.huisartsdeuithof.nl/en/the_practice/"},{"label":"Huisartsen Utrecht Stad - health care for internationals","url":"https://huisartsenutrechtstad.nl/health-care-for-internationals/"}],"municipality_id":"utrecht","step_id":"register_gp"},{"body":"You live in Nieuwegein, so you register with the municipality of Nieuwegein, not Utrecht.\nStudent registration days or online pre-registration run by Utrecht may not apply to you. Check Nieuwegein's own page.\nCheck whether Utrecht International Center serves Nieuwegein before you book there.","last_verified":"2026-10-19","links":[{"label":"Registering in Nieuwegein","url":"https://www.nieuwegein.nl/hulp-en-ondersteuning/utrecht-international-center"}],"municipality_id":"nieuwegein","step_id":"register_municipality"},{"body":"Your appointment is with the municipality of Utrecht.\nBook an appointment via the Utrecht International Center's 'register as a new student' page within 5 days of arrival.","last_verified":"2026-10-19","links":[{"label":"Registering in Utrecht","url":"https://www.utrecht.nl/city-of-utrecht/registration/registration-international-students"},{"label":"Utrecht International Center","url":"https://www.utrechtinternationalcenter.com/uic/formalities/registration/register-as-a-new-student"}],"municipality_id":"utrecht","step_id":"register_municipality"},{"body":"You live in Zeist, so you register with the municipality of Zeist, not Utrecht.\nStudent registration days or online pre-registration run by Utrecht may not apply to you. Check Zeist's own page.\nCheck whether Utrecht International Center serves Zeist before you book there.","last_verified":"2026-10-19","links":[{"label":"Registering in Zeist","url":"https://www.zeist.nl/fileadmin/bestanden/Open_gemeenten_nieuwe_bestandenboom/Verhuizen_en__ver_bouwen/Verhuizen/Aangifte-van-verhuizing.pdf"}],"municipality_id":"zeist","step_id":"register_municipality"},{"body":"GGD regio Utrecht (GGDrU) runs the TB check for Utrecht. GGDrU's Dutch page 'Doorverwezen IND tuberculose-onderzoek', for people the IND has referred for a TB test. There is also a page for making or changing an appointment (https://ggdru.nl/thema/mijn-gezondheid/tuberculose-tbc/meer-informatie-tbc-of-maken-wijzigen-afspraak/) and one on costs (https://ggdru.nl/thema/mijn-gezondheid/tuberculose-tbc/kosten-tbc-onderzoek-en-vaccinatie/).","last_verified":"2026-10-19","links":[{"label":"GGD regio Utrecht (GGDrU)","url":"https://ggdru.nl/thema/mijn-gezondheid/tuberculose-tbc/doorverwezen-ind-tuberculose-onderzoek/"}],"municipality_id":"utrecht","step_id":"tb_test"},{"body":"UU Student counselling: Utrecht University's student counselling service, which UU calls an important starting point for students' mental wellbeing.\nUU Mental wellbeing abroad: UU page with tips for international students on looking after their mental wellbeing in a new country.\nUU Wellbeing Week: Twice-yearly UU week of activities on mental, physical, financial and other kinds of wellbeing.","last_verified":"2026-10-19","links":[{"label":"UU Student counselling","url":"https://www.uu.nl/en/bachelors/general-information/international-students/why-utrecht/utrecht-university/student-counselling"},{"label":"UU Mental wellbeing abroad","url":"https://www.uu.nl/en/education/welcome-to-utrecht/mental-well-being-abroad"},{"label":"UU Wellbeing Week","url":"https://students.uu.nl/en/student-life/study-wellbeing-and-development/wellbeing-week"}],"municipality_id":"utrecht","step_id":"wellbeing_checkin"},{"body":"Register by appointment at the Stadskantoor (Hanzeplaats 1, 5912 AT Venlo) within five weekdays of arrival if you stay longer than four months. Maastricht University reserves appointments for its Campus Venlo students during Introduction Week and emails the details in June; the Fontys Student Service Centre books the appointment for Fontys students. The BSN can take up to five weeks, so register early. Bring your passport or ID, an original birth certificate plus a copy (legalised or with an apostille where required, with a certified translation if it is not in English, Dutch, French or German), proof of enrolment, a signed rental agreement and, for non-EU students, your residence permit or the visa decision email. Fontys says proof of civil status is always required in Venlo.\nYour university normally books for you. To book earlier yourself, use the municipality's page for people moving to Venlo from abroad. The municipality's website is in Dutch.","last_verified":"2026-11-12","links":[{"label":"Moving to Venlo from abroad","url":"https://www.venlo.nl/verhuizen-vanuit-buitenland-naar-venlo"}],"municipality_id":"venlo","step_id":"book_registration"},{"body":"Maastricht University, Campus Venlo students: 28 furnished studios at the inner-city campus for University College Venlo, Sustainable Bioscience and the pre-master Health Food Innovation Management. Email maxvenlo@brightlands.com once you are conditionally approved.\nOther housing organisations Maastricht University lists for Venlo: Lebe City Campus, Stichting Veste, Student Housing Venlo, Hospi Housing, Paul Schreinemachers and Brix Housing.","last_verified":"2026-11-12","links":[{"label":"Campus Venlo: getting started","url":"https://www.maastrichtuniversity.nl/research/institutes/campus-venlo/getting-started"},{"label":"Lebe City Campus","url":"http://www.lebecitycampus.nl/en/"},{"label":"Student Housing Venlo","url":"https://studenthousingvenlo.nl/"},{"label":"Hospi Housing","url":"https://hospihousing.com/gb/"},{"label":"Brix Housing","url":"https://www.brixhousing.nl/en"}],"municipality_id":"venlo","step_id":"find_housing"},{"body":"Your appointment is with the municipality of Venlo.\nYour university normally books for you. To book earlier yourself, use the municipality's page for people moving to Venlo from abroad. The municipality's website is in Dutch.","last_verified":"2026-11-12","links":[{"label":"Moving to Venlo from abroad","url":"https://www.venlo.nl/verhuizen-vanuit-buitenland-naar-venlo"}],"municipality_id":"venlo","step_id":"register_municipality"},{"body":"You register with the municipality of Zoetermeer itself, not through The Hague International Centre, which does not serve Zoetermeer.\nBook an appointment online or call 14 079. The counter is at Engelandlaan 502, 2711 EB Zoetermeer.\nRegister in person no later than the fifth day after you move in. Registration is free.\nBring your passport or EU identity card. Other nationalities: your passport with the MVV sticker, or your residence permit. The municipality may also ask for your rental contract, and for a birth certificate (legalised, and translated if it is not in Dutch, English, German or French).\nMoving in with someone who is already registered at the address? Bring their signed consent and a copy of their ID.\nZoetermeer has no special student registration days.","last_verified":"2026-11-12","links":[{"label":"Book a first registration in Zoetermeer","url":"https://en.zoetermeer.nl/form/afspraak-eerste-inschrijving-of-hervestiging-of-herinschrijving-vanuit-buitenland/eerste-inschrijving-0"},{"label":"Zoetermeer: registering from abroad","url":"https://en.zoetermeer.nl/hervestigingherinschrijving-vanuit-het-buitenland"}],"municipality_id":"zoetermeer","step_id":"book_registration"},{"body":"THUAS: Non-EU students collect their permit at a central IND collection day at the Jaarbeurs in Utrecht. THUAS invites you to book once the IND has approved it.","last_verified":"2026-11-12","links":[{"label":"THUAS International Office","url":"https://www.thuas.com/study-choice/international-office"}],"municipality_id":"zoetermeer","step_id":"collect_permit"},{"body":"THUAS students: THUAS Housing Service. Rooms through trusted partners for first-years without an address.\nWe have not found student housing providers specific to Zoetermeer. If you end up living in The Hague or Delft, choose that city under \"Where will you live?\" so registration and GP details follow your home.","last_verified":"2026-11-12","links":[{"label":"THUAS Housing Service","url":"https://www.thuas.com/study-choice/international-office/housing"}],"municipality_id":"zoetermeer","step_id":"find_housing"},{"body":"GPs register patients who live nearby, so look for a practice close to your address in Zoetermeer.\nWe have not checked which Zoetermeer practices take new patients. Use the directory below and call before you fill in a form.","last_verified":"2026-11-12","links":[{"label":"ZorgkaartNederland: GPs in Zoetermeer","url":"https://www.zorgkaartnederland.nl/huisarts/zoetermeer"}],"municipality_id":"zoetermeer","step_id":"register_gp"},{"body":"Your appointment is with the municipality of Zoetermeer, at Engelandlaan 502.\nEveryone who is registering with you must come to the appointment in person.\nYou get a letter by post within 4 weeks. The municipality's page does not say whether you receive your BSN at the counter, so ask at the appointment.","last_verified":"2026-11-12","links":[{"label":"Book a first registration in Zoetermeer","url":"https://en.zoetermeer.nl/form/afspraak-eerste-inschrijving-of-hervestiging-of-herinschrijving-vanuit-buitenland/eerste-inschrijving-0"}],"municipality_id":"zoetermeer","step_id":"register_municipality"}],"steps":[{"applies_region":"non_eu","applies_work":"all","category":"admin","city_id":null,"deadlines":[{"anchor":"arrival_date","anchor_event":null,"anchor_step_id":null,"consequence":null,"label":"Aim to have all permit documents in before the summer rush","offset_days":-90,"severity":"advice"}],"how_to":"Your university applies to the IND as your recognised sponsor.\nUpload every document your university asks for as early as you can.\nAim to be complete well before the summer rush.\nSome students must first give biometrics (fingerprints and a photo) at an IND appointment.\nAfter arrival you collect the permit card. Where depends on your university: see the step \"Collect your residence permit\".","id":"residence_permit","institution_id":null,"is_optional":false,"last_verified":"2026-10-19","local_scope":null,"phase":"pre_arrival","prereqs":[],"sort_order":10,"sources":["studypath-ind","thuas-arrival"],"summary":"Your university applies for you. Send every document early.","title":"Get your residence permit started","verified_by":"Fact-check 19 Oct 2026","why_it_matters":"Without a permit you cannot register with the city, and everything after that waits. A commercial guide (StudyPath) reports that the IND (the Dutch immigration service) is busiest from May to July and that incomplete or late documents are the main cause of delays."},{"applies_region":"all","applies_work":"all","category":"housing","city_id":null,"deadlines":[],"how_to":"Ask your university's housing service first: many reserve rooms for first-year international students.\nAlso look at the student housing providers for your city (listed below and under Local help).\nMake sure the landlord lets you register at the address.\nRun every offer through the Scam check before you pay anything.","id":"find_housing","institution_id":null,"is_optional":false,"last_verified":"2026-09-28","local_scope":"home","phase":"pre_arrival","prereqs":[],"sort_order":20,"sources":["huurteam-scams","iamexpat-2026"],"summary":"You need an address you can register at. Start early and check for scams.","title":"Find a room with a registrable address","verified_by":"CBS desk research","why_it_matters":"Registration, your BSN (citizen service number), DigiD (your login for government websites), a job and insurance all depend on having an address. About 70% of international students meet housing scams and 1 in 3 search more than three months."},{"applies_region":"all","applies_work":"all","category":"health","city_id":null,"deadlines":[],"how_to":"If you only study, you are not allowed to take Dutch public health insurance. Use your home cover or a private student insurance.\nIf you start any paid job, even one hour a week, Dutch health insurance becomes mandatory from your first working day. It works with packages: a mandatory basic package plus optional extras (see the step \"Take Dutch health insurance\").\nCheck that your private insurer is accepted by GP practices you want to join.","id":"check_insurance","institution_id":null,"is_optional":false,"last_verified":"2026-09-28","local_scope":null,"phase":"pre_arrival","prereqs":[],"sort_order":30,"sources":["iso-2022","studyinnl-insurance"],"summary":"Study only? You may not take Dutch basic insurance. You do need cover.","title":"Sort out health insurance for studying","verified_by":"CBS desk research","why_it_matters":"In 2022, 37% of international students were unsure whether they needed Dutch health insurance. Getting this wrong can mean a fine or a big medical bill."},{"applies_region":"all","applies_work":"all","category":"money","city_id":null,"deadlines":[],"how_to":"ING, bunq, ABN AMRO and Revolut let students open an account with a Dutch IBAN before they have a BSN.\nYou must add your BSN later. Banks give {bank_bsn_deadline_days}, so check your bank's exact deadline.\nIf your bank counts the deadline from the day you open the account, opening it months before you arrive can mean you have no BSN in time. Open it closer to your arrival date.\nWe will remind you when the deadline gets close.","id":"open_bank","institution_id":null,"is_optional":false,"last_verified":"2026-09-28","local_scope":null,"phase":"pre_arrival","prereqs":[],"sort_order":40,"sources":["dutchreview-bank","eur-bank","uva-bank"],"summary":"Several banks let you open one before you have a BSN.","title":"Open a Dutch bank account","verified_by":"CBS desk research","why_it_matters":"You need a Dutch IBAN for rent, salary and most payments. Opening early means you do not have to wait for your BSN, but it starts a deadline to add the BSN later."},{"applies_region":"all","applies_work":"all","category":"admin","city_id":null,"deadlines":[{"anchor":"arrival_date","anchor_event":null,"anchor_step_id":null,"consequence":null,"label":"Book a registration appointment before you travel","offset_days":-14,"severity":"advice"}],"how_to":"You register in the municipality where you live, not where you study.\nMany cities run special registration days or online pre-registration for international students. See the details for your municipality below.\nYou need your rental contract (and, non-EU, your permit details) to register.","id":"book_registration","institution_id":null,"is_optional":false,"last_verified":"2026-10-19","local_scope":"home","phase":"pre_arrival","prereqs":[{"id":"find_housing","kind":"hard"}],"sort_order":50,"sources":["nlww-brp"],"summary":"Book with the municipality where you will live, before you travel.","title":"Book your registration appointment","verified_by":"Fact-check 19 Oct 2026","why_it_matters":"Waiting times for municipal registration can be long. Booking a student registration day before you travel saves weeks."},{"applies_region":"all","applies_work":"all","category":"money","city_id":null,"deadlines":[],"how_to":"Make a monthly budget: rent, insurance, food, transport, phone.\nEU/EEA students who work enough hours per month may qualify for Dutch student finance from DUO. See the step \"Apply for student finance\" once you work.\nAsk your university's international office if you are unsure.","id":"plan_finances","institution_id":null,"is_optional":false,"last_verified":"2026-09-28","local_scope":null,"phase":"pre_arrival","prereqs":[],"sort_order":60,"sources":["iamexpat-2026","iso-2022"],"summary":"Many students never find out they could get student finance.","title":"Check what money support you can get","verified_by":"CBS desk research","why_it_matters":"Many international students never find out what money support they can get. In 2022, 70% did not know that working enough hours a month could give them a student loan and a travel product from DUO."},{"applies_region":"all","applies_work":"all","category":"admin","city_id":null,"deadlines":[{"anchor":"arrival_date","anchor_event":null,"anchor_step_id":null,"consequence":"You get no BSN until you register, and without one you cannot be paid. Non-EU students can also put their residence permit at risk.","label":"Register in person within 5 days of arrival","offset_days":5,"severity":"legal"}],"how_to":"Required if you stay longer than {brp_min_stay_months}. Register in person within {brp_deadline_days}.\nGo to the municipality where you live. Bring your passport or ID, rental contract, and (non-EU) permit documents.\nYour BSN arrives at or after the appointment. Keep it somewhere safe; the app only records that this step is done, never the number itself.","id":"register_municipality","institution_id":null,"is_optional":false,"last_verified":"2026-10-19","local_scope":"home","phase":"arrival","prereqs":[{"id":"residence_permit","kind":"hard"},{"id":"find_housing","kind":"hard"},{"id":"book_registration","kind":"hard"}],"sort_order":70,"sources":["nlww-brp","studyinnl-arrival","ucr-bsn"],"summary":"Go to your registration appointment. You will receive your BSN.","title":"Register with the municipality and get your BSN","verified_by":"Fact-check 19 Oct 2026","why_it_matters":"Without a BSN you cannot get a salary, take Dutch health insurance, file taxes or get DigiD. Non-EU students who do not register risk their residence permit."},{"applies_region":"non_eu","applies_work":"all","category":"admin","city_id":null,"deadlines":[],"how_to":"Your university tells you when the IND has approved your permit and how to book a collection appointment.\nThis is arranged through your university, so it does not change if you live in a different municipality.\nThe IND gets your new address automatically once you register with your municipality.","id":"collect_permit","institution_id":null,"is_optional":false,"last_verified":"2026-10-19","local_scope":"study","phase":"arrival","prereqs":[{"id":"residence_permit","kind":"hard"}],"sort_order":75,"sources":[],"summary":"Non-EU students collect the permit card where the IND or your university tells you.","title":"Collect your residence permit","verified_by":"Fact-check 19 Oct 2026","why_it_matters":"You need the physical permit card to prove your right to stay, travel and work."},{"applies_region":"all","applies_work":"all","category":"money","city_id":null,"deadlines":[{"anchor":"step_done","anchor_event":null,"anchor_step_id":"open_bank","consequence":"Your bank may block your account until you add your BSN. Some banks close it.","label":"Add your BSN to your bank (check: 90 to 120 days)","offset_days":90,"severity":"financial"}],"how_to":"Open your banking app and look for \"add BSN\" or \"complete your profile\".\nCheck the exact deadline with your own bank.","id":"add_bsn_bank","institution_id":null,"is_optional":false,"last_verified":"2026-09-28","local_scope":null,"phase":"arrival","prereqs":[{"id":"open_bank","kind":"hard"},{"id":"register_municipality","kind":"hard"}],"sort_order":80,"sources":["eur-bank","uva-bank"],"summary":"Do this before your bank's deadline ({bank_bsn_deadline_days}).","title":"Add your BSN to your bank account","verified_by":"CBS desk research","why_it_matters":"Banks ask for your BSN within {bank_bsn_deadline_days} of opening the account. The exact deadline differs per bank, so check yours."},{"applies_region":"all","applies_work":"all","category":"admin","city_id":null,"deadlines":[],"how_to":"Apply online with your BSN.\nThe activation code is sent by post to your registered address, so keep an eye on your mailbox.","id":"apply_digid","institution_id":null,"is_optional":false,"last_verified":"2026-09-28","local_scope":null,"phase":"arrival","prereqs":[{"id":"register_municipality","kind":"hard"}],"sort_order":90,"sources":["ucr-bsn"],"summary":"Your login for Dutch government services. Needs a BSN.","title":"Apply for DigiD","verified_by":"CBS desk research","why_it_matters":"You need DigiD for DUO, the tax office, healthcare allowance and many municipal services."},{"applies_region":"all","applies_work":"all","category":"health","city_id":null,"deadlines":[{"anchor":"arrival_date","anchor_event":null,"anchor_step_id":null,"consequence":null,"label":"Register with a GP in your first two weeks","offset_days":14,"severity":"advice"}],"how_to":"GPs register patients who live nearby, so look close to your home address.\nStart with the practices listed for your area below and under Local help.\nCall or email them in your first two weeks.\nAsk whether they accept your insurance (some do not accept certain private insurers).\nMost practices ask for your BSN and insurance details when you register.\nSave the out-of-hours GP number in your phone.","id":"register_gp","institution_id":null,"is_optional":false,"last_verified":"2026-10-19","local_scope":"home","phase":"arrival","prereqs":[{"id":"find_housing","kind":"soft"}],"sort_order":100,"sources":["klein-gp"],"summary":"Many practices are full. Register near your home early.","title":"Register with a GP (huisarts) before you need one","verified_by":"Fact-check 19 Oct 2026","why_it_matters":"You need a GP for almost all care and for referrals to specialists. We estimate about 1 in 3 newcomer international students has no GP, and many only start looking once they are ill."},{"applies_region":"non_eu","applies_work":"all","category":"health","city_id":null,"deadlines":[],"how_to":"Check with your university's international office whether your nationality needs a TB test.\nThe GGD (Municipal Health Service) sends you an invitation with date, time, place and what to bring.\nIt is a short check with a chest X-ray. It costs {tb_test_cost_eur}, paid directly to the GGD.","id":"tb_test","institution_id":null,"is_optional":true,"last_verified":"2026-10-19","local_scope":"home","phase":"arrival","prereqs":[],"sort_order":105,"sources":["thuas-arrival"],"summary":"Depending on your nationality, a TB check is part of your residence permit.","title":"Do the TB test if you are invited","verified_by":"Fact-check 19 Oct 2026","why_it_matters":"If your nationality requires it, the TB test is a condition of your residence permit."},{"applies_region":"all","applies_work":"working","category":"work","city_id":null,"deadlines":[],"how_to":"You need a BSN before you can receive salary.\nNon-EU students: check the work permit rules and hour limits with your university's international office before you sign.\nRecord your first working day in the app. It starts your insurance deadline.","id":"find_job","institution_id":null,"is_optional":false,"last_verified":"2026-09-28","local_scope":null,"phase":"arrival","prereqs":[{"id":"register_municipality","kind":"hard"}],"sort_order":110,"sources":["lsvb-2026"],"summary":"About half of international students work. A BSN is required to be paid.","title":"Find a part-time job","verified_by":"CBS desk research","why_it_matters":"A job helps with money, but triggers new rules: Dutch health insurance from day one and (EU/EEA) possible student finance."},{"applies_region":"all","applies_work":"working","category":"health","city_id":null,"deadlines":[{"anchor":"user_event","anchor_event":"first_work_day","anchor_step_id":null,"consequence":"Working without Dutch health insurance can lead to a CAK fine of {cak_fine_eur}.","label":"Dutch health insurance must start today","offset_days":0,"severity":"legal"}],"how_to":"Dutch health insurance is package-based. You always take the basic package and choose any extras yourself.\nBasic package (basisverzekering): mandatory. The government decides what it covers, so the cover is the same at every insurer. Only the price and the choice of care providers differ.\nSupplementary packages (aanvullende verzekering): optional extras such as dental care or physiotherapy. Only pay for what you expect to use.\nDeductible (eigen risico): you pay the first part of most care yourself each year (see the figure below). GP visits do not count towards it. A higher voluntary deductible lowers your premium, but costs more if you need care.\nUse the Independer comparison to find the policy that fits you, then check the insurer's own website before you sign.\nMake the insurance start on your first working day.\nAsk whether you can get healthcare allowance (zorgtoeslag) to help pay the premium.\nGot a letter from the CAK? Open the step \"Got a letter from the CAK?\".","id":"dutch_insurance","institution_id":null,"is_optional":false,"last_verified":"2026-10-19","local_scope":null,"phase":"arrival","prereqs":[{"id":"register_municipality","kind":"hard"},{"id":"find_job","kind":"hard"}],"sort_order":120,"sources":["cak-fine","cak-fine-en","independer-zorg","studyinnl-insurance","utwente-insurance","wijzer-zorg-2026"],"summary":"Mandatory from day one of any paid job, even one hour a week.","title":"Take Dutch health insurance from your first working day","verified_by":"Fact-check 19 Oct 2026","why_it_matters":"If the CAK (the office that checks health insurance) sends you a letter you must act within {cak_response_months} or you get a fine, even if the letter was sent by mistake. Still uninsured after the first fine? A second fine follows {cak_response_months} later. Many websites show an outdated fine amount."},{"applies_region":"eu_eea","applies_work":"working","category":"money","city_id":null,"deadlines":[],"how_to":"DUO's rule: you must work {duo_min_hours_month}. Court cases suggest fewer hours can be enough, so contact DUO if you are close.\nApply through Mijn DUO with your DigiD.\nKeep your payslips as proof of the hours you worked.","id":"student_finance","institution_id":null,"is_optional":false,"last_verified":"2026-10-19","local_scope":null,"phase":"arrival","prereqs":[{"id":"apply_digid","kind":"hard"},{"id":"find_job","kind":"hard"}],"sort_order":130,"sources":["dutchreview-duo","iso-2022"],"summary":"EU/EEA students working enough hours may get a loan and travel product.","title":"Apply for student finance (DUO)","verified_by":"Fact-check 19 Oct 2026","why_it_matters":"70% of international students did not know about this entitlement in 2022."},{"applies_region":"all","applies_work":"all","category":"social","city_id":null,"deadlines":[],"how_to":"Sign up for your city's introduction week and your programme's introduction.","id":"intro_week","institution_id":null,"is_optional":true,"last_verified":"2026-09-28","local_scope":"study","phase":"first_months","prereqs":[],"sort_order":150,"sources":[],"summary":"Your city and university run intro activities.","title":"Join the introduction week","verified_by":"CBS desk research","why_it_matters":"A good start matters: more than half of international students want to stay in the Netherlands after graduating."},{"applies_region":"all","applies_work":"all","category":"social","city_id":null,"deadlines":[],"how_to":"Look at student associations and sports clubs that welcome internationals.\nAsk your university about free or cheap Dutch courses.","id":"join_community","institution_id":null,"is_optional":true,"last_verified":"2026-09-28","local_scope":"study","phase":"first_months","prereqs":[],"sort_order":160,"sources":["lsvb-2026"],"summary":"Make it easier to meet people and learn some Dutch.","title":"Find a club, association or Dutch course","verified_by":"CBS desk research","why_it_matters":"76% of international students were not satisfied with how accessible student associations are, and many find Dutch courses limited or expensive."},{"applies_region":"all","applies_work":"all","category":"health","city_id":null,"deadlines":[{"anchor":"user_event","anchor_event":"cak_letter","anchor_step_id":null,"consequence":"If you are still not insured after {cak_response_months}, the CAK fines you {cak_fine_eur}.","label":"Respond to the CAK letter or get fined","offset_days":90,"severity":"financial"}],"how_to":"Record the date of the letter in the app. We count down the three months for you.\nIf you work: take out Dutch basic insurance (basisverzekering) straight away.\nIf you only study and think the letter is a mistake: still respond to the CAK within {cak_response_months} and show your proof.\nAsk your university's international office if you are unsure.","id":"cak_letter","institution_id":null,"is_optional":true,"last_verified":"2026-10-19","local_scope":null,"phase":"first_months","prereqs":[],"sort_order":165,"sources":["cak-fine-en","studyinnl-insurance"],"summary":"Only if you receive one. It applies to everyone, even if you only study.","title":"Got a letter from the CAK? Act within 3 months","verified_by":"Fact-check 19 Oct 2026","why_it_matters":"The CAK enforces the health insurance obligation. If you get a letter you must act within {cak_response_months} or you are fined, even if the letter was sent in error."},{"applies_region":"all","applies_work":"all","category":"wellbeing","city_id":null,"deadlines":[],"how_to":"Answer the short check-in when the app reminds you.\nIf things are hard, talk to your university's student support.","id":"wellbeing_checkin","institution_id":null,"is_optional":true,"last_verified":"2026-09-28","local_scope":"study","phase":"first_months","prereqs":[],"sort_order":170,"sources":["nuffic-wellbeing"],"summary":"One minute a month: how are you doing, and what is still open?","title":"Do your monthly check-in","verified_by":"CBS desk research","why_it_matters":"62% of international students often or always felt stressed (Nuffic, 2021-22)."}],"version":"3b32b5914fb6bdfc"}</script>
<script id="legal" type="application/json">{"html": "\u003ch1>Terms of Service and Privacy Policy\u003c/h1>\n\u003cp>\u003cem>Version 2.1 · 21 November 2026 · Netherlanded prototype\u003c/em>\u003c/p>\n\u003cblockquote>\n\u003cp>Template text written for a student project (Creative Business Solutions, THUAS). It is not legal advice. Have it checked before the app is offered to real users, and fill in the parts in [square brackets].\u003c/p>\n\u003c/blockquote>\n\u003ch2>Part A – Terms of Service\u003c/h2>\n\u003ch3>1. Who we are\u003c/h3>\n\u003cp>Netherlanded (\"the app\", \"we\") is a guide for first-year international students who are moving to the Netherlands. It is made by [group name], a student team at The Hague University of Applied Sciences. Contact: [contact e-mail].\u003c/p>\n\u003cp>The app is \u003cstrong>not an official service\u003c/strong> of THUAS, the Municipality of The Hague, the IND, DUO, the CAK or the Dutch government. Content explicitly marked as provided by a participating university is that university's responsibility.\u003c/p>\n\u003ch3>2. What the app does\u003c/h3>\n\u003cp>The app shows a personal checklist of arrival steps, works out deadlines, offers a housing scam check, lists local services, can show local browser reminders for your deadlines, uses limited service statistics to find problems and unclear guidance, shared with universities only as disclosure-controlled aggregate reports (section 13a), and, only if you say yes, shares additional statistics with your university (section 13b).\u003c/p>\n\u003ch3>3. Information, not advice\u003c/h3>\n\u003cp>We collect information from official and other sources and show where each piece comes from and when we last checked it. Rules, amounts and deadlines change. \u003cstrong>Always confirm with the official organisation before you act.\u003c/strong> The app does not give legal, financial, immigration or medical advice.\u003c/p>\n\u003cp>The scam check gives an indication only. A low score does not mean an offer is safe, and a high score does not prove fraud.\u003c/p>\n\u003ch3>4. Who can use the app\u003c/h3>\n\u003cp>You must be at least 16 years old. You are responsible for the information you enter and for keeping your device secure.\u003c/p>\n\u003ch3>5. Staying safe\u003c/h3>\n\u003cp>\u003cstrong>Never send money, ID documents, your BSN or bank details to anyone who contacts you about housing or paperwork\u003c/strong> unless you have checked who they are through an official channel. The app will never ask you for these.\u003c/p>\n\u003ch3>6. Acceptable use\u003c/h3>\n\u003cp>Do not misuse the app: no false information about other people, no attempts to access other users' data, no automated scraping.\u003c/p>\n\u003ch3>7. Links to other services\u003c/h3>\n\u003cp>The app links to websites of government bodies, universities, housing providers and GP practices. We are not responsible for their content or services.\u003c/p>\n\u003ch3>8. Liability\u003c/h3>\n\u003cp>We work carefully, but the app is provided \"as is\". As far as the law allows, we are not liable for damage caused by relying on its content, including missed deadlines, fines or housing losses. Nothing in these terms limits rights you have under mandatory Dutch or EU consumer law.\u003c/p>\n\u003ch3>9. Changes and ending\u003c/h3>\n\u003cp>We may update the app and these terms. If a change is important, we tell you in the app at least 30 days before it takes effect. You can stop using the app and delete your data at any time (see Part B).\u003c/p>\n\u003ch3>10. Law\u003c/h3>\n\u003cp>Dutch law applies. Disputes go to the Dutch court that is competent by law. If you live in another EU country, you keep the protection of the mandatory rules of that country and can also go to a court there.\u003c/p>\n\u003ch2>Part B – Privacy Policy\u003c/h2>\n\u003ch3>11. Controller\u003c/h3>\n\u003cp>[Group name / legal entity to be confirmed], [contact e-mail], is responsible for your personal data under the General Data Protection Regulation (GDPR / AVG). Before any pilot with real students, the named legal controller (and, where a university acts as controller, an Article 28 GDPR processing agreement) will be confirmed and stated here.\u003c/p>\n\u003ch3>12. What we collect, why, and on what basis\u003c/h3>\n\u003cp>The current app has \u003cstrong>no student accounts and no server push notifications\u003c/strong>: your checklist answers, progress, and local reminders stay in your browser on your device. (University staff who access the aggregate statistics dashboard or content editor have separate staff accounts governed by a separate staff privacy notice.)\u003c/p>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Data\u003c/th>\n\u003cth>Why\u003c/th>\n\u003cth>Legal basis\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Answers to the start questions: EU/EEA or not, institution, city/campus, arrival date, plans to work\u003c/td>\n\u003ctd>To show the steps and deadlines that apply to you\u003c/td>\n\u003ctd>Performance of our service (Art. 6(1)(b) GDPR)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Your progress, and dates you enter (first working day, CAK letter)\u003c/td>\n\u003ctd>To track your steps and calculate deadlines\u003c/td>\n\u003ctd>Performance of our service\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>First name and profile photo (optional, stored on device only)\u003c/td>\n\u003ctd>To personalise the app\u003c/td>\n\u003ctd>Consent (Art. 6(1)(a))\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>App settings: appearance, sounds\u003c/td>\n\u003ctd>To remember how you like the app\u003c/td>\n\u003ctd>Performance of our service\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Local reminder preferences\u003c/td>\n\u003ctd>To show browser/local deadline reminders on your device if you turn them on\u003c/td>\n\u003ctd>Consent (Art. 6(1)(a))\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Scam check answers\u003c/td>\n\u003ctd>To give you an indication on your device. Not stored on a server\u003c/td>\n\u003ctd>Performance of our service\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Limited service statistics (on unless you object, see section 13a)\u003c/td>\n\u003ctd>To find technical problems and guidance that may be unclear or not working, and to give participating universities disclosure-controlled aggregate statistics for improving general onboarding guidance\u003c/td>\n\u003ctd>Legitimate interest (Art. 6(1)(f)). You can object at any time on the notice screen or with the switch in Profile\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Additional statistics for your university (only if you say yes, see section 13b)\u003c/td>\n\u003ctd>To show universities where new students get stuck, so they can improve support\u003c/td>\n\u003ctd>Consent (Art. 6(1)(a)). Off unless you turn it on. You can withdraw it at any time in Profile\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>Health and sensitive data.\u003c/strong> We never ask for or store your BSN, passport or permit number, bank details, medical records, or diagnoses. The checklist includes a broad step category named \u003ccode>health\u003c/code> (general arrival tasks such as Dutch health insurance and finding a GP); only category-level applicability and completion counts are processed, never your personal health details or notes, and \u003ccode>health\u003c/code> category counts are published only in groups of at least 15.\u003c/p>\n\u003cp>\u003cstrong>Whether providing data is required.\u003c/strong> No data is required by law or contract. Without the start questions, the app cannot personalise your checklist or deadlines.\u003c/p>\n\u003cp>\u003cstrong>Automated processing.\u003c/strong> Deadline calculations and the housing scam check run automatically on your device as general guidance only; they do not produce legal or similarly significant decisions (Art. 22 GDPR).\u003c/p>\n\u003ch3>1
