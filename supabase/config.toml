# The Supabase GitHub integration applies migrations and these settings on push to main;
# .github/workflows/deploy-functions.yml deploys the function code after CI passes.
# supabase/migrations and supabase/functions/*/index.ts are generated from db/ and edge/
# by tools/sync_supabase.py; edit the sources there.
project_id = "netherlanded"

[api]
enabled = true
# nl: ingest RPCs reached by edge/ingest with Content-Profile: nl.
# nl_content: editor RPCs reached by edge/editor.
schemas = ["public", "graphql_public", "nl", "nl_content"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

# Matches the tested settings in architecture/TEST_FINDINGS_SUMMARY.md §4.
# Staff accounts are created by an admin; nobody may sign themselves up.
[auth]
enable_signup = false

# ingest is called by anonymous app installs: no JWT, so the gateway check is off and
# the function gates itself (fails closed without NL_PROXY_SECRET, constant-time
# x-nl-proxy-secret check). stats and editor serve signed-in staff and keep it on.
[functions.ingest]
verify_jwt = false

[functions.stats]
verify_jwt = true

[functions.editor]
verify_jwt = true
