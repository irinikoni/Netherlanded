<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <!-- connect-src 'self': this page only calls its own relative data-endpoint through the nginx proxy. If data-endpoint ever points at another host, add that exact origin here, never a bare https:. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; connect-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'">
  <title>Netherlanded — Editor Panel</title>
  <style>
    :root {
      color-scheme: light;
      box-sizing: border-box;
      --polder: #1d5a3a;
      --on-polder: #ffffff;
      --polder-text: #1d5a3a;
      --low-sun: #f3c623;
      --dike: #10261b;
      --dike-2: #3f4a44;
      --sky: #eef4f1;
      --field: #ffffff;
      --ditch: #c9d6cf;
      --track: #e3ebe6;
      --mist: #dcebe2;
      --must: #c5221f;
      --on-must: #ffffff;
      --fee: #ff8a3d;
      --on-fee: #10261b;
      --water: #2f6f8f;
      --serif: Georgia, "Times New Roman", serif;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --shadow: 0 1px 2px rgba(16, 38, 27, 0.06), 0 6px 18px -10px rgba(16, 38, 27, 0.18);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --polder-text: #5cc58d;
        --dike: #eaf2ec;
        --dike-2: #b9c6be;
        --sky: #0b120e;
        --field: #18201b;
        --ditch: #2c3a32;
        --track: #232e28;
        --mist: #1f2b24;
        --must: #ff6b5e;
        --on-must: #10261b;
        --fee: #ff9d5c;
        --water: #7cc0e0;
        --shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
        color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      --polder-text: #5cc58d;
      --dike: #eaf2ec;
      --dike-2: #b9c6be;
      --sky: #0b120e;
      --field: #18201b;
      --ditch: #2c3a32;
      --track: #232e28;
      --mist: #1f2b24;
      --must: #ff6b5e;
      --on-must: #10261b;
      --fee: #ff9d5c;
      --water: #7cc0e0;
      --shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html { scroll-padding-top: env(safe-area-inset-top, 0px); }
    body {
      margin: 0;
      padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px);
      background: var(--sky);
      color: var(--dike);
      font: 16px/1.45 var(--sans);
      font-variant-numeric: tabular-nums;
    }
    [hidden]:not([hidden=until-found i]) { display: none !important; }
    .gut {
      padding-left: max(16px, env(safe-area-inset-left, 0px));
      padding-right: max(16px, env(safe-area-inset-right, 0px));
    }
    .in { max-width: 980px; margin: 0 auto; }
    header.band { background: var(--polder); color: var(--on-polder); }
    header .in {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px 20px;
      padding-block: 16px;
    }
    .brand { display: flex; align-items: center; gap: 10px; margin-right: auto; }
    .brand svg { width: 30px; height: 30px; flex: none; }
    .brand b { font: 600 22px/1 var(--serif); letter-spacing: -0.01em; }
    .brand span { font-size: 14px; opacity: 0.85; }
    .hdr-nav { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
    .nav-pill {
      display: inline-flex;
      align-items: center;
      min-height: 38px;
      padding: 0 13px;
      border-radius: 10px;
      font: 600 14px/1 var(--sans);
      text-decoration: none;
      color: var(--on-polder);
      border: 1px solid rgba(255, 255, 255, 0.28);
      background: rgba(255, 255, 255, 0.08);
    }
    .nav-pill:hover { background: rgba(255, 255, 255, 0.16); }
    .who { display: flex; align-items: center; gap: 8px; font-size: 14px; }
    select, input, textarea {
      font: 400 16px var(--sans);
      color: var(--dike);
      background: var(--field);
      border: 1px solid var(--ditch);
      border-radius: 10px;
      min-height: 44px;
      padding: 8px 12px;
      max-width: 100%;
      width: 100%;
    }
    select { font-weight: 600; width: auto; }
    header select { border-color: transparent; }
    textarea { min-height: 120px; line-height: 1.45; resize: vertical; }
    :focus-visible { outline: 3px solid var(--polder-text); outline-offset: 2px; }
    header :focus-visible { outline-color: var(--low-sun); }
    .note {
      background: var(--mist);
      border-bottom: 1px solid var(--ditch);
      font-size: 14px;
    }
    .note .in { padding-block: 10px; }
    .auth-strip {
      background: var(--field);
      border-bottom: 1px solid var(--ditch);
    }
    .nl-auth {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 10px;
      padding-block: 10px;
      background: transparent;
      padding-inline: 0;
      border-radius: 0;
    }
    .nl-auth label {
      flex-direction: row;
      font-size: 13px;
      font-weight: 600;
      color: var(--dike-2);
    }
    .nl-auth input {
      flex: 1 1 220px;
      min-width: 180px;
      width: auto;
      min-height: 40px;
      font: 400 1rem var(--sans);
    }
    .nl-auth .btn { min-height: 40px; font-size: 14px; }
    nav.tabs {
      background: var(--field);
      border-bottom: 1px solid var(--ditch);
      position: sticky;
      top: env(safe-area-inset-top, 0px);
      z-index: 5;
    }
    nav .in { display: flex; gap: 4px; overflow-x: auto; }
    nav button {
      font: 600 15px var(--sans);
      color: var(--dike-2);
      background: transparent;
      border: 0;
      border-bottom: 3px solid transparent;
      min-height: 48px;
      padding: 0 12px;
      cursor: pointer;
      white-space: nowrap;
    }
    nav button[aria-selected="true"] {
      color: var(--polder-text);
      border-bottom-color: var(--polder-text);
    }
    nav .count {
      display: inline-block;
      min-width: 20px;
      margin-left: 6px;
      padding: 0 6px;
      border-radius: 999px;
      background: var(--low-sun);
      color: #10261b;
      font-size: 12px;
      line-height: 20px;
      text-align: center;
    }
    main .in {
      display: flex;
      flex-direction: column;
      gap: 18px;
      padding-block: 22px 120px;
    }
    h2 {
      font: 600 24px/1.2 var(--serif);
      letter-spacing: -0.01em;
      margin: 0;
      text-wrap: balance;
    }
    .sub {
      margin: 4px 0 0;
      font-size: 14px;
      color: var(--dike-2);
      max-width: 68ch;
    }
    .tools {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 16px;
      align-items: end;
    }
    .tools label {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 13px;
      font-weight: 600;
      color: var(--dike-2);
    }
    .card {
      background: var(--field);
      border-radius: 14px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .item {
      padding: 14px 16px;
      border-top: 1px solid var(--ditch);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .item:first-child { border-top: 0; }
    .top { display: flex; gap: 12px; align-items: flex-start; flex-wrap: wrap; }
    .top .t { flex: 1; min-width: 200px; }
    .top strong { display: block; font-weight: 600; overflow-wrap: anywhere; }
    .meta { font-size: 13px; color: var(--dike-2); overflow-wrap: anywhere; }
    .body {
      font-size: 14px;
      color: var(--dike-2);
      white-space: pre-line;
      max-width: 75ch;
      overflow-wrap: anywhere;
    }
    .btn {
      flex: none;
      font: 700 15px var(--sans);
      color: var(--polder-text);
      background: transparent;
      border: 1px solid var(--ditch);
      border-radius: 10px;
      min-height: 44px;
      padding: 0 14px;
      cursor: pointer;
    }
    .btn.fill {
      background: var(--polder);
      color: var(--on-polder);
      border-color: var(--polder);
    }
    .btn[disabled] { opacity: 0.5; cursor: default; }
    .tag {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      line-height: 18px;
      padding: 0 7px;
      border-radius: 5px;
      margin-right: 6px;
      vertical-align: 1px;
    }
    .tag.due { background: var(--must); color: var(--on-must); }
    .tag.soon { background: var(--fee); color: var(--on-fee); }
    .tag.ok { border: 1px solid var(--dike-2); color: var(--dike-2); line-height: 16px; }
    .tag.new { background: var(--low-sun); color: #10261b; }
    .tag.locktag { background: var(--track); color: var(--dike-2); border: 1px solid var(--ditch); }
    form.nl-inline {
      display: grid;
      gap: 10px;
      padding: 12px;
      background: var(--sky);
      border-radius: 10px;
    }
    form.nl-inline label {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 13px;
      font-weight: 600;
      color: var(--dike-2);
    }
    form .rowf {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px;
    }
    form .acts { display: flex; flex-wrap: wrap; gap: 10px; }
    .chk {
      flex-direction: row !important;
      align-items: center;
      gap: 10px !important;
      font-size: 15px !important;
      color: var(--dike) !important;
    }
    .chk input { width: 22px; min-height: 22px; height: 22px; padding: 0; }
    .err-msg {
      color: var(--must);
      font-size: 13px;
      font-weight: 600;
    }
    .lock { font-size: 13px; color: var(--dike-2); }
    .pub {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--field);
      border-top: 1px solid var(--ditch);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      box-shadow: 0 -8px 24px -16px rgba(16, 38, 27, 0.4);
      z-index: 6;
    }
    .pub .in {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 12px;
      align-items: center;
      padding-block: 10px;
    }
    .pub p { margin: 0; flex: 1; min-width: 220px; font-size: 14px; }
    .pub code, .meta code {
      font: 13px ui-monospace, SFMono-Regular, Menlo, monospace;
      background: var(--track);
      padding: 1px 5px;
      border-radius: 4px;
    }
    .empty { padding: 24px 16px; color: var(--dike-2); }
    .diff del { color: var(--must); text-decoration: line-through; }
    .diff ins { color: var(--polder-text); text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <header class="band gut">
    <div class="in">
      <div class="brand">
        <svg viewBox="0 0 96 96" aria-hidden="true">
          <path d="M8 46 A40 40 0 0 1 88 46 Z" fill="#f3c623"/>
          <path d="M8 50 A40 40 0 0 0 88 50 Z" fill="#fff" fill-opacity=".6"/>
        </svg>
        <div><b>Netherlanded</b><br><span>Editor panel</span></div>
      </div>
      <div class="hdr-nav">
        <a class="nav-pill" href="./dashboard.html">University dashboard</a>
        <label class="who" for="nl-role-sim">Signed in as
          <select id="nl-role-sim">
            <option value="thuas">THUAS International Office</option>
            <option value="admin">Project team (all content)</option>
          </select>
        </label>
      </div>
    </div>
  </header>

  <div class="note gut">
    <div class="in" id="nl-editor-banner"><strong>Prototype &amp; live-ready editor.</strong> Shared cities (The Hague, Delft) enforce <code>can_edit_city()</code>: institutional offices create scoped overrides rather than overwriting shared municipal text, while single-school cities (Zoetermeer) are directly editable.</div>
  </div>

  <div class="auth-strip gut">
    <div class="in">
      <form class="nl-auth" id="nl-editor-auth-form" autocomplete="off">
        <label for="nl-editor-token">Live API JWT</label>
        <input id="nl-editor-token" type="password" placeholder="Paste staff Bearer token for /api/editor" aria-label="Staff JWT token">
        <button type="submit" class="btn fill">Connect live</button>
        <button type="button" class="btn" id="nl-editor-clear">Clear</button>
        <button type="button" class="btn" id="nl-editor-demo-btn">Demo mode</button>
      </form>
    </div>
  </div>

  <nav class="tabs gut" aria-label="Sections">
    <div class="in" role="tablist" id="tabs"></div>
  </nav>

  <main class="gut">
    <div class="in" id="view" data-endpoint="/api/editor"></div>
  </main>

  <div class="pub gut" id="pub" hidden>
    <div class="in">
      <p id="pubText"></p>
      <button class="btn" type="button" id="discard">Discard all</button>
      <button class="btn" type="button" id="nl-export-patch">Export JSON</button>
      <button class="btn fill" type="button" id="publish">Publish</button>
    </div>
  </div>

ernational_office_url":"https://tudelft.nl/onderwijs/studievoorlichting/praktische-zaken/registration","name":"Delft University of Technology","website":"https://tudelft.nl/onderwijs/studievoorlichting/praktische-zaken/registration"},{"campus_of":null,"city":"Eindhoven","city_id":"eindhoven","id":"tue","international_office_url":"https://educationguide.tue.nl/practical-info/information-for-international-students","name":"Eindhoven University of Technology (TU/e)","website":"https://educationguide.tue.nl/practical-info/information-for-international-students"},{"campus_of":null,"city":"Maastricht","city_id":"maastricht","id":"um","international_office_url":"https://www.maastrichtuniversity.nl/studeren/support/support-international-students/international-student-helpdesk-ish","name":"Maastricht University","website":"https://www.maastrichtuniversity.nl/studeren/support/support-international-students/international-student-helpdesk-ish"},{"campus_of":"um","city":"Venlo","city_id":"venlo","id":"um-venlo","international_office_url":"https://www.maastrichtuniversity.nl/studeren/support/support-international-students/international-student-helpdesk-ish","name":"Maastricht University, Campus Venlo","website":"https://www.maastrichtuniversity.nl/research/institutes/campus-venlo/getting-started"},{"campus_of":null,"city":"Enschede","city_id":"enschede","id":"utwente","international_office_url":"https://www.utwente.nl/en/education/student-services/visa/appointment-formalities.rtd/register-municipality/","name":"University of Twente","website":"https://www.utwente.nl/en/education/student-services/visa/appointment-formalities.rtd/register-municipality/"},{"campus_of":null,"city":"Utrecht","city_id":"utrecht","id":"uu","international_office_url":"https://www.uu.nl/en/education/welcome-to-utrecht/upon-arrival/city-registration","name":"Utrecht University","website":"https://www.uu.nl/en/education/welcome-to-utrecht/upon-arrival/city-registration"},{"campus_of":null,"city":"Amsterdam","city_id":"amsterdam","id":"uva","international_office_url":"https://www.uva.nl/en/education/practical-information/checklist-for-international-students/checklist-international-students.html","name":"University of Amsterdam","website":"https://www.uva.nl/en/education/practical-information/checklist-for-international-students/checklist-international-students.html"},{"campus_of":null,"city":"Amsterdam","city_id":"amsterdam","id":"vu","international_office_url":"https://vu.nl/en/education/more-about/when-you-arrive","name":"Vrije Universiteit Amsterdam","website":"https://vu.nl/en/education/more-about/when-you-arrive"},{"campus_of":null,"city":"Maastricht","city_id":"maastricht","id":"zuyd","international_office_url":"http://international.zuyd.nl/","name":"Zuyd University of Applied Sciences","website":"http://international.zuyd.nl/"},{"campus_of":"zuyd","city":"Heerlen","city_id":"heerlen","id":"zuyd-heerlen","international_office_url":"http://international.zuyd.nl/","name":"Zuyd, Heerlen location","website":"http://international.zuyd.nl/"},{"campus_of":"zuyd","city":"Sittard","city_id":"sittard-geleen","id":"zuyd-sittard","international_office_url":"http://international.zuyd.nl/","name":"Zuyd, Sittard location","website":"http://international.zuyd.nl/"}],"municipalities":[{"booking_note":null,"id":"amstelveen","intl_centre_name":null,"intl_centre_url":null,"is_study_city":false,"last_verified":"2026-10-19","name":"Amstelveen","near_city_id":"amsterdam","note":"VU students living on Uilenstede campus register here, by phone appointment (+31 20 540 49 11) at Laan Nieuwer-Amstel 1.","registration_summary":null,"registration_url":"https://www.amstelveen.nl/vertrek-en-verhuizing","student_registration_days":null},{"booking_note":"Pre-register online, then book a student-registration-day slot via the email link; late arrivals call +31 20 624 1111 for a regular appointment, and HvA expects Spring 2027 pre-registration dates around December/January.","id":"amsterdam","intl_centre_name":"IN Amsterdam","intl_centre_url":"https://www.iamsterdam.com/en/live-work-study/in-amsterdam/international-newcomers/make-an-appointment-individuals","is_study_city":true,"last_verified":"2026-10-19","name":"Amsterdam","near_city_id":null,"note":null,"registration_summary":"International students first pre-register online with the City of Amsterdam (for Fall 2026 the window ran 13 July to 18 September 2026); universities do not do this for you. Once approved, you get an email to book an in-person slot on a student registration day (17 August to 25 September 2026) at Bos en Lommerplein 176, 1055 RW Amsterdam, where the BSN is issued quickly. Students who miss the pre-registration window book a regular first-registration appointment instead, which universities warn can delay the BSN by weeks.","registration_url":"https://www.amsterdam.nl/en/civil-affairs/pre-registration-for-students/","student_registration_days":true},{"booking_note":"Appointments are mandatory; you cannot walk in. Call 14 055 (within the Netherlands) or +31 55 580 15 55 (from abroad) to schedule at the Stadhuis.","id":"apeldoorn","intl_centre_name":null,"intl_centre_url":null,"is_study_city":true,"last_verified":"2026-11-22","name":"Apeldoorn","near_city_id":null,"note":"Saxion has a campus in Apeldoorn (including Hotel Management). No separate municipal student registration days are published; book an individual immigration appointment by phone.","registration_summary":"Students staying in the Netherlands for at least 4 months out of 6 must register in person at the Stadhuis (Marktplein 1, 7311 LG Apeldoorn) within 5 working days of arrival. Registration is free; written confirmation and your BSN arrive within about 4 weeks. Bring a valid passport or ID card, a signed rental contract (or a signed toestemmingsverklaring plus a copy of the main occupant's ID), your IND residence permit or application proof if non-EU, and original foreign civil-status documents such as a birth certificate (legalised/apostilled and translated into Dutch, English, German, or French where required).","registration_url":"https://www.apeldoorn.nl/wonen-en-verhuizen/verhuizen/verhuizing-vanuit-het-buitenland-naar-apeldoorn-immigratie","student_registration_days":false},{"booking_note":null,"id":"capelle-aan-den-ijssel","intl_centre_name":null,"intl_centre_url":null,"is_study_city":false,"last_verified":"2026-10-19","name":"Capelle aan den IJssel","near_city_id":"rotterdam","note":"EUR names it as a neighbouring municipality where students follow local registration procedures, and publishes a first-registration guide for it.","registration_summary":null,"registration_url":"https://www.eur.nl/media/2025-02-first-registration-capelle-aan-den-ijssel","student_registration_days":null},{"booking_note":"Book online at https://www.delft.nl/registration. You can only book once your rental agreement has started.","id":"delft","intl_centre_name":"The Hague International Centre","intl_centre_url":"https://www.thehagueinternationalcentre.nl/relocating/formalities/personal-records-database-brp","is_study_city":true,"last_verified":"2026-10-19","name":"Delft","near_city_id":null,"note":null,"registration_summary":"City page on registering in the BRP; register within 5 days of arrival by online appointment.","registration_url":"https://www.delft.nl/en/registration-international-students","student_registration_days":null},{"booking_note":"Saxion students get a fixed slot by email at the end of August (email Saxion International Office if you already have a BSN or live outside Deventer). Arriving outside Saxion registration days? Call 14 0570 to book an individual in-person appointment at Deventer City Hall.","id":"deventer","intl_centre_name":null,"intl_centre_url":null,"is_study_city":true,"last_verified":"2026-11-22","name":"Deventer","near_city_id":null,"note":"Outside Saxion's registration days, book an individual first-registration appointment at Deventer City Hall (Grote Kerkhof 1) by calling 14 0570 within 5 days of arrival (see https://www.deventer.nl/verhuizen-naar-nederland). Written confirmation arrives within about 5 working days.","registration_summary":"Saxion runs BSN registration days with the municipality at Deventer City Hall (Grote Kerkhof 1, 7411 KZ Deventer): Thursdays 3, 10, 17 and 24 September 2026, 09:00 to 16:00. Saxion schedules your appointment and emails the invitation at the end of August; you cannot choose or change the slot. Bring your passport or ID card, a colour copy of it and a signed copy of your rental agreement, all printed single-sided. The appointment takes about 15 minutes. If you do not live in Deventer, register at the city hall where you live.","registration_url":"https://www.saxion.edu/events/2026/september/bsn-registration-day-deventer","student_registration_days":true},{"booking_note":null,"id":"diemen","intl_centre_name":null,"intl_centre_url":null,"is_study_city":false,"last_verified":"2026-10-19","name":"Diemen","near_city_id":"amsterdam","note":"Student housing on Rode Kruislaan and Dalsteindreef is in Diemen. Book a registration appointment online at D.J. den Hartoglaan 1, and the BSN is issued on the spot if your documents are complete.","registration_summary":null,"registration_url":"https://diemen.mijnafspraakmaken.nl/Client/#?product=32","student_registration_days":null},{"booking_note":"Book online before going (EU: https://eindhoven.mijnafspraakmaken.nl/client/#?product=6, non-EU: https://eindhoven.mijnafspraakmaken.nl/client/#?product=64) or by phone on 14 040; availability can be limited in peak periods.","id":"eindhoven","intl_centre_name":"Holland Expat Center South","intl_centre_url":"https://www.hollandexpatcenter.com/","is_study_city":true,"last_verified":"2026-10-19","name":"Eindhoven","near_city_id":null,"note":null,"registration_summary":"Foreign students staying at least 4 of the coming 6 months must register in person at the municipality's Residents' Plaza (Stadhuisplein 1), preferably within 5 days of arrival, after first booking an appointment online (separate booking links for EU and non-EU students). Bring a valid passport, IND documents if applicable, original (legalised) foreign documents such as a birth certificate, and your rental contract; the BSN confirmation letter arrives within about 4 weeks. TU/e gives its students access to a booking portal with slots prioritized for TU/e students during the Bachelor Introduction Week or Master Kick-off, and some Fontys study departments arrange the appointment for their international students.","registration_url":"https://www.eindhoven.nl/stad-en-wonen/wonen/registration-of-foreign-students","student_registration_days":false},{"booking_note":"UT students book via the link emailed before their intake; Saxion students get an emailed invitation with a fixed slot; others book via https://www.enschede.nl/en/english-contact-and-opening-hours.","id":"enschede","intl_centre_name":"Expat Center East Netherlands","intl_centre_url":"https://twente.com/organisaties/expat-center-east-netherlands","is_study_city":true,"last_verified":"2026-10-19","name":"Enschede","near_city_id":null,"note":null,"registration_summary":"International students staying longer than four months must register at Enschede city hall (Hengelosestraat 51) and get their BSN the same day. University of Twente students starting in February or September receive an email with a link to book their municipality appointment, and Saxion runs BSN registration days at Enschede city hall (weekdays 24 August-11 September 2026) where the International Office assigns each student a fixed time slot. Students arriving at other times book an individual appointment via the municipality's contact page.","registration_url":"https://www.utwente.nl/en/education/student-services/visa/appointment-formalities.rtd/register-municipality/","student_registration_days":true},{"booking_note":"Book an appointment online via the municipality's student registration page; no booking window or opening date is stated.","id":"groningen","intl_centre_name":"International Welcome Center North (IWCN)","intl_centre_url":"https://iwcn.nl","is_study_city":true,"last_verified":"2026-10-19","name":"Groningen","near_city_id":null,"note":null,"registration_summary":"International students staying longer than 4 months must register in person with the municipality by appointment, booked online through the municipality's student registration page (RUG and Hanze both send students there). Visits to the Groningen Centrum counter (Kreupelstraat 1) are by appointment only. Bring a passport or ID card, a rental contract (or a permission form from the main resident), and, for non-EU students, the residence permit or IND proof/approval letter. The BSN is issued on the spot at the appointment.","registration_url":"https://gemeente.groningen.nl/en/student-registration-or-deregistration","student_registration_days":null},{"booking_note":"Phone appointments are mandatory for first-time registration from abroad: call 045-5605040 (+31 45 560 5040 from abroad) or email gemeente@heerlen.nl.","id":"heerlen","intl_centre_name":"Expat Centre Maastricht Region","intl_centre_url":"https://www.expatcentremaastrichtregion.nl/","is_study_city":true,"last_verified":"2026-11-22","name":"Heerlen","near_city_id":"maastricht","note":"Zuyd's main campus city in South Limburg. First registration requires a phone-booked in-person visit at Stadskantoor Heerlen.","registration_summary":"Students staying at least 4 of the next 6 months must register in person at the Stadskantoor (Geleenstraat 25, 6411 HP Heerlen) within 5 days of arrival. First-time registration cannot be completed online. Bring a valid passport or ID card, a signed rental contract or proof of lawful housing, your original birth certificate (in Dutch, English, German, or French, or translated by a sworn translator and legalised/apostilled where required), IND residence approval if non-EU, and proof of deregistration where applicable. Students staying under 4 months register via RNI instead.","registration_url":"https://www.heerlen.nl/verhuizen-vanuit-het-buitenland-naar-nederland","student_registration_days":false},{"booking_note":null,"id":"hengelo","intl_centre_name":null,"intl_centre_url":null,"is_study_city":false,"last_verified":"2026-10-19","name":"Hengelo","near_city_id":"enschede","note":"Neighbouring city that UT names for students who live outside Enschede and must register there.","registration_summary":null,"registration_url":"https://www.hengelo.nl/Welkom-in-Hengelo/Beheer/Header/Talen/English.html","student_registration_days":null},{"booking_note":"Book online as early as you can; late August and early September are the busiest weeks.","id":"leeuwarden","intl_centre_name":null,"intl_centre_url":null,"is_study_city":true,"last_verified":"2026-11-12","name":"Leeuwarden","near_city_id":null,"note":null,"registration_summary":"Book an appointment online with the municipality of Leeuwarden and register at Oldehoofsterkerkhof 2. Bring your original valid passport or ID card, a copy of your signed rental agreement, and copies of the data page and of every passport page with stamps or stickers. Campus Fryslân advises booking as soon as possible: if you register in weeks 33 to 36 you may not get your BSN at the appointment and may wait two to four weeks.","registration_url":"https://leeuwarden.mijnafspraakmaken.nl/Client/#?product=35","student_registration_days":null},{"booking_note":"For September 2026, student-session appointments start from the third week of August 2026. Students arriving at other times should phone the town hall (14 071, or +31 71 51 65 165 from abroad).","id":"leiden","intl_centre_name":null,"intl_centre_url":null,"is_study_city":true,"last_verified":"2026-10-19","name":"Leiden","near_city_id":null,"note":null,"registration_summary":"Newcomers first fill in the online 'Register your move' form, then get an email with a link to book an in-person appointment at the Stadskantoor (Bargelaan 190), which should be within 5 days of moving. Leiden University says the municipality runs special registration sessions for new students at the start of each semester. Students bring a passport, the residence permit or Leiden University approval email, and a rental contract (or landlord permission plus a copy of the landlord's ID). The university says a birth certificate is generally not needed for its students, although the municipality's page lists one.","registration_url":"https://gemeente.leiden.nl/inwoners-en-ondernemers/verhuizen-en-migreren/migreren/moving-to-leiden-from-abroad/","student_registration_days":true},{"booking_note":null,"id":"leidschendam-voorburg","intl_centre_name":null,"intl_centre_url":null,"is_study_city":false,"last_verified":"2026-10-19","name":"Leidschendam-Voorburg","near_city_id":"the-hague","note":"Borders The Hague and is in THIC's service area. Its Dutch-language page covers moving from abroad.","registration_summary":null,"registration_url":"https://www.lv.nl/verhuizen-vanuit-het-buitenland","student_registration_days":null},{"booking_note":"Booking details for regular student registration could not be confirmed; the Expat Centre combined appointment is requested via expatcentre@maastricht.nl.","id":"maastricht","intl_centre_name":"Expat Centre Maastricht Region (ECMR) / IND Service Point Maastricht, at the Maastricht International Centre (MIC)","intl_centre_url":"https://ind.nl/en/expat-centre-maastricht-region-ecmr-ind-service-point-maastricht","is_study_city":true,"last_verified":"2026-10-19","name":"Maastricht","near_city_id":null,"note":null,"registration_summary":"Official route for students from abroad staying 4+ months: fill in the online form (https://mijn-gemeenteloket.gemeentemaastricht.nl/pes/first-registration, Google Translate off), get an email within ~1-5 weeks with instructions, then book a GemeenteLoket appointment within 2 months; bring passport and (legalised) birth certificate; non-EU students need their IND permit first.","registration_url":"https://www.gemeentemaastricht.nl/en/moving-and-housing/international-student-registration","student_registration_days":false},{"booking_note":null,"id":"nieuwegein","intl_centre_name":null,"intl_centre_url":null,"is_study_city":false,"last_verified":"2026-10-19","name":"Nieuwegein","near_city_id":"utrecht","note":"Municipality bordering Utrecht to the south; its website has a page on the Utrecht International Center.","registration_summary":null,"registration_url":"https://www.nieuwegein.nl/hulp-en-ondersteuning/utrecht-international-center","student_registration_days":null},{"booking_note":null,"id":"nuenen","intl_centre_name":null,"intl_centre_url":null,"is_study_city":false,"last_verified":"2026-10-19","name":"Nuenen","near_city_id":"eindhoven","note":"Neighbouring municipality named by TU/e; register directly with the municipality.","registration_summary":null,"registration_url":"https://en.nuenen.nl/verhuizen-naar-nederland","student_registration_days":null},{"booking_note":null,"id":"oegstgeest","intl_centre_name":null,"intl_centre_url":null,"is_study_city":false,"last_verified":"2026-10-19","name":"Oegstgeest","near_city_id":"leiden","note":"Borders Leiden. Leiden University says to book by phone (+31 71 519 1793, press 1) and bring an original legalised birth certificate.","registration_summary":null,"registration_url":"https://www.oegstgeest.nl/inwoners/welcome-to-oegstgeest/moving-to-the-netherlands-for-the-first-time","student_registration_days":null},{"booking_note":null,"id":"rijswijk","intl_centre_name":null,"intl_centre_url":null,"is_study_city":false,"last_verified":"2026-10-19","name":"Rijswijk","near_city_id":"delft","note":"Between Delft and The Hague. Its Dutch-language page covers registering in the Netherlands for study or work.","registration_summary":null,"registration_url":"https://www.rijswijk.nl/inwoners/product/inschrijven-in-nederland-voor-studie-of-werk","student_registration_days":null},{"booking_note":"After submitting the online form you receive a case number and booking link; choose the appointment type 'Studentenafspraak gemeente', because other types follow the regular procedure without an immediate BSN.","id":"rotterdam","intl_centre_name":"Rotterdam International Center","intl_centre_url":"https://rotterdam.info/en/internationals/frequently-asked-questions","is_study_city":true,"last_verified":"2026-10-19","name":"Rotterdam","near_city_id":null,"note":null,"registration_summary":"Students start their first registration online on the Rotterdam municipality website, up to 4 weeks before arrival, and upload their ID and proof of address. They then get a case number and a link to book an in-person 'Studentenafspraak gemeente' (student appointment) at City Hall, Coolsingel 40, where the BSN is issued straight away. Addresses in postcode areas that need a housing permit (HVV) must register in person at the municipal office. EUR also mentions registration at campus One Stop Shops at the start of each semester.","registration_url":"https://www.rotterdam.nl/en/first-registration-in-the-netherlands/start-registration-in-the-netherlands-by-a-student","student_registration_days":true},{"booking_note":null,"id":"schiedam","intl_centre_name":null,"intl_centre_url":null,"is_study_city":false,"last_verified":"2026-10-19","name":"Schiedam","near_city_id":"rotterdam","note":"EUR names it as a neighbouring municipality where students must register locally rather than through Rotterdam.","registration_summary":null,"registration_url":"https://www.eur.nl/media/2025-02-first-registration-schiedam","student_registration_days":null},{"booking_note":"Book an in-person Stadswinkel appointment by phone: call 14 046 (in the Netherlands) or +31 46 477 77 77 (from abroad). Check the municipality website for the current Stadswinkel address during renovations.","id":"sittard-geleen","intl_centre_name":"Expat Centre Maastricht Region","intl_centre_url":"https://www.expatcentremaastrichtregion.nl/","is_study_city":true,"last_verified":"2026-11-22","name":"Sittard-Geleen","near_city_id":null,"note":"Zuyd University of Applied Sciences has a location in Sittard. No municipal student registration days are published; book an individual appointment by phone.","registration_summary":"If you plan to stay in the Netherlands for more than 4 months, register in person at the Stadswinkel (temporary renovation address: Markt 116, 6161 GP Geleen) within 5 days of arrival. Registration is free. Bring a valid passport or ID card, a signed rental contract (or written consent from the main occupant/owner plus a copy of their ID), IND residence approval if non-EU, proof of deregistration if moving from Belgium, Germany, or the Caribbean Netherlands, and any legalised foreign civil-status certificates such as a birth certificate.","registration_url":"https://www.sittard-geleen.nl/Onderwerpen/Regelen/Verhuizen/Verhuizen_vanuit_het_buitenland","student_registration_days":false},{"booking_note":null,"id":"son-en-breugel","intl_centre_name":null,"intl_centre_url":null,"is_study_city":false,"last_verified":"2026-10-19","name":"Son en Breugel","near_city_id":"eindhoven","note":"Neighbouring municipality named by TU/e; register directly with the municipality.","registration_summary":null,"registration_url":"https://en.sonenbreugel.nl/verhuizen-naar-nederland","student_registration_days":null},{"booking_note":"THUAS students get booking instructions by email over the summer for a fast, simplified registration. Book straight away: slots fill quickly.","id":"the-hague","intl_centre_name":"The Hague International Centre","intl_centre_url":"https://www.thehagueinternationalcentre.nl/relocating/registration-procedure/sponsored/registration-for-students","is_study_city":true,"last_verified":"2026-10-19","name":"The Hague","near_city_id":null,"note":null,"registration_summary":"The Hague International Centre runs special registration days for new international students each semester. Bookings for the second half of 2026 opened on 6 July 2026.","registration_url":"https://www.thehagueinternationalcentre.nl/relocating/registration-procedure/sponsored/registration-for-students","student_registration_days":true},{"booking_note":"Book through the municipality's student appointment form before you arrive. A confirmed appointment cannot be changed. Fontys students: ask your study department whether it books the appointment for you.","id":"tilburg","intl_centre_name":null,"intl_centre_url":null,"is_study_city":true,"last_verified":"2026-11-12","name":"Tilburg","near_city_id":null,"note":null,"registration_summary":"Students living in Tilburg register by appointment only, at the Newcomers' Desk in the Stadswinkel Centrum (Spoorlaan 181, 5038 CB Tilburg). Tilburg University says you receive your BSN immediately at the appointment. Bring your passport, a printed copy of your rental contract and, if you need one, your Dutch residence permit or IND approval letter. Fontys also asks for an original birth certificate and its declaration of acceptance. You need permanent accommodation: hostels, hotels and Airbnb-type stays do not count.","registration_url":"https://winkel.tilburg.nl/formulieren/server/start/AfspraakMakenStudent","student_registration_days":null},{"booking_note":null,"id":"tynaarlo","intl_centre_name":null,"intl_centre_url":null,"is_study_city":false,"last_verified":"2026-10-19","name":"Tynaarlo","near_city_id":"groningen","note":"Drenthe municipality just south of Groningen city (villages such as Eelde, Paterswolde and Zuidlaren); this is its 'Eerste inschrijving in Nederland' (first registration) page.","registration_summary":null,"registration_url":"https://www.tynaarlo.nl/burgerzaken/verhuizen/eerste-inschrijving-nederland","student_registration_days":null},{"booking_note":"Book an appointment via the Utrecht International Center's 'register as a new student' page within 5 days of arrival.","id":"utrecht","intl_centre_name":"Utrecht International Center","intl_centre_url":"https://www.utrechtinternationalcenter.com/uic/formalities/registration/register-as-a-new-student","is_study_city":true,"last_verified":"2026-10-19","name":"Utrecht","near_city_id":null,"note":null,"registration_summary":"International students staying more than 4 months must book an appointment to register within 5 days of arriving in the Netherlands. Registration takes place at the Utrecht International Center, and you book through its 'register as a new student' page. Bring your passport or ID, a rental contract (or the proprietor's signed address form) and, if applicable, your residence permit, MVV or proof of application; registration gives you your BSN.","registration_url":"https://www.utrecht.nl/city-of-utrecht/registration/registration-international-students","student_registration_days":null},{"booking_note":null,"id":"veldhoven","intl_centre_name":null,"intl_centre_url":null,"is_study_city":false,"last_verified":"2026-10-19","name":"Veldhoven","near_city_id":"eindhoven","note":"Borders Eindhoven; TU/e says students living outside Eindhoven must book registration directly with their own municipality.","registration_summary":null,"registration_url":"https://veldhoven.nl/english/settling-in-the-netherlands","student_registration_days":null},{"booking_note":"Your university normally books for you. To book earlier yourself, use the municipality's page for people moving to Venlo from abroad. The municipality's website is in Dutch.","id":"venlo","intl_centre_name":null,"intl_centre_url":null,"is_study_city":true,"last_verified":"2026-11-12","name":"Venlo","near_city_id":null,"note":null,"registration_summary":"Register by appointment at the Stadskantoor (Hanzeplaats 1, 5912 AT Venlo) within five weekdays of arrival if you stay longer than four months. Maastricht University reserves appointments for its Campus Venlo students during Introduction Week and emails the details in June; the Fontys Student Service Centre books the appointment for Fontys students. The BSN can take up to five weeks, so register early. Bring your passport or ID, an original birth certificate plus a copy (legalised or with an apostille where required, with a certified translation if it is not in English, Dutch, French or German), proof of enrolment, a signed rental agreement and, for non-EU students, your residence permit or the visa decision email. Fontys says proof of civil status is always required in Venlo.","registration_url":"https://www.venlo.nl/verhuizen-vanuit-buitenland-naar-venlo","student_registration_days":null},{"booking_note":null,"id":"voorschoten","intl_centre_name":null,"intl_centre_url":null,"is_study_city":false,"last_verified":"2026-10-19","name":"Voorschoten","near_city_id":"leiden","note":"Neighbouring municipality whose first-registration process is covered on Leiden University's town hall registration page.","registration_summary":null,"registration_url":"https://www.voorschoten.nl/first-registration-in-the-netherlands","student_registration_days":null},{"booking_note":null,"id":"westerkwartier","intl_centre_name":null,"intl_centre_url":null,"is_study_city":false,"last_verified":"2026-10-19","name":"Westerkwartier","near_city_id":"groningen","note":"Municipality just west of Groningen city (including Zuidhorn and Leek); this is its 'Verhuizen naar Nederland' (moving to the Netherlands) page.","registration_summary":null,"registration_url":"https://www.westerkwartier.nl/verhuizen-naar-nederland","student_registration_days":null},{"booking_note":null,"id":"zeist","intl_centre_name":null,"intl_centre_url":null,"is_study_city":false,"last_verified":"2026-10-19","name":"Zeist","near_city_id":"utrecht","note":"Municipality bordering Utrecht to the east, close to Utrecht Science Park; the link is Zeist's address-declaration form.","registration_summary":null,"registration_url":"https://www.zeist.nl/fileadmin/bestanden/Open_gemeenten_nieuwe_bestandenboom/Verhuizen_en__ver_bouwen/Verhuizen/Aangifte-van-verhuizing.pdf","student_registration_days":null},{"booking_note":"Book online or call 14 079. Zoetermeer has no special student registration days.","id":"zoetermeer","intl_centre_name":null,"intl_centre_url":null,"is_study_city":true,"last_verified":"2026-11-12","name":"Zoetermeer","near_city_id":"the-hague","note":"THUAS has a campus here (Bleiswijkseweg 37). Zoetermeer is outside The Hague International Centre's service area, so you register with Zoetermeer itself.","registration_summary":"Register in person at the municipality of Zoetermeer (Engelandlaan 502, 2711 EB Zoetermeer) no later than the fifth day after you move in, if you will stay in the Netherlands at least 4 of the next 6 months. Registration is free.","registration_url":"https://en.zoetermeer.nl/form/afspraak-eerste-inschrijving-of-hervestiging-of-herinschrijving-vanuit-buitenland/eerste-inschrijving-0","student_registration_days":false}],"scam_questions":[{"explanation":"The classic deposit scam. Pay only after a viewing (in person or a live video call you control) and a signed contract.","id":1,"question":"Are you asked to pay a deposit or rent before you have seen the room or signed a contract?","source_id":"nltimes-2026a","weight":5},{"explanation":"A very common scam story. Ask a friend or someone from your university to view it, or ask for a live video tour.","id":2,"question":"Does the landlord say they are abroad and cannot show you the room?","source_id":null,"weight":5},{"explanation":"Huurteam Nederland reports a growing number of scams via Facebook.","id":3,"question":"Did you find the offer in a Facebook or social media group instead of a verified platform?","source_id":"huurteam-scams","weight":3},{"explanation":"If it looks too good to be true, it usually is.","id":4,"question":"Is the rent much lower than similar rooms in the same area?","source_id":null,"weight":4},{"explanation":"Pressure stops you from checking. A real landlord can wait a day.","id":5,"question":"Are you pushed to decide or pay within hours?","source_id":null,"weight":3},{"explanation":"Without registration you get no BSN, so no job, Dutch insurance or DigiD. Do not accept this.","id":6,"question":"Will the landlord refuse to let you register at the address?","source_id":"ucr-bsn","weight":5},{"explanation":"These payments cannot be reversed. Pay by bank transfer to an account in a name you can check.","id":7,"question":"Are you asked to pay in cash, crypto, gift cards or via a money transfer service?","source_id":null,"weight":4},{"explanation":"Not always a scam, but over half of international students saw higher rents and 75% saw \"no internationals\" ads. Discrimination can be reported; the LSVb hotline can advise.","id":8,"question":"Is the rent higher because you are an international, or does the ad say \"no internationals\"?","source_id":"iamexpat-2026","weight":2}],"services":[{"accepting_students":null,"city":"National","description":"Student union advice on rental problems and scams.","for_institution_id":null,"id":12,"last_verified":"2026-09-28","municipality_id":null,"name":"LSVb Housing Hotline","related_step_id":"find_housing","source_id":"nltimes-2026a","type":"support","url":"https://lsvb.nl"},{"accepting_students":null,"city":"Amsterdam","description":"Student housing provider listed by UvA for university housing rooms.","for_institution_id":null,"id":15,"last_verified":"2026-10-19","municipality_id":"amsterdam","name":"DUWO","related_step_id":"find_housing","source_id":null,"type":"housing","url":"https://www.duwo.nl/en/i-rent/i-have-found-a-room/new-duwo-university-housing-room"},{"accepting_students":null,"city":"Amsterdam","description":"Amsterdam housing corporation listed by UvA as a provider of rooms for international students.","for_institution_id":null,"id":16,"last_verified":"2026-10-19","municipality_id":"amsterdam","name":"Lieven de Key","related_step_id":"find_housing","source_id":null,"type":"housing" ty's student housing page. The city notes that most Delft institutions help international students apply for housing.","for_institution_id":null,"id":79,"last_verified":"2026-10-19","municipality_id":"delft","name":"City of Delft student housing information","related_step_id":"find_housing","source_id":null,"type":"housing","url":"https://www.delft.nl/en/student-housing"},{"accepting_students":true,"city":"Delft","description":"Student GP practice (campus drop-in at Leeghwaterstraat 152, appointments at Kampveld 10A) recommended in TU Delft's Delta magazine; the article dates from 2017.","for_institution_id":null,"id":80,"last_verified":"2026-10-19","municipality_id":"delft","name":"SGZ Student Health Care","related_step_id":"register_gp","source_id":null,"type":"gp","url":"https://www.sgzstudent.nl/student-health-care/introduction"},{"accepting_students":null,"city":"Delft","description":"TU Delft's introduction programme for new master/international students, usually in the last week of August; the page content seen referred to 2020, so check current dates.","for_institution_id":null,"id":81,"last_verified":"2026-10-19","municipality_id":"delft","name":"TU Delft Introduction Programme (MSc, exchange and bridging students)","related_step_id":"intro_week","source_id":null,"type":"community","url":"https://www.tudelft.nl:443/en/education/practical-matters/introduction-period/msc-and-bridging-august"},{"accepting_students":null,"city":"Delft","description":"Out-of-hours GP service in the Reinier de Graaf hospital building, weekdays 17:00-08:00 and 24h at weekends (per Delta, 2017).","for_institution_id":null,"id":82,"last_verified":"2026-10-19","municipality_id":"delft","name":"Huisartsenpost Delft (out-of-hours GP)","related_step_id":null,"source_id":null,"type":"support","url":"http://www.huisartsenpostdelft.nl/english/"},{"accepting_students":null,"city":"Delft","description":"City page on registering in the BRP; register within 5 days of arrival by online appointment.","for_institution_id":null,"id":83,"last_verified":"2026-10-19","municipality_id":"delft","name":"Gemeente Delft: registration for international students","related_step_id":null,"source_id":null,"type":"government","url":"https://www.delft.nl/en/registration-international-students"},{"accepting_students":null,"city":"Delft","description":"Handles BRP registration and formalities in one place for internationals who work for an IND-recognised sponsor. Delft students register at the Delft city office instead.","for_institution_id":null,"id":84,"last_verified":"2026-10-19","municipality_id":"delft","name":"The Hague International Centre","related_step_id":"book_registration","source_id":null,"type":"government","url":"https://www.thehagueinternationalcentre.nl/relocating/formalities/personal-records-database-brp"},{"accepting_students":null,"city":"Delft","description":"Arrival help for international students: housing, registration, residence permits.","for_institution_id":"tud","id":85,"last_verified":"2026-10-19","municipality_id":"delft","name":"Delft University of Technology international office","related_step_id":null,"source_id":null,"type":"support","url":"https://tudelft.nl/onderwijs/studievoorlichting/praktische-zaken/registration"},{"accepting_students":null,"city":"Delft","description":"Rotterdamseweg 137, 2628 AL Delft, on the TU Delft campus. Technology, engineering and IT programmes, including the English-taught, three-year Applied Computer Science bachelor. Open Monday and Wednesday 08:00 to 22:30, Tuesday and Thursday to 19:30, Friday to 18:00. Phone +31 (0)15 260 62 00.","for_institution_id":"thuas","id":147,"last_verified":"2026-11-12","municipality_id":"delft","name":"THUAS Delft campus","related_step_id":null,"source_id":null,"type":"support","url":"https://www.thuas.com/about-thuas/contact/location-delft"},{"accepting_students":null,"city":"Delft","description":"Help with accommodation, municipal registration, residence permits, health insuranc ind":{"official":false,"publisher":"StudyPath","title":"IND delays: timeline expectations","url":"https://studypath.nl/blog/ind-delays-timeline-expectations"},"studypath-scams":{"official":false,"publisher":"StudyPath","title":"Kamernet survival guide: how to spot housing scams","url":"https://studypath.nl/blog/kamernet-housing-scams-netherlands"},"thic-housing":{"official":true,"publisher":"The Hague International Centre","title":"Student housing","url":"https://www.thehagueinternationalcentre.nl/living-in-the-hague-region/families-and-children/relocating/why-the-hague-region/education-and-childcare/study-in-the-hague-region/student-housing"},"thic-registration":{"official":true,"publisher":"The Hague International Centre","title":"Registration for students","url":"https://www.thehagueinternationalcentre.nl/relocating/registration-procedure/sponsored/registration-for-students"},"thuas-arrival":{"official":true,"publisher":"THUAS","title":"Arrival services","url":"https://www.thuas.com/study-choice/international-office/arrival-services"},"thuas-housing":{"official":true,"publisher":"THUAS","title":"Housing","url":"https://www.thuas.com/study-choice/international-office/housing"},"thuas-io":{"official":true,"publisher":"THUAS","title":"International Office","url":"https://www.thuas.com/study-choice/international-office"},"ucr-bsn":{"official":true,"publisher":"University College Roosevelt","title":"What is BSN and why do international students need it?","url":"https://ucr.nl/knowledgebase/what-is-bsn-and-why-do-international-students-in-the-netherlands-need-it/"},"utwente-insurance":{"official":true,"publisher":"University of Twente","title":"Arrange your insurance","url":"https://www.utwente.nl/en/education/student-services/upcoming-students/visa/insurance/"},"uva-bank":{"official":true,"publisher":"University of Amsterdam","title":"Opening a Dutch bank account","url":"https://www.uva.nl/en/education/practical-information/opening-a-dutch-bank-account/opening-a-dutch-bank-account.html"},"wijzer-zorg-2026":{"official":true,"publisher":"Wijzer in geldzaken (Ministry of Finance)","title":"Veranderingen rondom de zorg in 2026","url":"https://www.wijzeringeldzaken.nl/actueel/veranderingen-rondom-de-zorg-in-2026/veranderingen-rondom-de-zorg-in-2026.pdf"}},"step_local":[{"body":"You live in Amstelveen, so you register with the municipality of Amstelveen, not Amsterdam.\nStudent registration days or online pre-registration run by Amsterdam may not apply to you. Check Amstelveen's own page.\nCheck whether IN Amsterdam serves Amstelveen before you book there.","last_verified":"2026-10-19","links":[{"label":"Registering in Amstelveen","url":"https://www.amstelveen.nl/vertrek-en-verhuizing"}],"municipality_id":"amstelveen","step_id":"book_registration"},{"body":"International students first pre-register online with the City of Amsterdam (for Fall 2026 the window ran 13 July to 18 September 2026); universities do not do this for you. Once approved, you get an email to book an in-person slot on a student registration day (17 August to 25 September 2026) at Bos en Lommerplein 176, 1055 RW Amsterdam, where the BSN is issued quickly. Students who miss the pre-registration window book a regular first-registration appointment instead, which universities warn can delay the BSN by weeks.\nPre-register online, then book a student-registration-day slot via the email link; late arrivals call +31 20 624 1111 for a regular appointment, and HvA expects Spring 2027 pre-registration dates around December/January.\nIN Amsterdam: Newcomer centre where internationals book one in-person appointment for municipal registration, and where VU says IND matters for its international staff and guests are handled in the same visit.","last_verified":"2026-10-19","links":[{"label":"Registering in Amsterdam","url":"https://www.amsterdam.nl/en/civil-affairs/pre-registration-for-students/"},{"label":"IN Amsterdam","url":"https://www.iamsterdam.com/en/live-work-study/in-amsterdam/international-newcomers/make-an-appointment-individuals"}],"municipality_id":"amsterdam","step_id":"book_registration"},{"body":"You live in Diemen, so you register with the municipality of Diemen, not Amsterdam.\nStudent registration days or online pre-registration run by Amsterdam may not apply to you. Check Diemen's own page.\nCheck whether IN Amsterdam serves Diemen before you book there.","last_verified":"2026-10-19","links":[{"label":"Registering in Diemen","url":"https://diemen.mijnafspraakmaken.nl/Client/#?product=32"}],"municipality_id":"diemen","step_id":"book_registration"},{"body":"University of Amsterdam: Non-EU students collect their residence permit only at the IND office in Amsterdam, by appointment booked at https://ind.nl/en/appointment-to-collect-document. The permit is usually ready about 3 weeks after biometrics, and you check its status in MyIND. UvA also runs centralised collection days in August/September.\nVrije Universiteit Amsterdam: New non-EU students who need only a residence permit (VVR) book an IND appointment to collect the card soon after arrival; slots are limited, so VU advises checking the IND appointment tool often for cancellations. The page does not name which IND desk.\nAmsterdam University of Applied Sciences (HvA): For September 2026 starters, the IND held central collection days at the Jaarbeurs (Beatrixgebouw) in Utrecht on Sat 29 Aug and Sat 19 Sep 2026, and the IND asks students to book a time slot. The rest of the year, AUAS Immigration Affairs emails you when the permit is ready and explains how to book an IND desk appointment online (bring your passport).","last_verified":"2026-10-19","links":[{"label":"University of Amsterdam international office","url":"https://www.uva.nl/en/education/practical-information/checklist-for-international-students/checklist-international-students.html"},{"label":"Vrije Universiteit Amsterdam international office","url":"https://vu.nl/en/education/more-about/when-you-arrive"},{"label":"Amsterdam University of Applied Sciences (HvA) international office","url":"https://www.amsterdamuas.com/study/international-admissions/upon-arrival"}],"municipality_id":"amsterdam","step_id":"collect_permit"},{"body":"University of Amsterdam students: UvA Housing (practical information). UvA housing information page; it works with providers including DUWO, Lieven de Key, StuNest Spartaan, Student Experience, The Social Hub Amsterdam West and Hubstudios.\nVrije Universiteit Amsterdam students: VU Accommodation. VU's student accommodation page; keys and housing emails come from your housing provider. Its residences include Uilenstede (Amstelveen) and buildings in Diemen.\nAmsterdam University of Applied Sciences (HvA) students: AUAS Housing. AUAS housing information for international students, with a separate guide to finding housing on your own.\nDUWO: Student housing provider listed by UvA for university housing rooms.\nLieven de Key: Amsterdam housing corporation listed by UvA as a provider of rooms for international students.\nThe Social Hub Amsterdam West: Private student stay listed by UvA and VU among their housing options.","last_verified":"2026-10-19","links":[{"label":"UvA Housing (practical information)","url":"https://www.uva.nl/en/education/practical-information/housing/housing.html"},{"label":"VU Accommodation","url":"https://vu.nl/en/student/accommodation"},{"label":"AUAS Housing","url":"https://www.amsterdamuas.com/study/international-admissions/housing"},{"label":"DUWO","url":"https://www.duwo.nl/en/i-rent/i-have-found-a-room/new-duwo-university-housing-room"},{"label":"Lieven de Key","url":"https://lievendekey.guestinfo.com/EN-GB"},{"label":"The Social Hub Amsterdam West","url":"https://www.thesocialhub.co/amsterdam-west/stay/student-stay/"}],"municipality_id":"amsterdam","step_id":"find_housing"},{"body":"VU Onboarding for international students: VU welcome programme for new international students, including Master's introduction days, Jumpstart and Practical Matters Days.","last_verified":"2026-10-19","links":[{"label":"VU Onboarding for international students","url":"https://vu.nl/en/education/more-about/onboarding-international-students"}],"municipality_id":"amsterdam","step_id":"intro_week"},{"body":"Erasmus Student Network Amsterdam (ESN Amsterdam): UvA student-site page on ESN Amsterdam, the international student association.","last_verified":"2026-10-19","links":[{"label":"Erasmus Student Network Amsterdam (ESN Amsterdam)","url":"https://student.uva.nl/en/information/erasmus-student-network-amsterdam-esn-amsterdam"}],"municipality_id":"amsterdam","step_id":"join_community"},{"body":"Universitaire Huisartsenpraktijk (UHP), Amsterdam UMC/VUmc: University GP practice where VU international students can register online; students living outside Amsterdam can choose a GP near home.\nUvA General Practitioners Practice (Huisartsen Oude Turfmarkt): Listed by the University of Amsterdam for its students. It has GPs who know student life, at the Oude Turfmarkt, and UvA students can stay registered there wherever they live in Amsterdam. AUC also lists it, at Oude Turfmarkt 151.\nHuisartsenposten Amsterdam (out-of-hours GP): Out-of-hours GP service for evenings, nights and weekends, linked from the UvA GP practice page.","last_verified":"2026-10-19","links":[{"label":"GGD Amsterdam","url":"https://www.ggd.amsterdam.nl/english/tuberculosis/letter-ind/"},{"label":"Huisartsenposten Amsterdam (out-of-hours GP)","url":"https://huisartsenpostenamsterdam.nl/en/"}],"municipality_id":"amsterdam","step_id":"register_gp"},{"body":"You live in Amstelveen, so you register with the municipality of Amstelveen, not Amsterdam.\nStudent registration days or online pre-registration run by Amsterdam may not apply to you. Check Amstelveen's own page.\nCheck whether IN Amsterdam serves Amstelveen before you book there.","last_verified":"2026-10-19","links":[{"label":"Registering in Amstelveen","url":"https://www.amstelveen.nl/vertrek-en-verhuizing"}],"municipality_id":"amstelveen","step_id":"register_municipality"},{"body":"Your appointment is with the municipality of Amsterdam.\nPre-register online, then book a student-registration-day slot via the email link; late arrivals call +31 20 624 1111 for a regular appointment, and HvA expects Spring 2027 pre-registration dates around December/January.","last_verified":"2026-10-19","links":[{"label":"Registering in Amsterdam","url":"https://www.amsterdam.nl/en/civil-affairs/pre-registration-for-students/"},{"label":"IN Amsterdam","url":"https://www.iamsterdam.com/en/live-work-study/in-amsterdam/international-newcomers/make-an-appointment-individuals"}],"municipality_id":"amsterdam","step_id":"register_municipality"},{"body":"You live in Diemen, so you register with the municipality of Diemen, not Amsterdam.\nStudent registration days or online pre-registration run by Amsterdam may not apply to you. Check Diemen's own page.\nCheck whether IN Amsterdam serves Diemen before you book there.","last_verified":"2026-10-19","links":[{"label":"Registering in Diemen","url":"https://diemen.mijnafspraakmaken.nl/Client/#?product=32"}],"municipality_id":"diemen","step_id":"register_municipality"},{"body":"GGD Amsterdam runs the TB check for Amsterdam. English page for people the IND has referred for a TB test. It covers Amsterdam and nearby municipalities, including Amstelveen, Diemen and Weesp. You register with the online form and the GGD sends you an appointment letter. Bring your passport/ID, the IND referral form and a debit card. The test is not free, and the TB team's phone number is 020 555 5911.","last_verified":"2026-10-19","links":[{"label":"GGD Amsterdam","url":"https://www.ggd.amsterdam.nl/english/tuberculosis/letter-ind/"}],"municipality_id":"amsterdam","step_id":"tb_test"},{"body":"City page on registering in the BRP; register within 5 days of arrival by online appointment.\nBook online at https://www.delft.nl/registration. You can only book once your rental agreement has started.\nThe Hague International Centre: Handles BRP registration and formalities in one place for internationals who work for an IND-recognised sponsor. Delft students register at the Delft city office instead.","last_verified":"2026-10-19","links":[{"label":"Registering in Delft","url":"https://www.delft.nl/en/registration-international-students"},{"label":"The Hague International Centre","url":"https://www.thehagueinternationalcentre.nl/relocating/formalities/personal-records-database-brp"}],"municipality_id":"delft","step_id":"book_registration"},{"body":"You live in Rijswijk, so you register with the municipality of Rijswijk, not Delft.\nStudent registration days or online pre-registration run by Delft may not apply to you. Check Rijswijk's own page.\nThe Hague International Centre also serves Rijswijk, so you can still use it.","last_verified":"2026-10-19","links":[{"label":"Registering in Rijswijk","url":"https://www.rijswijk.nl/inwoners/product/inschrijven-in-nederland-voor-studie-of-werk"}],"municipality_id":"rijswijk","step_id":"book_registration"},{"body":"THUAS, Delft campus: Non-EU students collect their permit at a central IND collection day at the Jaarbeurs in Utrecht. THUAS invites you to book once the IND has approved it.","last_verified":"2026-11-12","links":[{"label":"THUAS International Office","url":"https://www.thuas.com/study-choice/international-office"}],"municipality_id":"delft","step_id":"collect_permit"},{"body":"DUWO: Main student housing corporation in Delft (also in Leiden and The Hague).\nCity of Delft student housing information: Municipality's student housing page. The city notes that most Delft institutions help international students apply for housing.","last_verified":"2026-10-19","links":[{"label":"DUWO","url":"https://duwo.nl/en"},{"label":"City of Delft student housing information","url":"https://www.delft.nl/en/student-housing"}],"municipality_id":"delft","step_id":"find_housing"},{"body":"TU Delft Introduction Programme (MSc, exchange and bridging students): TU Delft's introduction programme for new master/international students, usually in the last week of August; the page content seen referred to 2020, so check current dates.","last_verified":"2026-10-19","links":[{"label":"TU Delft Introduction Programme (MSc, exchange and bridging students)","url":"https://www.tudelft.nl:443/en/education/practical-matters/introduction-period/msc-and-bridging-august"}],"municipality_id":"delft","step_id":"intro_week"},{"body":"SGZ Student Health Care: Student GP practice (campus drop-in at Leeghwaterstraat 152, appointments at Kampveld 10A) recommended in TU Delft's Delta magazine; the article dates from 2017.\nHuisartsenpost Delft (out-of-hours GP): Out-of-hours GP service in the Reinier de Graaf hospital building, weekdays 17:00-08:00 and 24h at weekends (per Delta, 2017).","last_verified":"2026-10-19","links":[{"label":"SGZ Student Health Care","url":"https://www.sgzstudent.nl/student-health-care/introduction"},{"label":"Huisartsenpost Delft (out-of-hours GP)","url":"http://www.huisartsenpostdelft.nl/english/"}],"municipality_id":"delft","step_id":"register_gp"},{"body":"Your appointment is with the municipality of Delft.\nBook online at https://www.delft.nl/registration. You can only book once your rental agreement has started.","last_verified":"2026-10-19","links":[{"label":"Registering in Delft","url":"https://www.delft.nl/en/registration-international-students"},{"label":"The Hague International Centre","url":"https://www.thehagueinternationalcentre.nl/relocating/formalities/personal-records-database-brp"}],"municipality_id":"delft","step_id":"register_municipality"},{"body":"You live in Rijswijk, so you register with the municipality of Rijswijk, not Delft.\nStudent registration days or online pre-registration run by Delft may not apply to you. Check Rijswijk's own page.\nThe Hague International Centre also serves Rijswijk, so you can still use it.","last_verified":"2026-10-19","links":[{"label":"Registering in Rijswijk","url":"https://www.rijswijk.nl/inwoners/product/inschrijven-in-nederland-voor-studie-of-werk"}],"municipality_id":"rijswijk","step_id":"register_municipality"},{"body":"Saxion runs BSN registration days with the municipality at Deventer City Hall (Grote Kerkhof 1, 7411 KZ Deventer): Thursdays 3, 10, 17 and 24 September 2026, 09:00 to 16:00. Saxion schedules your appointment and emails the invitation at the end of August; you cannot choose or change the slot. Bring your passport or ID card, a colour copy of it and a signed copy of your rental agreement, all printed single-sided. The appointment takes about 15 minutes.\nOutside Saxion's registration days, call Gemeente Deventer on 14 0570 to book an individual in-person appointment at Deventer City Hall within 5 days of arrival (bring passport/ID, proof of housing/toestemmingsverklaring, IND status if non-EU, and legalised/translated birth certificate if born abroad; confirmation arrives within ~5 working days). If you do not live in Deventer, register where you live.","last_verified":"2026-11-22","links":[{"label":"Saxion BSN registration days, Deventer","url":"https://www.saxion.edu/events/2026/september/bsn-registration-day-deventer"},{"label":"Gemeente Deventer: Moving to the Netherlands","url":"https://www.deventer.nl/verhuizen-naar-nederland"}],"municipality_id":"deventer","step_id":"book_registration"},{"body":"Your appointment is with the municipality of Deventer (Grote Kerkhof 1).\nSaxion students get a fixed slot by email at the end of August. If you already have a BSN or do not live in Deventer, email the Saxion International Office so the slot can be cancelled. Arriving outside Saxion's registration days? Call 14 0570 to book an individual BRP appointment; written confirmation arrives within ~5 working days.","last_verified":"2026-11-22","links":[{"label":"Saxion BSN registration days, Deventer","url":"https://www.saxion.edu/events/2026/september/bsn-registration-day-deventer"},{"label":"Gemeente Deventer: Moving to the Netherlands","url":"https://www.deventer.nl/verhuizen-naar-nederland"}],"municipality_id":"deventer","step_id":"register_municipality"},{"body":"Foreign students staying at least 4 of the coming 6 months must register in person at the municipality's Residents' Plaza (Stadhuisplein 1), preferably within 5 days of arrival, after first booking an appointment online (separate booking links for EU and non-EU students). Bring a valid passport, IND documents if applicable, original (legalised) foreign documents such as a birth certificate, and your rental contract; the BSN confirmation letter arrives within about 4 weeks. TU/e gives its students access to a booking portal with slots prioritized for TU/e students during the Bachelor Introduction Week or Master Kick-off, and some Fontys study departments arrange the appointment for their international students.\nBook online before going (EU: https://eindhoven.mijnafspraakmaken.nl/client/#?product=6, non-EU: https://eindhoven.mijnafspraakmaken.nl/client/#?product=64) or by phone on 14 040; availability can be limited in peak periods.\nHolland Expat Center South: Handles formal settlement procedures (municipal registration and residence documents) for internationals in participating municipalities, including an accelerated combined procedure for certain EU/non-EU categories and collection of some residence/work permits; people not eligible are referred to their local municipality.","last_verified":"2026-10-19","links":[{"label":"Registering in Eindhoven","url":"https://www.eindhoven.nl/stad-en-wonen/wonen/registration-of-foreign-students"},{"label":"Holland Expat Center South","url":"https://www.hollandexpatcenter.com/"}],"municipality_id":"eindhoven","step_id":"book_registration"},{"body":"You live in Nuenen, so you register with the municipality of Nuenen, not Eindhoven.\nStudent registration days or online pre-registration run by Eindhoven may not apply to you. Check Nuenen's own page.\nCheck whether Holland Expat Center South serves Nuenen before you book there.","last_verified":"2026-10-19","links":[{"label":"Registering in Nuenen","url":"https://en.nuenen.nl/verhuizen-naar-nederland"}],"municipality_id":"nuenen","step_id":"book_registration"},{"body":"You live in Son en Breugel, so you register with the municipality of Son en Breugel, not Eindhoven.\nStudent registration days or online pre-registration run by Eindhoven may not apply to you. Check Son en Breugel's own page.\nCheck whether Holland Expat Center South serves Son en Breugel before you book there.","last_verified":"2026-10-19","links":[{"label":"Registering in Son en Breugel","url":"https://en.sonenbreugel.nl/verhuizen-naar-nederland"}],"municipality_id":"son-en-breugel","step_id":"book_registration"},{"body":"You live in Veldhoven, so you register with the municipality of Veldhoven, not Eindhoven.\nStudent registration days or online pre-registration run by Eindhoven may not apply to you. Check Veldhoven's own page.\nCheck whether Holland Expat Center South serves Veldhoven before you book there.","last_verified":"2026-10-19","links":[{"label":"Registering in Veldhoven","url":"https://veldhoven.nl/english/settling-in-the-netherlands"}],"municipality_id":"veldhoven","step_id":"book_registration"},{"body":"Eindhoven University of Technology (TU/e): TU/e (exchange-student services page) says it arranges for students to receive their residence permit card in Eindhoven; Holland Expat Center South (Stadhuisplein 10, Eindhoven) is an IND-listed location that issues residence documents. Exact pickup arrangement for degree students not confirmed.\nFontys University of Applied Sciences: Fontys only says to pick up your residence permit (VVR) soon after arrival, without naming a location; collect where your IND letter tells you to (in Eindhoven, Holland Expat Center South issues residence documents).","last_verified":"2026-10-19","links":[{"label":"Eindhoven University of Technology (TU/e) international office","url":"https://educationguide.tue.nl/practical-info/information-for-international-students"},{"label":"Fontys University of Applied Sciences international office","url":"https://www.fontys.nl/en/Fontys-Helps/Practical-information-52/City-hall-registration.htm"}],"municipality_id":"eindhoven","step_id":"collect_permit"},{"body":"Eindhoven University of Technology (TU/e) students: TU/e Housing. TU/e's housing information section for incoming students, linked from its city hall registration guide.\nFontys University of Applied Sciences students: Fontys Accommodation. Fontys has no halls of its own but works with trusted landlords/agencies for students living abroad on English-taught programmes (deadlines 15 June for fall, 8 December for spring; no guaranteed room).\nVestide: Student housing provider; listed by Fontys among housing agencies for Eindhoven.\nHolland2Stay: Commercial furnished-housing provider in Eindhoven, listed by Fontys as a commercial agency.\nHuurteam Eindhoven: Free rental advice team the municipality points students to for rental problems.","last_verified":"2026-10-19","links":[{"label":"TU/e Housing","url":"https://www.tue.nl/en/education/become-a-tue-student/housing"},{"label":"Fontys Accommodation","url":"https://www.fontys.nl/en/Fontys-Helps/Practical-information-52/Accommodation.htm"},{"label":"Vestide","url":"https://vestide.nl/en/about-us"},{"label":"Holland2Stay","url":"https://www.holland2stay.com/blog/student-life-eindhoven"},{"label":"Huurteam Eindhoven","url":"https://huurteameindhoven.nl/"}],"municipality_id":"eindhoven","step_id":"find_housing"},{"body":"Welcome & Enrollment @TU/e (international Master students): TU/e welcome and enrollment programme for incoming international Master students; Bachelor Introduction Week / Master Kick-off is when TU/e opens its municipal booking portal.","last_verified":"2026-10-19","links":[{"label":"Welcome & Enrollment @TU/e (international Master students)","url":"https://www.tue.nl/en/education/become-a-tue-student/admission-and-enrollment/welcome-enrollment-tue-for-international-master-students"}],"municipality_id":"eindhoven","step_id":"intro_week"},{"body":"Stroomz - De Ring International: Recommended GP option on TU/e's Education Guide health-care page for international students.\nMedisch Kwartier Eindhoven: Recommended GP option on TU/e's Education Guide health-care page for international students.\nHuisarts Zuidoost-Brabant (GP finder): Regional GP finder that TU/e points students to for checking which practices in the Eindhoven region accept new patients (not a practice itself).\nTU/e: Dutch healthcare system explained: TU/e guide on registering with a GP early (waiting lists), referrals and the out-of-hours Spoedpost at Catharina Hospital (Michelangelolaan 2).","last_verified":"2026-10-19","links":[{"label":"GGD Brabant-Zuidoost","url":"https://www.ggdbzo.nl/tuberculose/immigranten-en-expats/"},{"label":"TU/e: Dutch healthcare system explained","url":"https://www.tue.nl/en/education/become-a-tue-student/dutch-healthcare-system-explained"}],"municipality_id":"eindhoven","step_id":"register_gp"},{"body":"Your appointment is with the municipality of Eindhoven.\nBook online before going (EU: https://eindhoven.mijnafspraakmaken.nl/client/#?product=6, non-EU: https://eindhoven.mijnafspraakmaken.nl/client/#?product=64) or by phone on 14 040; availability can be limited in peak periods.","last_verified":"2026-10-19","links":[{"label":"Registering in Eindhoven","url":"https://www.eindhoven.nl/stad-en-wonen/wonen/registration-of-foreign-students"},{"label":"Holland Expat Center South","url":"https://www.hollandexpatcenter.com/"}],"municipality_id":"eindhoven","step_id":"register_municipality"},{"body":"You live in Nuenen, so you register with the municipality of Nuenen, not Eindhoven.\nStudent registration days or online pre-registration run by Eindhoven may not apply to you. Check Nuenen's own page.\nCheck whether Holland Expat Center South serves Nuenen before you book there.","last_verified":"2026-10-19","links":[{"label":"Registering in Nuenen","url":"https://en.nuenen.nl/verhuizen-naar-nederland"}],"municipality_id":"nuenen","step_id":"register_municipality"},{"body":"You live in Son en Breugel, so you register with the municipality of Son en Breugel, not Eindhoven.\nStudent registration days or online pre-registration run by Eindhoven may not apply to you. Check Son en Breugel's own page.\nCheck whether Holland Expat Center South serves Son en Breugel before you book there.","last_verified":"2026-10-19","links":[{"label":"Registering in Son en Breugel","url":"https://en.sonenbreugel.nl/verhuizen-naar-nederland"}],"municipality_id":"son-en-breugel","step_id":"register_municipality"},{"body":"You live in Veldhoven, so you register with the municipality of Veldhoven, not Eindhoven.\nStudent registration days or online pre-registration run by Eindhoven may not apply to you. Check Veldhoven's own page.\nCheck whether Holland Expat Center South serves Veldhoven before you book there.","last_verified":"2026-10-19","links":[{"label":"Registering in Veldhoven","url":"https://veldhoven.nl/english/settling-in-the-netherlands"}],"municipality_id":"veldhoven","step_id":"register_municipality"},{"body":"GGD Brabant-Zuidoost runs the TB check for Eindhoven. TB screening page for immigrants and expats referred by the IND: register via the online form (one per person), appointment comes by email; chest X-ray costs EUR 56 paid at the appointment; TB team: tuberculosebestrijding@ggdbzo.nl.","last_verified":"2026-10-19","links":[{"label":"GGD Brabant-Zuidoost","url":"https://www.ggdbzo.nl/tuberculose/immigranten-en-expats/"}],"municipality_id":"eindhoven","step_id":"tb_test"},{"body":"TU/e Student Wellbeing: TU/e's student wellbeing hub (student counsellors, psychologists, extra support).\n113 Suicide Prevention (English): National 24/7 phone and chat support, listed by TU/e on its
